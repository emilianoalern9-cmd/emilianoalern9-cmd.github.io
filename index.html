<style>
:root {
  --bg-color: #0f0c18;
  --header-bg: rgba(10, 8, 18, 0.95);
  --card-bg: rgba(18, 15, 30, 0.85);
  --card-hover-border: #e6c275;
  --text-primary: #f0eef7;
  --text-secondary: #e5dccf;
  --accent: #e0bc6c;
  --accent-hover: #f3d27e;
  --border-color: #dbba6c;
  --badge-morfologia: #8b5a2b;
  --badge-tipo: #3a6ea5;
  --badge-elemento: #2f6b4a;
  --badge-avistamiento: #7a3b6e;
  --btn-active-bg: #2a2345;
  --filter-active-border: #f3d27e;
  --filter-active-shadow: 0 0 4px #f3d27e;
  --disabled-opacity: 0.5;
  --title-gradient: linear-gradient(135deg, #ffe6b3, #f3d27e, #e0bc6c, #f3d27e, #ffe6b3);
}

html{scroll-padding-top:70px}
body{background:var(--bg-color);color:var(--text-primary);font-family:'Inter',sans-serif;padding:0;position:relative;overflow-x:hidden}
body.modal-open{overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDYiLz48L3N2Zz4=');background-repeat:repeat;pointer-events:none;opacity:.2;z-index:0}
.container,.main-header,.grid-wrapper,#overlay{position:relative;z-index:1}
.main-header{position:sticky;top:0;z-index:100;background:var(--header-bg);padding:8px 16px;padding-right:60px;box-shadow:0 1px 3px rgba(0,0,0,.3);border-bottom:1px solid var(--border-color);overflow:visible;position:relative}
.header-corner{position:absolute;top:0;right:0;height:100%;max-height:100%;width:auto;object-fit:contain;pointer-events:all;z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));cursor:pointer}
@media(max-width:700px){
  .main-header{padding:4px 8px;padding-right:45px}
  .header-corner{max-width:40px}
  h2{font-size:1.2rem!important;margin-bottom:3px}
  .filtro-boton,.btn-limpiar,.fav-filter-btn,.pagination-btn,.config-btn,.help-btn{padding:3px 6px!important;font-size:.7rem!important}
  .result-count{font-size:.65rem!important;padding:1px 6px!important}
  .pagination-controls input{width:30px!important;font-size:.6rem!important}
  .search-wrapper input{width:90px!important;font-size:.65rem!important}
  .filtros-panel{gap:4px}
}
.container{max-width:1400px;margin:0 auto;position:relative;z-index:1}
h2{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:800;letter-spacing:2px;background:var(--title-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;text-shadow:0 0 6px rgba(224,188,108,.3);cursor:pointer;user-select:none}
.filtros-panel{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center;justify-content:flex-start}
.filtros-panel.oculto{display:none}
.filtro-group{position:relative}
.filtro-boton,.btn-limpiar,.export-btn,.random-btn,.theme-btn,.view-btn,.fav-filter-btn,.pagination-btn,.config-btn,.help-btn{background:rgba(25,20,40,.85);border:1px solid var(--border-color);border-radius:40px;padding:5px 10px;font-family:'Cinzel',serif;font-weight:600;color:var(--text-primary);font-size:.9rem;cursor:pointer;transition:transform .1s ease,background .1s;white-space:nowrap;line-height:1;outline:none}
.filtro-boton:disabled,.btn-limpiar:disabled,.fav-filter-btn:disabled,.pagination-btn:disabled,.config-btn:disabled,.limpiar-categoria:disabled{opacity:var(--disabled-opacity);cursor:not-allowed;pointer-events:none}
.search-clear{cursor:pointer;font-size:.9rem;font-weight:700;color:var(--accent);background:none;border:none;padding:0 2px;transition:opacity .2s}
.search-clear.disabled{opacity:var(--disabled-opacity);pointer-events:none;cursor:default}
.search-clear:active:not(.disabled){transform:scale(.9)}
.filtro-menu input:disabled,.rev-filter-menu input:disabled{opacity:var(--disabled-opacity);cursor:not-allowed}
.filtro-menu label:has(input:disabled),.rev-filter-menu label:has(input:disabled){opacity:var(--disabled-opacity);cursor:default}
@media(hover:hover){
  .filtro-boton:hover:not(:disabled),.btn-limpiar:hover:not(:disabled),.export-btn:hover,.random-btn:hover,.theme-btn:hover,.view-btn:hover,.fav-filter-btn:hover:not(:disabled),.pagination-btn:hover:not(:disabled),.config-btn:hover,.help-btn:hover{background:var(--accent-hover);color:#1a1625;border-color:var(--accent)}
  .filtro-menu button:hover,.rev-filter-menu label:hover:has(input:not(:disabled)),.orden-menu button:hover,.items-menu button:hover,.csv-menu button:hover,.config-menu button:hover,.config-submenu button:hover{background:var(--accent-hover);color:#1a1625}
}
.filtro-boton:active:not(:disabled),.btn-limpiar:active:not(:disabled),.export-btn:active,.random-btn:active,.theme-btn:active,.view-btn:active,.fav-filter-btn:active:not(:disabled),.pagination-btn:active:not(:disabled),.config-btn:active,.help-btn:active{background:var(--accent-hover);color:#1a1625;border-color:var(--accent);transform:scale(.98)}
.filtro-boton.active-filter{border-color:var(--filter-active-border);box-shadow:var(--filter-active-shadow)}
.fav-filter-btn.active,.theme-btn.active{background:var(--accent);color:#1a1625;border-color:var(--accent-hover);box-shadow:0 0 4px var(--accent)}
/* Menús flotantes generales */
.filtro-menu,.orden-menu,.items-menu,.csv-menu,.config-menu,.rev-filter-menu,.help-menu{position:absolute;top:110%;left:0;background:rgba(25,20,40,.9);backdrop-filter:blur(8px);border:1px solid var(--border-color);border-radius:20px;padding:8px 12px;min-width:180px;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.4);display:none;flex-direction:column;gap:4px}
.config-menu{min-width:200px}
.help-menu{min-width:240px;white-space:normal}
.help-menu p{font-size:.7rem;margin-bottom:4px;color:#fff;line-height:1.3}
.help-menu hr{margin:4px 0;border-color:var(--border-color)}
.config-submenu{position:absolute;top:0;left:100%;margin-left:5px;background:rgba(25,20,40,.9);backdrop-filter:blur(8px);border:1px solid var(--border-color);border-radius:20px;padding:6px;min-width:100px;display:none;flex-direction:column;gap:4px;z-index:210}
.config-submenu.show,.filtro-menu.show,.orden-menu.show,.items-menu.show,.csv-menu.show,.config-menu.show,.rev-filter-menu.show,.help-menu.show{display:flex}
.filtro-menu label,.rev-filter-menu label,.orden-menu button,.items-menu button,.csv-menu button,.config-menu button,.config-submenu button{background:none;border:none;text-align:left;padding:4px 8px;font-family:'Cinzel',serif;font-size:.7rem;color:#fff;cursor:pointer;border-radius:30px;transition:all .2s;display:flex;align-items:center;width:100%;justify-content:space-between}
.filtro-menu input,.rev-filter-menu input{accent-color:var(--accent);width:14px;height:14px;margin-right:6px;flex-shrink:0}
.filtro-menu .label-text,.rev-filter-menu .label-text{flex-grow:1;margin-right:6px}
.filtro-menu span.count,.rev-filter-menu span.count{color:#b8a87a;font-size:.6rem;flex-shrink:0;margin-left:auto}
.limpiar-categoria{background:rgba(100,70,40,.7);border:1px solid var(--border-color);border-radius:30px;padding:2px 8px;font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-primary);cursor:pointer;margin-top:4px;text-align:center}
.limpiar-categoria:disabled{opacity:var(--disabled-opacity);cursor:not-allowed;pointer-events:none}
/* Overlay */
.menu-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;z-index:199}
/* Menús flotantes modales (genéricos) */
.temp-floating-menu{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(25,20,40,.95);backdrop-filter:blur(12px);
  border:1px solid var(--border-color);border-radius:24px;
  padding:15px 18px;min-width:280px;max-width:90vw;
  z-index:1001;box-shadow:0 15px 35px rgba(0,0,0,.6);
  display:none;flex-direction:column;gap:10px;
}
.temp-floating-menu.show{display:flex}
.temp-floating-menu .temp-header{
  text-align:center;font-family:'Cinzel',serif;color:var(--accent);
  font-weight:600;font-size:.85rem;border-bottom:1px solid var(--border-color);
  padding-bottom:8px;margin-bottom:4px;display:flex;
  justify-content:space-between;align-items:center;
}
.temp-floating-menu .temp-header button{background:none;border:none;font-size:1rem;color:var(--accent);cursor:pointer;padding:0 4px;margin-left:8px}
.temp-floating-menu .slider-container{padding:0 5px}
.temp-floating-menu input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0}
.temp-floating-menu .slider-labels{display:flex;justify-content:space-between;font-size:.65rem;color:var(--text-secondary);padding:0 2px;margin-bottom:4px}
.temp-floating-menu .temp-value{text-align:center;font-family:'Cinzel',serif;color:var(--accent);font-size:.9rem;margin:4px 0}
.temp-floating-menu .rev-options{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.temp-floating-menu .rev-option{
  background:rgba(25,20,40,.85);border:1px solid var(--border-color);
  border-radius:30px;padding:8px 14px;color:var(--text-primary);
  cursor:pointer;font-family:'Cinzel',serif;font-size:.75rem;text-align:center;transition:all .2s
}
.temp-floating-menu .rev-option:hover{background:var(--accent-hover);color:#1a1625}
.temp-floating-menu .rev-option.active{background:var(--accent);color:#1a1625;border-color:var(--accent-hover);box-shadow:0 0 4px var(--accent)}
.temp-floating-menu .temp-actions{display:flex;gap:10px;justify-content:center;margin-top:6px}
.temp-floating-menu .temp-actions button{
  flex:0 0 auto;min-width:44px;width:44px;height:44px;
  background:rgba(100,70,40,.7);border:1px solid var(--border-color);
  border-radius:40px;font-size:1.3rem;color:var(--text-primary);
  cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:500
}
.temp-floating-menu .temp-actions button:hover:not(:disabled){background:var(--accent-hover);color:#1a1625;transform:scale(.96)}
.temp-floating-menu .temp-actions button:active:not(:disabled){transform:scale(.92)}
.temp-floating-menu .temp-actions button:disabled{opacity:var(--disabled-opacity);cursor:not-allowed}
/* Grid para checkboxes en modales */
.modal-checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:50vh;overflow-y:auto;padding:4px 8px;margin-bottom:16px}
.modal-checkbox-grid label{display:flex;align-items:center;gap:8px;font-size:.75rem;cursor:pointer;color:var(--text-primary);background:rgba(0,0,0,.2);padding:4px 8px;border-radius:20px}
.modal-checkbox-grid label.disabled{opacity:var(--disabled-opacity);cursor:not-allowed}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.modal-actions button{flex:0 0 auto;min-width:44px;width:44px;height:44px;background:rgba(100,70,40,.7);text-align:center;padding:0;font-size:1.4rem;border-radius:40px;transition:all .2s;font-family:'Inter',sans-serif;font-weight:500;border:1px solid var(--border-color);color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.modal-actions button:hover:not(:disabled){background:var(--accent-hover);color:#1a1625;transform:scale(.96)}
.modal-actions button:active:not(:disabled){transform:scale(.92)}
.modal-actions button:disabled{opacity:var(--disabled-opacity);cursor:not-allowed}
/* CSV modal (mismo estilo que los demás) */
#csvModal.temp-floating-menu{min-width:360px;max-height:80vh;overflow-y:auto}
#csvModal .csv-checkbox-group{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:40vh;overflow-y:auto;margin-bottom:16px;padding-right:4px}
#csvModal .csv-checkbox-group label{display:flex;align-items:center;gap:8px;font-size:.75rem;cursor:pointer;color:var(--text-primary);background:rgba(0,0,0,.2);padding:4px 8px;border-radius:20px}
/* Resto de estilos se mantienen igual */
.search-wrapper{display:inline-flex;align-items:center;gap:4px;background:rgba(25,20,40,.85);border-radius:40px;padding:2px 8px}
.search-wrapper input{background:transparent;border:none;padding:4px 0;font-family:'Inter',sans-serif;font-size:.7rem;color:var(--text-primary);outline:none;width:140px}
.result-count{background:rgba(0,0,0,.4);padding:2px 8px;border-radius:40px;font-size:.7rem;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.pagination-controls{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.2);border-radius:40px;padding:2px 5px}
.pagination-controls input{width:40px;text-align:center;background:rgba(25,20,40,.7);border:1px solid var(--border-color);border-radius:30px;padding:2px 0;font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-primary);outline:none}
.pagination-controls input:read-only{opacity:.6;cursor:default}
.grid-wrapper{padding:15px 20px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;opacity:1;transition:opacity .2s}
/* ═══════════════════════════════════════════════
   TARJETA CON GRADIENTE + BARRIDO CRISTAL
   ═══════════════════════════════════════════════ */
.card{
  background:var(--card-bg);
  border-radius:20px;
  cursor:pointer;
  border:1px solid var(--border-color);
  transition: transform .2s ease, border-color .2s ease, background .2s ease;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}
.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(
    135deg,
    rgba(224,188,108,.5),
    rgba(180,130,200,.5),
    rgba(100,160,220,.5),
    rgba(224,188,108,.5)
  );
  background-size: 300% 300%;
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: -1;
  pointer-events: none;
}
.card:hover::before {
  opacity: 1;
  animation: gradientShift 4s ease infinite;
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.card::after {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 200%;
  height: 120%;
  background: linear-gradient(
    105deg,
    transparent 35%,
    rgba(255,255,255,0.08) 45%,
    rgba(255,255,255,0.35) 50%,
    rgba(255,255,255,0.08) 55%,
    transparent 65%
  );
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 2;
  pointer-events: none;
}
.card:hover::after {
  opacity: 1;
  animation: barridoCristal 1.65s linear infinite;
}
@keyframes barridoCristal {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.card > * { position: relative; z-index: 1; }
.card:hover{transform:translateY(-2px);border-color:var(--accent);}

.img-container{width:100%;height:150px;position:relative;overflow:hidden;border-radius:20px 20px 0 0;background:rgba(0,0,0,.3)}
.img-container img{width:100%;height:100%;object-fit:cover}
.card-footer-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;gap:8px;margin-top:auto;position:relative;z-index:2}
.badges-wrapper{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.card-actions{display:flex;gap:6px;align-items:center}
.mini-badge{width:20px;height:20px;border-radius:30px;background:rgba(0,0,0,.7);backdrop-filter:none;display:flex;align-items:center;justify-content:center;font-size:10px;border:1px solid var(--border-color);cursor:pointer;transition:transform .1s;padding:0}
.mini-badge:active{transform:scale(.96)}
.card b{display:block;padding:12px 8px 6px;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:.9rem;background:var(--title-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .05s linear;flex:1;position:relative;z-index:2}
.card b.wrap-name{white-space:normal!important;overflow:visible;text-overflow:unset;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-height:calc(2 * 1.2em + 12px);line-height:1.2;padding-bottom:6px}
.modal-header h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 100px);transition:font-size .05s linear;font-family:'Cinzel',serif;font-weight:800;background:var(--title-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.modal-header h3.wrap-name{white-space:normal!important}
#detalle{position:relative;overflow:hidden}
#detalle::before{content:'';position:absolute;bottom:0;left:0;width:100%;height:35%;background:linear-gradient(to bottom,transparent 0%,rgba(219,186,108,.15) 100%);pointer-events:none;z-index:1}
#detalle>*{position:relative;z-index:2}
#detalle{border:1px solid var(--border-color)}
.fav-star,.revisado-icon,.copy-link{cursor:pointer;font-size:1.2rem;transition:transform .1s;background:none;border:none;font-family:inherit;color:var(--accent);padding:2px;line-height:1}
.fav-star:active,.copy-link:active{transform:scale(.95)}
.fav-star.active{color:gold;text-shadow:0 0 2px orange}
.revisado-icon{color:var(--accent)}
.temp-tooltip{position:fixed;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);color:var(--accent);font-family:'Cinzel',serif;font-size:.7rem;padding:4px 8px;border-radius:20px;border:1px solid var(--border-color);white-space:nowrap;z-index:10001;pointer-events:none;transition:opacity .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.no-results{text-align:center;padding:30px 20px;font-family:'Cinzel',serif;color:var(--accent);font-size:1rem}
.no-results img{display:block;margin:20px auto 0;max-width:200px;border-radius:16px;border:1px solid var(--border-color);background:rgba(0,0,0,.3)}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(8,5,18,.94);backdrop-filter:blur(12px);display:none;justify-content:center;align-items:center;z-index:1000;opacity:0;transition:opacity .3s ease}
#overlay.show{display:flex;opacity:1}
.modal-container{position:relative;width:90%;max-width:850px;margin:auto}
.modal-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border-radius:12px;width:32px;height:110px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s;z-index:1010;border:1px solid var(--border-color);opacity:.85;font-size:24px;color:var(--accent);font-weight:300}
.modal-arrow:hover{background:rgba(0,0,0,.8);border-color:var(--accent-hover);opacity:1}
.modal-arrow:active{transform:translateY(-50%) scale(.96)}
.modal-arrow.disabled{opacity:.3;pointer-events:none}
.modal-arrow.prev{left:-20px}
.modal-arrow.next{right:-20px}
@media(max-width:700px){
  .modal-arrow{width:28px;height:80px;font-size:20px}
  .modal-arrow.prev{left:-14px}
  .modal-arrow.next{right:-14px}
}
#detalle{background:var(--card-bg);border-radius:30px;border:1px solid var(--border-color);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:12px 18px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{margin:0}
.modal-header-actions{display:flex;gap:10px;align-items:center}
.modal-header-actions button{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--accent);transition:transform .1s;padding:2px;line-height:1}
.modal-header-actions button:active{transform:scale(.95)}
#cerrar{font-size:1.5rem;cursor:pointer;color:var(--accent)}
.modal-body{display:flex;gap:20px;padding:16px 20px;overflow-y:auto;flex:1}
.info-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-right:8px;max-height:65vh}
.image-fixed{flex:.6;min-width:120px;text-align:center}
.image-fixed img{max-width:100%;max-height:180px;object-fit:contain;border-radius:20px;border:1px solid var(--border-color);background:#000}
.info-grid{background:rgba(0,0,0,.4);border-radius:20px;padding:10px 14px;margin-bottom:12px}
.info-item{display:flex;gap:8px;font-size:.75rem;margin-bottom:4px;flex-wrap:wrap}
.info-label{font-weight:700;color:var(--accent);min-width:90px}
.modal-description{line-height:1.5;font-size:.85rem;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}

<script>
// ==================== DATOS Y LÓGICA ====================
let especies=[],filtrosState={morfologia:[],tipo:[],elemento:[],avistamiento:[],ubicacion:[],epoca:[],subcategorias:[]},revFilterState=[],currentPage=1,perPage=24,
    dataLoaded=false,onlyFavorites=false,currentOrderedList=[],currentModalIndex=-1,
    currentModalCreature=null,searchTerm='',navegacionBloqueada=false,revisados=new Set(),modoRevision="automatico",
    favoritos=new Set(),csvFields=["id","nombre","morfologia","tipo","elemento","avistamiento","ubicacion","epoca","subcategorias","descripcion","links"],
    selectedFields=[...csvFields.filter(f=>f!=='nombre')],
    csvMenu=null,ubicacionModal=null,epocaModal=null,subcategoriasModal=null,ordenActual="nombre_asc",touchStartX=0,
    tempPerPage=24,tempModoRevision="automatico", panelVisible=true, menuOverlay=null, headerOriginalZIndex='100';

// ==================== CONFIGURACIÓN DE CATEGORÍAS (EDITABLE) ====================
const defaultCategorias = {
  morfologia:{
    options:["Humano","Humanoide","Mamífero","Híbrido","Ave","Reptil","Pez","Insecto","Amorfo","Etéreo","Artificial","Otro"],
    icons:{"Humano":"🧑","Humanoide":"🧝","Mamífero":"🦌","Híbrido":"🦄","Ave":"🕊️","Reptil":"🐍","Pez":"🐟","Insecto":"🐞","Amorfo":"🌀","Etéreo":"✨","Artificial":"🤖","Otro":"❓"},
    buttonIcon:"🔮", buttonTitle:"Morfología"
  },
  tipo:{
    options:["Mitológico","Criptido","Difuso"],
    icons:{"Mitológico":"🏛️","Criptido":"🐾","Difuso":"🌫️"},
    buttonIcon:"🌙", buttonTitle:"Tipo de ser"
  },
  elemento:{
    options:["Aéreo","Acuático","Terrestre","Subterráneo","Anfibio","Misceláneo"],
    icons:{"Aéreo":"💨","Acuático":"💧","Terrestre":"🌿","Subterráneo":"⛰️","Anfibio":"🐸","Misceláneo":"⚙️"},
    buttonIcon:"💧", buttonTitle:"Elemento"
  },
  avistamiento:{
    options:["Grabado / Capturado","Documentado","Crónicas","Avistamiento","Ficción","Tradición oral","Difuso"],
    icons:{"Grabado / Capturado":"📹","Documentado":"📜","Crónicas":"📖","Avistamiento":"👁️","Ficción":"📚","Tradición oral":"🗣️","Difuso":"❓"},
    buttonIcon:"👁️", buttonTitle:"Avistamiento"
  }
};

let opcionesMorfologia = defaultCategorias.morfologia.options;
let opcionesTipo = defaultCategorias.tipo.options;
let opcionesElemento = defaultCategorias.elemento.options;
let opcionesAvistamiento = defaultCategorias.avistamiento.options;

const iconMap = {
  morfologia: defaultCategorias.morfologia.icons,
  tipo: defaultCategorias.tipo.icons,
  elemento: defaultCategorias.elemento.icons,
  avistamiento: (v) => defaultCategorias.avistamiento.icons[v] || "❓"
};

// Referencias globales a botones
const btnMorfologia = document.getElementById('btnMorfologia');
const btnTipo = document.getElementById('btnTipo');

function configurarBotonesCategorias() {
  btnMorfologia.textContent = defaultCategorias.morfologia.buttonIcon;
  btnMorfologia.title = defaultCategorias.morfologia.buttonTitle;
  btnTipo.textContent = defaultCategorias.tipo.buttonIcon;

  btnAvistamiento.textContent = defaultCategorias.avistamiento.buttonIcon;
  btnAvistamiento.title = defaultCategorias.avistamiento.buttonTitle;
}
configurarBotonesCategorias();

function $(id){ return document.getElementById(id); }

let tooltipElement=null,tooltipTimeout=null;
function crearTooltipElement(){if(tooltipElement)return;tooltipElement=document.createElement("div");tooltipElement.className="temp-tooltip";tooltipElement.style.opacity="0";document.body.appendChild(tooltipElement)}
function showTooltip(text,x,y,duration=1500){crearTooltipElement();if(tooltipTimeout)clearTimeout(tooltipTimeout);tooltipElement.textContent=text;tooltipElement.style.left=x+"px";tooltipElement.style.top=y+"px";tooltipElement.style.opacity="1";const rect=tooltipElement.getBoundingClientRect();let finalX=x,finalY=y;if(finalX+rect.width>window.innerWidth-10)finalX=window.innerWidth-rect.width-10;if(finalY+rect.height>window.innerHeight-10)finalY=window.innerHeight-rect.height-10;if(finalX<10)finalX=10;if(finalY<10)finalY=10;tooltipElement.style.left=finalX+"px";tooltipElement.style.top=finalY+"px";tooltipTimeout=setTimeout(()=>hideTooltip(),duration)}
function hideTooltip(){if(!tooltipElement)return;tooltipElement.style.opacity="0";if(tooltipTimeout){clearTimeout(tooltipTimeout);tooltipTimeout=null}}
document.addEventListener("click",(e)=>{if(tooltipElement&&e.target!==tooltipElement)hideTooltip()});

const getIconForMorfologia=e=>iconMap.morfologia[e]||"🔮",getIconForTipo=e=>iconMap.tipo[e]||"🌙",getIconForElemento=e=>iconMap.elemento[e]||"💧",getIconForAvistamiento=v=>iconMap.avistamiento(v);
function saveLocal(k,v){localStorage.setItem(k,JSON.stringify(v))}
function loadLocal(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function persistState(){saveLocal('catalogo_filtros',filtrosState);saveLocal('catalogo_orden',ordenActual);saveLocal('catalogo_perpage',perPage);saveLocal('catalogo_onlyFav',onlyFavorites);saveRevFilterState()}

let idxMorfologia,idxTipo,idxElemento,idxAvistamiento,idxUbicacion,idxEpoca,idxSubcategorias;
function buildIndexes(){
  idxMorfologia=new Map();idxTipo=new Map();idxElemento=new Map();idxAvistamiento=new Map();idxUbicacion=new Map();idxEpoca=new Map();idxSubcategorias=new Map();
  for(let e of especies){
    const id=e.id;
    addToIndex(idxMorfologia,e.morfologia,id);addToIndex(idxTipo,e.tipo,id);addToIndex(idxElemento,e.elemento,id);addToIndex(idxAvistamiento,e.avistamiento,id);
    if(e.ubicacion)addToIndex(idxUbicacion,e.ubicacion,id);
    if(e.epoca)addToIndex(idxEpoca,e.epoca,id);
    if(e.subcategorias){e.subcategorias.split(',').forEach(s=>{let t=s.trim();if(t)addToIndex(idxSubcategorias,t,id)})}
  }
}
function addToIndex(map,key,id){if(!map.has(key))map.set(key,new Set());map.get(key).add(id)}

let baseFilterVersion=0,cachedBaseIds=null,cachedBaseVersion=-1,cachedIgnoreCat=null;
function buildPredicate(ignoreCat = null, extraCheck = null) {
  return e => {
    if (ignoreCat !== 'morfologia' && filtrosState.morfologia.length && !filtrosState.morfologia.includes(e.morfologia)) return false;
    if (ignoreCat !== 'tipo' && filtrosState.tipo.length && !filtrosState.tipo.includes(e.tipo)) return false;
    if (ignoreCat !== 'elemento' && filtrosState.elemento.length && !filtrosState.elemento.includes(e.elemento)) return false;
    if (ignoreCat !== 'avistamiento' && filtrosState.avistamiento.length && !filtrosState.avistamiento.includes(e.avistamiento)) return false;
    if (ignoreCat !== 'ubicacion' && filtrosState.ubicacion.length && !filtrosState.ubicacion.includes(e.ubicacion)) return false;
    if (ignoreCat !== 'epoca' && filtrosState.epoca.length && !filtrosState.epoca.includes(e.epoca)) return false;
    if (ignoreCat !== 'subcategorias' && filtrosState.subcategorias.length) {
      const subcats = e.subcategorias ? e.subcategorias.split(',').map(s => s.trim()).filter(s => s) : [];
      if (!filtrosState.subcategorias.some(sel => subcats.includes(sel))) return false;
    }
    if (onlyFavorites && !favoritos.has(e.id)) return false;
    if (searchTerm.trim() && !e.nombre.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    if (revFilterState.length && ignoreCat !== 'revisado') {
      const r = revisados.has(e.id);
      if (!(revFilterState.includes("revisado") && revFilterState.includes("no_revisado")) &&
          ((revFilterState.includes("revisado") && !r) || (revFilterState.includes("no_revisado") && r))) return false;
    }
    return extraCheck ? extraCheck(e) : true;
  };
}
function getBaseFilteredIds(ignoreCat=null){
  if(baseFilterVersion===cachedBaseVersion&&ignoreCat===cachedIgnoreCat&&cachedBaseIds!==null)return cachedBaseIds;
  const pred=buildPredicate(ignoreCat),ids=new Set();
  for(let e of especies)if(pred(e))ids.add(e.id);
  cachedBaseIds=ids;cachedBaseVersion=baseFilterVersion;cachedIgnoreCat=ignoreCat;
  return ids;
}
function invalidateBaseCache(){baseFilterVersion++}

// Caché de contadores
let filterCountCache = new Map();
function clearFilterCountCache() { filterCountCache.clear(); }
function cachedContarConOpcion(categoria, opcion) {
  const key = `${categoria}_${opcion}`;
  if (filterCountCache.has(key)) return filterCountCache.get(key);
  let count;
  if (categoria === 'revisado') {
    count = contarPorEstado(opcion);
  } else {
    const baseIds = getBaseFilteredIds(categoria);
    if (!baseIds.size) count = 0;
    else {
      let opSet;
      switch(categoria){
        case'morfologia':opSet=idxMorfologia.get(opcion);break;
        case'tipo':opSet=idxTipo.get(opcion);break;
        case'elemento':opSet=idxElemento.get(opcion);break;
        case'avistamiento':opSet=idxAvistamiento.get(opcion);break;
        case'ubicacion':opSet=idxUbicacion.get(opcion);break;
        case'epoca':opSet=idxEpoca.get(opcion);break;
        case'subcategorias':opSet=idxSubcategorias.get(opcion);break;
        default:opSet=null;
      }
      if(!opSet||!opSet.size) count = 0;
      else {
        if(baseIds.size<opSet.size){count=0;for(let id of baseIds)if(opSet.has(id))count++;}
        else{count=0;for(let id of opSet)if(baseIds.has(id))count++;}
      }
    }
  }
  filterCountCache.set(key, count);
  return count;
}
const contarConOpcion = cachedContarConOpcion;
let revCountCache = { revisado: -1, no_revisado: -1 };
function cachedContarPorEstado(estado) {
  if (revCountCache[estado] !== -1) return revCountCache[estado];
  const baseIds = getBaseFilteredIds(null);
  if (!baseIds.size) { revCountCache[estado] = 0; return 0; }
  let count = 0;
  for (let id of baseIds) { const r=revisados.has(id); if (estado==="revisado"?r:!r) count++; }
  revCountCache[estado] = count;
  return count;
}
const contarPorEstado = cachedContarPorEstado;
function invalidateCountCaches() {
  clearFilterCountCache();
  revCountCache = { revisado: -1, no_revisado: -1 };
}
const originalInvalidateBaseCache = invalidateBaseCache;
invalidateBaseCache = function() {
  originalInvalidateBaseCache();
  invalidateCountCaches();
};

const aplicarFiltrosCompletos = () => especies.filter(buildPredicate());
function ordenarEspecies(lista){const[campo,dir]=ordenActual.split('_');const order=dir==="asc"?1:-1;return[...lista].sort((a,b)=>{let va=a[campo]||"",vb=b[campo]||"";return va<vb?-order:va>vb?order:0})}

const STORAGE_VERSION=12;
function resetAllData(){
  localStorage.clear();filtrosState={morfologia:[],tipo:[],elemento:[],avistamiento:[],ubicacion:[],epoca:[],subcategorias:[]};
  revFilterState=[];revisados.clear();favoritos.clear();onlyFavorites=false;ordenActual="nombre_asc";perPage=24;currentPage=1;searchTerm='';
  saveLocal('catalogo_version',STORAGE_VERSION);persistState();saveRevisados();saveFavoritos();
}
function checkVersion(){const v=loadLocal('catalogo_version');if(v!==STORAGE_VERSION){resetAllData();return false}return true}
function loadRevisados(){const s=loadLocal('catalogo_revisados');if(s)revisados=new Set(s)}
function saveRevisados(){saveLocal('catalogo_revisados',[...revisados])}
function loadModoRevision(){const m=localStorage.getItem('catalogo_modo_revision');if(m)modoRevision=m;tempModoRevision=modoRevision}
function saveModoRevision(){localStorage.setItem('catalogo_modo_revision',modoRevision)}
function loadFavoritos(){const f=loadLocal('catalogo_favoritos');if(f)favoritos=new Set(f);actualizarEstadoFavoritosYBoton()}
function saveFavoritos(){saveLocal('catalogo_favoritos',[...favoritos]);actualizarEstadoFavoritosYBoton()}
function loadRevFilterState(){const s=loadLocal('catalogo_rev_filter');revFilterState=s||[]}
function saveRevFilterState(){saveLocal('catalogo_rev_filter',revFilterState);updateRevFilterBadge()}

function validarFiltrosState(){
  if(!especies.length)return;
  const categoriasSimples=['morfologia','tipo','elemento','avistamiento','ubicacion','epoca'];
  for(let cat of categoriasSimples){
    const valoresExistentes=new Set(especies.map(e=>e[cat]).filter(v=>v));
    if(filtrosState[cat]&&filtrosState[cat].length)filtrosState[cat]=filtrosState[cat].filter(v=>valoresExistentes.has(v));
  }
  const todasSubs=new Set();
  especies.forEach(e=>{if(e.subcategorias)e.subcategorias.split(',').forEach(s=>{let t=s.trim();if(t)todasSubs.add(t)})});
  if(filtrosState.subcategorias&&filtrosState.subcategorias.length)filtrosState.subcategorias=filtrosState.subcategorias.filter(v=>todasSubs.has(v));
  persistState();
}
function loadPersistedState(){
  if(!checkVersion())return;
  const f=loadLocal('catalogo_filtros');if(f)filtrosState=f;
  const o=loadLocal('catalogo_orden');ordenActual=o||"nombre_asc";
  const pp=loadLocal('catalogo_perpage');if(pp)perPage=+pp;
  const of=loadLocal('catalogo_onlyFav');onlyFavorites=(of===true||of==='true');
  loadRevFilterState();
  if(especies.length)validarFiltrosState();
  actualizarTooltipOrden();actualizarEstadoFavoritosYBoton();
}
function actualizarTooltipOrden(){const m={"nombre_asc":"Alfabético A→Z","nombre_desc":"Alfabético Z→A","morfologia_asc":"Morfología A→Z","morfologia_desc":"Morfología Z→A","tipo_asc":"Tipo A→Z","tipo_desc":"Tipo Z→A","elemento_asc":"Elemento A→Z","elemento_desc":"Elemento Z→A","avistamiento_asc":"Avistamiento A→Z","avistamiento_desc":"Avistamiento Z→A"};btnOrden.title=m[ordenActual]||"Ordenar"}

function isFavorito(id){return favoritos.has(id)}
function actualizarEstadoFavoritosYBoton(){const h=favoritos.size>0;favFilterBtn.disabled=!h;if(!h&&onlyFavorites){onlyFavorites=false;render()}}
function toggleFavorito(id,uiOnly=false){
  favoritos.has(id)?favoritos.delete(id):favoritos.add(id);
  saveFavoritos();
  if(!uiOnly){if(onlyFavorites)render();else{actualizarEstrellaEnTarjeta(id);if(currentModalCreature&&currentModalCreature.id===id&&modalFavBtn)modalFavBtn.textContent=favoritos.has(id)?"★":"☆"}}
  updateFilterBadges();actualizarEstadoFavoritosYBoton();invalidateBaseCache();
}
function actualizarEstrellaEnTarjeta(id){const card=document.querySelector(`.card[data-id="${id}"]`);if(card){const fb=card.querySelector(".fav-star");if(fb)fb.textContent=favoritos.has(id)?"★":"☆"}}

function toggleRevisado(id,esAuto=false){
  const estaba=revisados.has(id);
  if(modoRevision==="bloqueo"){
    if(!esAuto&&estaba){if(confirm("¿Estás seguro de marcar como NO revisado?")){revisados.delete(id);saveRevisados();actualizarIconoRevisadoTarjeta(id);afterRevisadoToggle();return}}
    if(!esAuto&&!estaba)return;
    if(!estaba){revisados.add(id);saveRevisados();actualizarIconoRevisadoTarjeta(id);afterRevisadoToggle();return;}
  }
  estaba?revisados.delete(id):revisados.add(id);
  saveRevisados();actualizarIconoRevisadoTarjeta(id);
  afterRevisadoToggle();
}
function afterRevisadoToggle() {
  invalidateBaseCache();
  actualizarEstadoBotonRevisado();
  if (revFilterState.length === 0 || revFilterState.length === 2) {
    updateFilterBadges();
    regenerarMenus();
    updateSearchSuggestions();
    actualizarContadorYPaginacion();
    adjustTitleFontSize();
    actualizarImagenEsquina();
    actualizarDisabledOtrosFiltros();
  } else {
    render();
  }
}
function actualizarDisabledOtrosFiltros() {
  const categorias = [
    {btn: btnMorfologia, cat:'morfologia'},
    {btn: btnTipo, cat:'tipo'},
    {btn: btnElemento, cat:'elemento'},
    {btn: btnAvistamiento, cat:'avistamiento'},
    {btn: btnUbicacion, cat:'ubicacion'},
    {btn: btnEpoca, cat:'epoca'},
    {btn: btnSubcategorias, cat:'subcategorias'}
  ];
  categorias.forEach(({btn, cat}) => {
    if (btn) {
      const n = getCachedOpcionesConDatos(cat);
      btn.disabled = (n === 0 || n === 1);
    }
  });
}
function actualizarEstadoBotonRevisado(){
  invalidateBaseCache();
  const revCount=contarPorEstado("revisado");
  const noRevCount=contarPorEstado("no_revisado");
  const opcionesData=(revCount>0?1:0)+(noRevCount>0?1:0);
  btnRevFilter.disabled=(opcionesData<=1);

function setImageWithFallback(imgElement,nombre,transformStyle="",isPrioritario=false){
  const extensions=['jpg','jpeg','png'];let currentExtIndex=0;
  if(isPrioritario){imgElement.fetchPriority="high";imgElement.loading="eager"}else{imgElement.loading="lazy"}
  const parent = imgElement.parentNode;
  if (parent) { const old = parent.querySelectorAll('.img-placeholder'); old.forEach(el => el.remove()); }
  const tryNext=()=>{
    if(currentExtIndex>=extensions.length){
      imgElement.style.display="none";
      if(!parent.querySelector(".img-placeholder")){
        const placeholder=document.createElement("div");
        placeholder.className="img-placeholder";
        placeholder.style.cssText="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--accent);background:rgba(0,0,0,.3);border-radius:16px;";
        placeholder.textContent="🖼️";
        placeholder.setAttribute("aria-label","Imagen no disponible");
        parent.appendChild(placeholder);
      }
      return;
    }
    const ext=extensions[currentExtIndex];const url=`img/${encodeURIComponent(nombre)}.${ext}`;
    imgElement.src=url;imgElement.style.display="block";
    if(transformStyle)imgElement.style.transform=transformStyle;
    imgElement.onerror=()=>{
      currentExtIndex++;
      tryNext();
    };
    imgElement.onload=()=>{
      const oldPlaceholder=parent.querySelector(".img-placeholder");
      if(oldPlaceholder) oldPlaceholder.remove();
      imgElement.style.display="block";
    };
  };
  tryNext();
}

  opcionesConDatos.forEach(val => {

    const soloUna = (totalVisibles === 1);
    html += `<label><input type="checkbox" value="${val.replace(/"/g,'&quot;')}" ${checked?'checked':''} ${soloUna?'disabled':''}> ${val} <span style="color:#b8a87a;font-size:0.6rem;">(${count})</span></label>`;
  });

  if (cat === 'ubicacion') ubicacionModal = modal; else if (cat === 'epoca') epocaModal = modal; else if (cat === 'subcategorias') subcategoriasModal = modal;
  const grid = modal.querySelector(`#${cat}CheckboxGrid`), actionsDiv = modal.querySelector(`#${cat}Actions`);

    const checks = grid.querySelectorAll('input[type="checkbox"]:not([disabled])');
    const checkedCount = Array.from(checks).filter(cb => cb.checked).length;
    sa.disabled = (checkedCount === checks.length);
    da.disabled = (checkedCount === 0);

  };

  da.onclick = () => {

  };

function getCachedOpcionesConDatos(categoria) {
  if (!getCachedOpcionesConDatos.cache) getCachedOpcionesConDatos.cache = new Map();
  if (getCachedOpcionesConDatos.cache.has(categoria)) return getCachedOpcionesConDatos.cache.get(categoria);
  let result;
  if (categoria === 'revisado') {
    let c=0; if(contarPorEstado("revisado")>0) c++; if(contarPorEstado("no_revisado")>0) c++; result = c;
  } else if (categoria === 'ubicacion') {
    result = [...new Set(especies.map(e=>e.ubicacion).filter(v=>v))].filter(op=>contarConOpcion('ubicacion',op)>0).length;
  } else if (categoria === 'epoca') {
    result = [...new Set(especies.map(e=>e.epoca).filter(v=>v))].filter(op=>contarConOpcion('epoca',op)>0).length;
  } else if (categoria === 'subcategorias') {
    const todas=new Set(); especies.forEach(e=>{if(e.subcategorias)e.subcategorias.split(',').forEach(s=>{let t=s.trim();if(t)todas.add(t)})});
    result = Array.from(todas).filter(op=>contarConOpcion('subcategorias',op)>0).length;
  } else {
    const opciones = {morfologia:opcionesMorfologia, tipo:opcionesTipo, elemento:opcionesElemento, avistamiento:opcionesAvistamiento}[categoria];
    result = opciones ? opciones.filter(op=>contarConOpcion(categoria,op)>0).length : 0;
  }
  getCachedOpcionesConDatos.cache.set(categoria, result);
  return result;
}

async function render(){
  if(!dataLoaded)return;gridDiv.classList.add("fade-out");await new Promise(r=>setTimeout(r,30));
  invalidateBaseCache();const filtradas=aplicarFiltrosCompletos(),ordenadas=ordenarEspecies(filtradas);currentOrderedList=ordenadas;
  let total=ordenadas.length;
  const favoritosEnResultados = onlyFavorites ? total : ordenadas.filter(e => favoritos.has(e.id)).length;

  let necesitaReRender = false;
  if (onlyFavorites && favoritosEnResultados === 0) {
    onlyFavorites = false;
    necesitaReRender = true;
  }
  if (!necesitaReRender && revFilterState.includes("revisado") && !revFilterState.includes("no_revisado")) {
    if (contarPorEstado("revisado") === 0) {
      revFilterState = revFilterState.filter(v => v !== "revisado");
      saveRevFilterState();
      necesitaReRender = true;
    }
  }
  if (!necesitaReRender && revFilterState.includes("no_revisado") && !revFilterState.includes("revisado")) {
    if (contarPorEstado("no_revisado") === 0) {
      revFilterState = revFilterState.filter(v => v !== "no_revisado");
      saveRevFilterState();
      necesitaReRender = true;
    }
  }
  if (necesitaReRender) {
    persistState();
    render();
    return;
  }

  getCachedOpcionesConDatos.cache = new Map();
  const tp=Math.max(1,Math.ceil(total/perPage));if(currentPage>tp)currentPage=tp;
  const hayResultados=total>0;

  if(!hayResultados){
    document.querySelectorAll('.filtro-boton').forEach(btn=>{btn.disabled=true});
    btnOrden.disabled=true;favFilterBtn.disabled=true;btnLimpiar.disabled=true;configBtn.disabled=true;
  }else{

    favFilterBtn.disabled = (favoritos.size === 0) || (favoritosEnResultados === 0);
    btnLimpiar.disabled=(Object.values(filtrosState).every(a=>a.length===0)&&revFilterState.length===0);configBtn.disabled=false;

    const categorias = [
      {btn: btnMorfologia, cat:'morfologia'},

      {btn: btnElemento, cat:'elemento'},
      {btn: btnAvistamiento, cat:'avistamiento'},
      {btn: btnUbicacion, cat:'ubicacion'},
      {btn: btnEpoca, cat:'epoca'},
      {btn: btnSubcategorias, cat:'subcategorias'},
      {btn: btnRevFilter, cat:'revisado'}
    ];
    categorias.forEach(({btn, cat}) => {
      if (btn) {
        const n = getCachedOpcionesConDatos(cat);
        btn.disabled = (n === 0 || n === 1);
      }
    });
  }
  const start=(currentPage-1)*perPage,paginated=ordenadas.slice(start,start+perPage),end=Math.min(start+perPage,total);
  resultSpan.innerText=`${start+1}-${end} / ${total}`;gridDiv.className='grid';gridDiv.innerHTML="";
  if(!paginated.length){
    const nd=document.createElement("div");nd.className="no-results";
    if (especies.length === 0) {
      nd.innerHTML=`<div>🜁 No se pudieron cargar los datos desde dtsk/Datos*.json.</div><img src="img2/non.jpeg" alt="Error de carga" loading="lazy">`;
    } else {

    }
    gridDiv.appendChild(nd);

  actualizarPaginacionHeader(tp);gridDiv.classList.remove("fade-out");
  updateFilterBadges();regenerarMenus();updateSearchSuggestions();adjustTitleFontSize();actualizarImagenEsquina();
}

}

function updateSearchSuggestions(){
  const term = searchInput.value.trim().toLowerCase();
  let cand = aplicarFiltrosCompletos();
  let sug = [];
  if (!term) {
    sug = ordenarEspecies(cand).slice(0, 6).map(e => e.nombre);
  } else {
    const comienzan = cand.filter(e => e.nombre.toLowerCase().startsWith(term));
    const otros = cand.filter(e => !e.nombre.toLowerCase().startsWith(term));
    if (comienzan.length >= 6) {
      sug = comienzan.slice(0, 6).map(e => e.nombre);
    } else {
      sug = comienzan.map(e => e.nombre);
      const restoCupo = 6 - sug.length;
      if (restoCupo > 0 && otros.length > 0) {
        const wd = otros.map(e => ({
          nombre: e.nombre,
          dist: levenshteinDistance(term, e.nombre.toLowerCase())
        }));
        wd.sort((a, b) => a.dist - b.dist);
        sug.push(...wd.slice(0, restoCupo).map(s => s.nombre));
      }
    }
  }
  searchDatalist.innerHTML = sug.map(s => `<option value="${s}">`).join('');
}

function adjustTitleFontSize(){const ruler=document.createElement('span');ruler.style.cssText='position:fixed;visibility:hidden;white-space:nowrap;font-family:Cinzel,serif;font-weight:700;padding:0 8px;pointer-events:none';document.body.appendChild(ruler);const minFontSize=0.7;document.querySelectorAll('.card b').forEach(t=>{const a=t.clientWidth;if(a<=0)return;ruler.textContent=t.textContent;let fs=0.9;ruler.style.fontSize=fs+'rem';while(fs>minFontSize&&ruler.offsetWidth>a){fs-=0.005;ruler.style.fontSize=fs+'rem'}if(ruler.offsetWidth>a){t.classList.add('wrap-name');t.style.fontSize=minFontSize+'rem'}else{t.classList.remove('wrap-name');t.style.fontSize=fs+'rem'}});ruler.remove()}
function adjustModalTitleFontSize(){const h3=modalTitle;if(!h3)return;const availableWidth=h3.clientWidth;if(availableWidth<=0)return;const minFontSize=0.8;const testEl=document.createElement('span');testEl.style.cssText='position:fixed;visibility:hidden;white-space:nowrap;font-family:"Cinzel",serif;font-weight:800;width:'+availableWidth+'px;display:inline-block;pointer-events:none;box-sizing:content-box;';testEl.textContent=h3.textContent;document.body.appendChild(testEl);let fs=1.4;testEl.style.fontSize=fs+'rem';while(fs>minFontSize&&testEl.scrollWidth>testEl.clientWidth){fs-=0.05;testEl.style.fontSize=fs+'rem'}if(testEl.scrollWidth>testEl.clientWidth){h3.classList.add('wrap-name');h3.style.fontSize=minFontSize+'rem'}else{h3.classList.remove('wrap-name');h3.style.fontSize=fs+'rem'}testEl.remove()}
if (btnResetTotal) {
  btnResetTotal.addEventListener('click', () => {
    const hayFiltrosActivos = Object.values(filtrosState).some(a => a.length) || revFilterState.length > 0;
    if (!hayFiltrosActivos && !onlyFavorites && searchTerm === '') return;
    filtrosState = {morfologia:[],tipo:[],elemento:[],avistamiento:[],ubicacion:[],epoca:[],subcategorias:[]};
    revFilterState = [];
    saveRevFilterState();
    onlyFavorites = false;
    searchInput.value = '';
    searchTerm = '';
    updateClearSearchState();
    currentPage = 1;
    render();
    persistState();
    invalidateBaseCache();
  });
}
async function cargarArchivosDesdeCarpeta() {
  let todosLosDatos = [];
  let indice = 1;
  let hayError = false;
  while (!hayError) {
    const url = `dtsk/Datos${indice}.json?t=${Date.now()}`;
    try {
      const respuesta = await fetch(url, { cache: 'default' });
      if (!respuesta.ok) {
        hayError = true;
        break;
      }
      const datos = await respuesta.json();
      if (Array.isArray(datos)) {
        todosLosDatos.push(...datos);
      } else {
        todosLosDatos.push(datos);
      }
      indice++;
    } catch (error) {
      hayError = true;
      break;
    }
  }
  return todosLosDatos;
}
async function cargarDatos(){
  try{
    let datosCombinados = await cargarArchivosDesdeCarpeta();
    if (datosCombinados.length === 0) {
      throw new Error('No se pudieron cargar datos desde dtsk/Datos*.json');
    }
    especies = datosCombinados.map((criatura, idx) => {
      return {
        id: criatura.id || `criatura_${idx}_${Date.now()}_${Math.random()}`,
        nombre: criatura.nombre || 'Sin nombre',
        morfologia: criatura.morfologia || 'Desconocido',
        tipo: criatura.tipo || 'Desconocido',
        elemento: criatura.elemento || 'Desconocido',
        avistamiento: criatura.avistamiento || 'Desconocido',
        ubicacion: criatura.ubicacion || '',
        epoca: criatura.epoca || '',
        subcategorias: criatura.subcategorias || '',
        descripcion: criatura.descripcion || '',
        links: criatura.links || [],
        posX: criatura.posX !== undefined ? criatura.posX : (criatura.posx !== undefined ? criatura.posx : 0),
        posY: criatura.posY !== undefined ? criatura.posY : (criatura.posy !== undefined ? criatura.posy : 0),
        zoom: criatura.zoom || 1
      };
    });
    dataLoaded = true;
    buildIndexes();
    loadFavoritos();
    loadRevisados();
    loadModoRevision();
    loadPersistedState();
    updateSearchSuggestions();
    updateClearSearchState();
    regenerarMenus();
    await render();
    window.addEventListener('resize', () => {
      if (dataLoaded) {
        debouncedAdjustTitleFontSize();
        if (overlayEl.classList.contains("show")) adjustModalTitleFontSize();
        debouncedActualizarImagenEsquina();
      }
    });
    actualizarImagenEsquina();
    const hash = window.location.hash.substring(1);
    if (hash.startsWith("id=")) {
      const id = decodeURIComponent(hash.substring(3));
      const cr = especies.find(e => e.id === id);
      if (cr) setTimeout(() => abrirDetalle(cr), 300);
    }
    window.scrollTo({ top: 0, behavior: 'instant' });
  } catch(err) {
    console.error("Error cargando datos:", err);
    especies = [];
    dataLoaded = true;
    render();
  }
}
async function inicializarApp(){await cargarDatos()}
inicializarApp();
