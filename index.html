<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Índice de Seres Místicos </title>
<link rel="icon" href="img2/icono4.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img2/anuncio1.gif">
<style>
/* ========== TEMA OSCURO (FONDO SÓLIDO, SIN DEGRADADO PESADO) ========== */
:root {
  --bg-color: #0f0c18;
  --header-bg: rgba(10, 8, 18, 0.95);
  --card-bg: rgba(18, 15, 30, 0.85);
  --card-hover-border: #e6c275;
  --text-primary: #f0eef7;
  --text-secondary: #e5dccf;
  --accent: #e0bc6c;
  --accent-hover: #f3d27e;
  --border-color: #dbba6c;
  --badge-morfologia: #8b5a2b;
  --badge-tipo: #3a6ea5;
  --badge-elemento: #2f6b4a;
  --badge-avistamiento: #7a3b6e;
  --btn-active-bg: #2a2345;
  --filter-active-border: #f3d27e;
  --filter-active-shadow: 0 0 4px #f3d27e;
  --disabled-opacity: 0.5;
  --title-gradient: linear-gradient(135deg, #ffe6b3, #f3d27e, #e0bc6c, #f3d27e, #ffe6b3);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:70px}
body{
  background: var(--bg-color);
  color:var(--text-primary);
  font-family:'Inter',sans-serif;
  padding:0;
  position:relative;
  overflow-x:hidden;
}
body.modal-open{overflow:hidden}
body::before{
  content:"";
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDYiLz48L3N2Zz4=');
  background-repeat:repeat;
  pointer-events:none;
  opacity:.2;
  z-index:0;
}
.container,.main-header,.grid-wrapper,#overlay{position:relative;z-index:1}
.main-header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--header-bg);
  padding:8px 16px;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
  border-bottom:1px solid var(--border-color);
  overflow:visible;
}
.header-corner{
  position:absolute;
  top:0;
  right:0;
  width:auto;
  height:100%;
  pointer-events:all;
  z-index:2;               /* ← por encima del contenedor */
  opacity:1;               /* ← completamente sólida */
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));
  cursor:pointer;
  object-fit: contain;
}
@media(max-width:700px){
  .main-header { padding: 4px 8px; }
  .header-corner { max-width:40px; }
  h2 { font-size: 1.2rem !important; margin-bottom: 3px; }
  .filtro-boton,.btn-limpiar,.fav-filter-btn,.pagination-btn,.config-btn,.help-btn { padding: 3px 6px !important; font-size: 0.7rem !important; }
  .result-count { font-size: 0.65rem !important; padding: 1px 6px !important; }
  .pagination-controls input { width: 30px !important; font-size: 0.6rem !important; }
  .search-wrapper input { width: 90px !important; font-size: 0.65rem !important; }
  .filtros-panel { gap: 4px; }
}
.container{max-width:1400px;margin:0 auto;position:relative;z-index:1}  /* z-index inferior a la imagen de la esquina */
h2{
  font-family:'Cinzel',serif;
  font-size:1.6rem;
  font-weight:800;
  letter-spacing:2px;
  background:var(--title-gradient);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:6px;
  text-shadow:0 0 6px rgba(224,188,108,.3);
  cursor:pointer;
  user-select:none;
}
.filtros-panel{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:6px 0;
  align-items:center;
  justify-content:flex-start;
}
.filtros-panel.oculto { display: none; }
.filtro-group{position:relative}
.filtro-boton,.btn-limpiar,.export-btn,.random-btn,.theme-btn,.view-btn,.fav-filter-btn,.pagination-btn,.config-btn,.help-btn{
  background:rgba(25,20,40,.85);
  border:1px solid var(--border-color);
  border-radius:40px;
  padding:5px 10px;
  font-family:'Cinzel',serif;
  font-weight:600;
  color:var(--text-primary);
  font-size:.9rem;
  cursor:pointer;
  transition:transform .1s ease, background .1s;
  white-space:nowrap;
  line-height:1;
  outline:none;
}
.filtro-boton:disabled, .btn-limpiar:disabled, .fav-filter-btn:disabled, .pagination-btn:disabled, .config-btn button:disabled, .limpiar-categoria:disabled{
  opacity:var(--disabled-opacity);
  cursor:not-allowed;
  pointer-events:none;
}
.search-clear{
  cursor:pointer;
  font-size:.9rem;
  font-weight:700;
  color:var(--accent);
  background:none;
  border:none;
  padding:0 2px;
  transition:opacity .2s;
}
.search-clear.disabled{opacity:.5;pointer-events:none;cursor:default}
.search-clear:active:not(.disabled){transform:scale(.9)}
.filtro-menu input:disabled,.rev-filter-menu input:disabled{opacity:.5;cursor:not-allowed}
.filtro-menu label:has(input:disabled),.rev-filter-menu label:has(input:disabled){opacity:.6;cursor:default}
@media(hover:hover){
  .filtro-boton:hover:not(:disabled),.btn-limpiar:hover:not(:disabled),.export-btn:hover,.random-btn:hover,.theme-btn:hover,.view-btn:hover,.fav-filter-btn:hover:not(:disabled),.pagination-btn:hover:not(:disabled),.config-btn:hover,.help-btn:hover{
    background:var(--accent-hover);
    color:#1a1625;
    border-color:var(--accent);
  }
  .filtro-menu button:hover,.rev-filter-menu label:hover:has(input:not(:disabled)),.orden-menu button:hover,.items-menu button:hover,.csv-menu button:hover,.config-menu button:hover,.config-submenu button:hover{
    background:var(--accent-hover);
    color:#1a1625;
  }
}
.filtro-boton:active:not(:disabled),.btn-limpiar:active:not(:disabled),.export-btn:active,.random-btn:active,.theme-btn:active,.view-btn:active,.fav-filter-btn:active:not(:disabled),.pagination-btn:active:not(:disabled),.config-btn:active,.help-btn:active{
  background:var(--accent-hover);
  color:#1a1625;
  border-color:var(--accent);
  transform:scale(.98);
}
.filtro-boton.active-filter{border-color:var(--filter-active-border);box-shadow:var(--filter-active-shadow)}
.fav-filter-btn.active,.theme-btn.active{
  background:var(--accent);
  color:#1a1625;
  border-color:var(--accent-hover);
  box-shadow:0 0 4px var(--accent);
}
/* ========== MENÚS FLOTANTES ========== */
.filtro-menu,.orden-menu,.items-menu,.csv-menu,.config-menu,.rev-filter-menu,.help-menu{
  position:absolute;
  top:110%;
  left:0;
  background:rgba(25,20,40,.9);
  backdrop-filter:blur(8px);
  border:1px solid var(--border-color);
  border-radius:20px;
  padding:8px 12px;
  min-width:180px;
  z-index:200;
  box-shadow:0 8px 20px rgba(0,0,0,.4);
  display:none;
  flex-direction:column;
  gap:4px;
}
.config-menu{min-width:200px}
.help-menu{min-width:240px;white-space:normal}
.help-menu p{font-size:.7rem;margin-bottom:4px;color:#fff;line-height:1.3}
.help-menu hr{margin:4px 0;border-color:var(--border-color)}
.config-submenu{
  position:absolute;
  top:0;
  left:100%;
  margin-left:5px;
  background:rgba(25,20,40,.9);
  backdrop-filter:blur(8px);
  border:1px solid var(--border-color);
  border-radius:20px;
  padding:6px;
  min-width:100px;
  display:none;
  flex-direction:column;
  gap:4px;
  z-index:210;
}
.config-submenu.show,.filtro-menu.show,.orden-menu.show,.items-menu.show,.csv-menu.show,.config-menu.show,.rev-filter-menu.show,.help-menu.show{display:flex}
.filtro-menu label,.rev-filter-menu label,.orden-menu button,.items-menu button,.csv-menu button,.config-menu button,.config-submenu button{
  background:none;
  border:none;
  text-align:left;
  padding:4px 8px;
  font-family:'Cinzel',serif;
  font-size:.7rem;
  color:#fff;
  cursor:pointer;
  border-radius:30px;
  transition:all .2s;
  display:flex;
  align-items:center;
  width:100%;
  justify-content:space-between;
}
.filtro-menu input,.rev-filter-menu input{accent-color:var(--accent);width:14px;height:14px;margin-right:6px;flex-shrink:0}
.filtro-menu .label-text,.rev-filter-menu .label-text{flex-grow:1;margin-right:6px}
.filtro-menu span.count,.rev-filter-menu span.count{color:#b8a87a;font-size:.6rem;flex-shrink:0;margin-left:auto}
.limpiar-categoria{
  background:rgba(100,70,40,.7);
  border:1px solid var(--border-color);
  border-radius:30px;
  padding:2px 8px;
  font-family:'Cinzel',serif;
  font-size:.65rem;
  color:var(--text-primary);
  cursor:pointer;
  margin-top:4px;
  text-align:center;
}
.limpiar-categoria:disabled{
  opacity:var(--disabled-opacity);
  cursor:not-allowed;
  pointer-events:none;
}

/* ========== OVERLAY BLOQUEADOR ========== */
.menu-overlay{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:transparent;
  z-index:199;
}

/* ========== MENÚS FLOTANTES TEMPORALES (MODALES) ========== */
.temp-floating-menu{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(25,20,40,.95);
  backdrop-filter:blur(12px);
  border:1px solid var(--border-color);
  border-radius:24px;
  padding:15px 18px;
  min-width:280px;
  max-width:90vw;
  z-index:1001;
  box-shadow:0 15px 35px rgba(0,0,0,.6);
  display:none;
  flex-direction:column;
  gap:10px;
}
.temp-floating-menu.show{display:flex}
.temp-floating-menu .temp-header{
  text-align:center;
  font-family:'Cinzel',serif;
  color:var(--accent);
  font-weight:600;
  font-size:.85rem;
  border-bottom:1px solid var(--border-color);
  padding-bottom:8px;
  margin-bottom:4px;
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.temp-floating-menu .temp-header button{
  background:none;
  border:none;
  font-size:1rem;
  color:var(--accent);
  cursor:pointer;
  padding:0 4px;
  margin-left:8px;
}
.temp-floating-menu .slider-container{padding:0 5px}
.temp-floating-menu input[type=range]{
  width:100%;
  accent-color:var(--accent);
  margin:6px 0;
}
.temp-floating-menu .slider-labels{
  display:flex;
  justify-content:space-between;
  font-size:.65rem;
  color:var(--text-secondary);
  padding:0 2px;
  margin-bottom:4px;
}
.temp-floating-menu .temp-value{
  text-align:center;
  font-family:'Cinzel',serif;
  color:var(--accent);
  font-size:.9rem;
  margin:4px 0;
}
.temp-floating-menu .rev-options{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:4px 0;
}
.temp-floating-menu .rev-option{
  background:rgba(25,20,40,.85);
  border:1px solid var(--border-color);
  border-radius:30px;
  padding:8px 14px;
  color:var(--text-primary);
  cursor:pointer;
  font-family:'Cinzel',serif;
  font-size:.75rem;
  text-align:center;
  transition:all .2s;
}
.temp-floating-menu .rev-option:hover{
  background:var(--accent-hover);
  color:#1a1625;
}
.temp-floating-menu .rev-option.active{
  background:var(--accent);
  color:#1a1625;
  border-color:var(--accent-hover);
  box-shadow:0 0 4px var(--accent);
}
.temp-floating-menu .temp-actions{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:6px;
}
.temp-floating-menu .temp-actions button{
  flex:0 0 auto;
  min-width:44px;
  width:44px;
  height:44px;
  background:rgba(100,70,40,.7);
  border:1px solid var(--border-color);
  border-radius:40px;
  font-size:1.3rem;
  color:var(--text-primary);
  cursor:pointer;
  transition:all .2s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
  font-weight:500;
}
.temp-floating-menu .temp-actions button:hover:not(:disabled){
  background:var(--accent-hover);
  color:#1a1625;
  transform:scale(.96);
}
.temp-floating-menu .temp-actions button:active:not(:disabled){transform:scale(.92)}
.temp-floating-menu .temp-actions button:disabled{
  opacity:var(--disabled-opacity);
  cursor:not-allowed;
}

/* Grid para checkboxes dentro de modales */
.modal-checkbox-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
  max-height: 50vh;
  overflow-y: auto;
  padding: 4px 8px;
  margin-bottom: 16px;
}
.modal-checkbox-grid label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--text-primary);
  background: rgba(0,0,0,0.2);
  padding: 4px 8px;
  border-radius: 20px;
}
.modal-checkbox-grid label.disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
}
.modal-actions button {
  flex: 0 0 auto;
  min-width: 44px;
  width: 44px;
  height: 44px;
  background: rgba(100,70,40,0.7);
  text-align: center;
  padding: 0;
  font-size: 1.4rem;
  border-radius: 40px;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.modal-actions button:hover:not(:disabled) {
  background: var(--accent-hover);
  color: #1a1625;
  transform: scale(0.96);
}
.modal-actions button:active:not(:disabled) {
  transform: scale(0.92);
}
.modal-actions button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.help-content {
  color: var(--text-primary);
  font-size: 0.7rem;
  line-height: 1.4;
  overflow-y: auto;
  max-height: 60vh;
}
.help-content p { margin-bottom: 6px; }
.help-content hr { border-color: var(--border-color); margin: 8px 0; }
.help-content img { display: block; margin: 10px auto; max-width: 200px; width: 100%; height: auto; }

.csv-menu{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  min-width:340px;
  max-width:90vw;
  max-height:80vh;
  overflow-y:auto;
  z-index:1001;
  padding:15px;
  border-radius:24px;
  backdrop-filter:blur(8px);
}
.csv-menu .csv-header{
  text-align:center;
  margin-bottom:12px;
  font-family:'Cinzel',serif;
  color:var(--accent);
  border-bottom:1px solid var(--border-color);
  padding-bottom:6px;
  font-weight:600;
}
.csv-menu .csv-checkbox-group{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:8px;
  max-height:40vh;
  overflow-y:auto;
  margin-bottom:16px;
  padding-right:4px;
}
.csv-menu .csv-checkbox-group label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.75rem;
  cursor:pointer;
  color:var(--text-primary);
  background:rgba(0,0,0,.2);
  padding:4px 8px;
  border-radius:20px;
}
.csv-menu .csv-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:12px;
}
.csv-menu .csv-actions button{
  flex:0 0 auto;
  min-width:44px;
  width:44px;
  height:44px;
  background:rgba(100,70,40,.7);
  text-align:center;
  padding:0;
  font-size:1.4rem;
  border-radius:40px;
  transition:all .2s;
  font-family:'Inter',sans-serif;
  font-weight:500;
  border:1px solid var(--border-color);
  color:var(--text-primary);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.csv-menu .csv-actions button:hover:not(:disabled){background:var(--accent-hover);color:#1a1625;transform:scale(.96)}
.csv-menu .csv-actions button:active:not(:disabled){transform:scale(.92)}
.csv-menu .csv-actions button:disabled{opacity:.5;cursor:not-allowed}

.search-wrapper{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:rgba(25,20,40,.85);
  border-radius:40px;
  padding:2px 8px;
}
.search-wrapper input{
  background:transparent;
  border:none;
  padding:4px 0;
  font-family:'Inter',sans-serif;
  font-size:.7rem;
  color:var(--text-primary);
  outline:none;
  width:140px;
}
.result-count{
  background:rgba(0,0,0,.4);
  padding:2px 8px;
  border-radius:40px;
  font-size:.7rem;
  color:var(--accent);
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.pagination-controls{
  display:inline-flex;
  align-items:center;
  gap:3px;
  background:rgba(0,0,0,.2);
  border-radius:40px;
  padding:2px 5px;
}
.pagination-controls input{
  width:40px;
  text-align:center;
  background:rgba(25,20,40,.7);
  border:1px solid var(--border-color);
  border-radius:30px;
  padding:2px 0;
  font-family:'Cinzel',serif;
  font-size:.65rem;
  color:var(--text-primary);
  outline:none;
}
.pagination-controls input:read-only{opacity:.6;cursor:default}
.grid-wrapper{padding:15px 20px 30px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
  opacity:1;
  transition:opacity .2s;
}
.card{
  background:var(--card-bg);
  border-radius:20px;
  cursor:pointer;
  border:1px solid var(--border-color);
  transition:transform .2s ease, border-color .1s;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}
.card:hover{
  transform:translateY(-2px);
  background:rgba(18,15,30,.9);
  border-color:var(--accent);
}
/* ===== ANIMACIÓN DE BARRIDO ELIMINADA ===== */
.img-container{
  width:100%;
  height:150px;
  position:relative;
  overflow:hidden;
  border-radius:20px 20px 0 0;
  background: rgba(0,0,0,0.3);
}
.img-container img{width:100%;height:100%;object-fit:cover}
.card-footer-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;gap:8px;margin-top:auto;position:relative;z-index:2}
.badges-wrapper{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.card-actions{display:flex;gap:6px;align-items:center}
.mini-badge{
  width:20px;
  height:20px;
  border-radius:30px;
  background:rgba(0,0,0,.7);
  backdrop-filter:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  border:1px solid var(--border-color);
  cursor:pointer;
  transition:transform .1s;
}
.mini-badge:active{transform:scale(.96)}
.card b{
  display:block;
  padding:12px 8px 6px;
  text-align:center;
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:.9rem;
  background:var(--title-gradient);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  word-break:break-word;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:font-size .05s linear;
  flex:1;
  position:relative;
  z-index:2;
}
.card b.wrap-name {
  white-space: normal !important;
  overflow: visible;
  text-overflow: unset;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  max-height: calc(2 * 1.2em + 12px);
  line-height: 1.2;
  padding-bottom: 6px;
}
.modal-header h3{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:calc(100% - 100px);
  transition:font-size .05s linear;
  font-family: 'Cinzel', serif;
  font-weight: 800;
  background: var(--title-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.modal-header h3.wrap-name { white-space: normal !important; }
#detalle{position:relative;overflow:hidden}
#detalle::before{
  content:'';
  position:absolute;

<body>

</div>

      <div class="modal-header">
        <h3 id="modal-title">Nombre</h3>
        <div class="modal-header-actions">
          <button id="modalFav" class="fav-star" title="Favorito">☆</button>
          <button id="modalCopyLink" class="copy-link" title="Copiar enlace">▲</button>
          <button id="modalRevisado" class="revisado-icon" title="Marcar revisado">◇</button>
          <span id="cerrar" title="Cerrar">✕</span>
        </div>

        <div class="info-scroll" id="modal-info-scroll"></div>
        <div class="image-fixed"><img id="modal-image" src=""></div>
      </div>
    </div>
    <div class="modal-arrow next" id="modalNextArrow"><span>▶</span></div>
  </div>
</div>
<script>
// ==================== DATOS Y LÓGICA ====================
let especies=[],filtrosState={morfologia:[],tipo:[],elemento:[],avistamiento:[],ubicacion:[],epoca:[],subcategorias:[]},revFilterState=[],currentPage=1,perPage=24,
    dataLoaded=false,onlyFavorites=false,currentOrderedList=[],currentModalIndex=-1,
    currentModalCreature=null,searchTerm='',navegacionBloqueada=false,revisados=new Set(),modoRevision="manual",
    favoritos=new Set(),csvFields=["id","nombre","morfologia","tipo","elemento","avistamiento","ubicacion","epoca","subcategorias","descripcion","links"],
    selectedFields=[...csvFields.filter(f=>f!=='nombre')],
    csvMenu=null,ubicacionModal=null,epocaModal=null,subcategoriasModal=null,ordenActual="nombre_asc",touchStartX=0,
    tempPerPage=24,tempModoRevision="manual", panelVisible=true, menuOverlay=null,
    headerOriginalZIndex='100', activeTooltip=null, tooltipTimeout=null;

const opcionesMorfologia=["Humano","Humanoide","Mamífero","Híbrido","Ave","Reptil","Pez","Insecto","Amorfo","Etéreo","Artificial","Otro"];
const opcionesTipo=["Mitológico","Criptido","Difuso"];
const opcionesElemento=["Aéreo","Acuático","Terrestre","Subterráneo","Anfibio","Misceláneo"];
const opcionesAvistamiento=["Grabado / Capturado","Documentado","Crónicas","Avistamiento","Ficción","Tradición oral","Difuso"];

const iconMap={
  morfologia:{Humano:"🧑",Humanoide:"🧝",Mamífero:"🦌",Híbrido:"🦄",Ave:"🕊️",Reptil:"🐍",Pez:"🐟",Insecto:"🐞",Amorfo:"🌀",Etéreo:"✨",Artificial:"🤖",Otro:"❓"},
  tipo:{Mitológico:"🏛️",Criptido:"🐾",Difuso:"🌫️"},
  elemento:{Aéreo:"💨",Acuático:"💧",Terrestre:"🌿",Subterráneo:"⛰️",Anfibio:"🐸",Misceláneo:"⚙️"},
  avistamiento:(v)=>v.includes("Grabado")?"📹":v==="Documentado"?"📜":v==="Crónicas"?"📖":v==="Avistamiento"?"👁️":v==="Ficción"?"📚":v.includes("oral")?"🗣️":"❓"
};

const $=id=>document.getElementById(id),gridDiv=$("grid"),resultSpan=$("resultText"),
      searchInput=$("searchInput"),clearSearchBtn=$("clearSearch"),searchDatalist=$("searchSuggestions"),
      favFilterBtn=$("favFilterBtn"),modalPrevArrow=$("modalPrevArrow"),modalNextArrow=$("modalNextArrow"),
      paginationControlsDiv=$("paginationControls"),btnOrden=$("btnOrden"),ordenMenu=$("ordenMenu"),
      configBtn=$("configBtn"),configMenu=$("configMenu"),revFilterMenu=$("menu-rev"),btnRevFilter=$("btnRevFilter"),
      btnLimpiar=$("btnLimpiar"),overlayEl=$("overlay"),
      modalTitle=$("modal-title"),modalImg=$("modal-image"),modalInfoScroll=$("modal-info-scroll"),
      modalRevisadoBtn=$("modalRevisado"),modalFavBtn=$("modalFav"),modalCopyLinkBtn=$("modalCopyLink"),cerrarBtn=$("cerrar"),
      filtrosPanel=$("filtrosPanel"),mainTitle=$("mainTitle"),
      headerCornerImg=$("headerCornerImg"),mainHeader=$("mainHeader"),headerContainer=$("headerContainer");

const getIconForMorfologia=e=>iconMap.morfologia[e]||"🔮";
const getIconForTipo=e=>iconMap.tipo[e]||"🌙";
const getIconForElemento=e=>iconMap.elemento[e]||"💧";
const getIconForAvistamiento=v=>iconMap.avistamiento(v);

function saveLocal(k,v){localStorage.setItem(k,JSON.stringify(v));}
function loadLocal(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function persistState(){saveLocal('catalogo_filtros',filtrosState);saveLocal('catalogo_orden',ordenActual);saveLocal('catalogo_perpage',perPage);saveLocal('catalogo_onlyFav',onlyFavorites);saveRevFilterState()}
function actualizarFiltroActivo(btn,activo){btn.classList.toggle('active-filter',activo);}

// ========== TOOLTIP GLOBAL ==========
function hideTooltip(){
  if(activeTooltip){
    activeTooltip.style.opacity='0';
    setTimeout(()=>{ if(activeTooltip && activeTooltip.parentNode) activeTooltip.remove(); activeTooltip=null; },200);
  }
  if(tooltipTimeout){ clearTimeout(tooltipTimeout); tooltipTimeout=null; }
}
function showTooltip(text, x, y, duration=1500){
  hideTooltip();
  const tt=document.createElement("div");
  tt.className="temp-tooltip";
  tt.textContent=text;
  tt.style.position="fixed";
  tt.style.left=x+"px";
  tt.style.top=y+"px";
  tt.style.opacity="1";
  document.body.appendChild(tt);
  activeTooltip=tt;
  tooltipTimeout = setTimeout(()=>{ if(activeTooltip === tt) hideTooltip(); }, duration);
}
document.addEventListener("click", (e)=> {
  if(activeTooltip && e.target.closest('.temp-tooltip')) return;
  hideTooltip();
});
function closeAllMenusAndTooltip(){
  closeAllMenus();
  hideTooltip();
}
const originalCloseAllMenus = closeAllMenus;
window.closeAllMenus = function(){ originalCloseAllMenus(); hideTooltip(); };
closeAllMenus = window.closeAllMenus;

// ========== ÍNDICES INVERTIDOS ==========
let idxMorfologia, idxTipo, idxElemento, idxAvistamiento, idxUbicacion, idxEpoca, idxSubcategorias;
function buildIndexes(){
  idxMorfologia = new Map(); idxTipo = new Map(); idxElemento = new Map(); idxAvistamiento = new Map(); idxUbicacion = new Map(); idxEpoca = new Map(); idxSubcategorias = new Map();
  for(let e of especies){
    const id = e.id;
    addToIndex(idxMorfologia, e.morfologia, id);
    addToIndex(idxTipo, e.tipo, id);
    addToIndex(idxElemento, e.elemento, id);
    addToIndex(idxAvistamiento, e.avistamiento, id);
    if(e.ubicacion) addToIndex(idxUbicacion, e.ubicacion, id);
    if(e.epoca) addToIndex(idxEpoca, e.epoca, id);
    if(e.subcategorias){
      e.subcategorias.split(',').forEach(s=>{ let t=s.trim(); if(t) addToIndex(idxSubcategorias, t, id); });
    }
  }
}
function addToIndex(map, key, id){ if(!map.has(key)) map.set(key, new Set()); map.get(key).add(id); }

// ========== FILTRO BASE ==========
let baseFilterVersion = 0;
let cachedBaseIds = null;
let cachedBaseVersion = -1;
let cachedIgnoreCat = null;

function baseFilterPredicate(ignoreCat){
  return e=>{
    if(ignoreCat !== 'morfologia' && filtrosState.morfologia.length && !filtrosState.morfologia.includes(e.morfologia)) return false;
    if(ignoreCat !== 'tipo' && filtrosState.tipo.length && !filtrosState.tipo.includes(e.tipo)) return false;
    if(ignoreCat !== 'elemento' && filtrosState.elemento.length && !filtrosState.elemento.includes(e.elemento)) return false;
    if(ignoreCat !== 'avistamiento' && filtrosState.avistamiento.length && !filtrosState.avistamiento.includes(e.avistamiento)) return false;
    if(ignoreCat !== 'ubicacion' && filtrosState.ubicacion.length && !filtrosState.ubicacion.includes(e.ubicacion)) return false;
    if(ignoreCat !== 'epoca' && filtrosState.epoca.length && !filtrosState.epoca.includes(e.epoca)) return false;
    if(ignoreCat !== 'subcategorias' && filtrosState.subcategorias.length){
      const subcats = e.subcategorias ? e.subcategorias.split(',').map(s=>s.trim()).filter(s=>s) : [];
      if(!filtrosState.subcategorias.some(sel => subcats.includes(sel))) return false;
    }
    if(onlyFavorites && !favoritos.has(e.id)) return false;
    if(searchTerm.trim() && !e.nombre.toLowerCase().includes(searchTerm.toLowerCase()) && !e.descripcion.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    return true;
  };
}

function getBaseFilteredIds(ignoreCat=null){
  if(baseFilterVersion === cachedBaseVersion && ignoreCat === cachedIgnoreCat && cachedBaseIds !== null) return cachedBaseIds;
  const pred = baseFilterPredicate(ignoreCat);
  const ids = new Set();
  for(let e of especies) if(pred(e)) ids.add(e.id);
  cachedBaseIds = ids;
  cachedBaseVersion = baseFilterVersion;
  cachedIgnoreCat = ignoreCat;
  return ids;
}

function invalidateBaseCache(){ baseFilterVersion++; }

function contarConOpcion(categoria, opcion){
  const baseIds = getBaseFilteredIds(categoria);
  if(!baseIds.size) return 0;
  let opSet;
  switch(categoria){
    case 'morfologia': opSet = idxMorfologia.get(opcion); break;
    case 'tipo': opSet = idxTipo.get(opcion); break;
    case 'elemento': opSet = idxElemento.get(opcion); break;
    case 'avistamiento': opSet = idxAvistamiento.get(opcion); break;
    case 'ubicacion': opSet = idxUbicacion.get(opcion); break;
    case 'epoca': opSet = idxEpoca.get(opcion); break;
    case 'subcategorias': opSet = idxSubcategorias.get(opcion); break;
    default: return 0;
  }
  if(!opSet || !opSet.size) return 0;
  if(baseIds.size < opSet.size){
    let count=0; for(let id of baseIds) if(opSet.has(id)) count++; return count;
  } else {
    let count=0; for(let id of opSet) if(baseIds.has(id)) count++; return count;
  }
}

function contarPorEstado(estado){
  const baseIds = getBaseFilteredIds(null);
  if(!baseIds.size) return 0;
  let count=0;
  for(let id of baseIds){
    const r = revisados.has(id);
    if(estado === "revisado" ? r : !r) count++;
  }
  return count;
}

function buildPredicate(extraCheck=null){
  return e=>{
    if(filtrosState.morfologia.length && !filtrosState.morfologia.includes(e.morfologia)) return false;
    if(filtrosState.tipo.length && !filtrosState.tipo.includes(e.tipo)) return false;
    if(filtrosState.elemento.length && !filtrosState.elemento.includes(e.elemento)) return false;
    if(filtrosState.avistamiento.length && !filtrosState.avistamiento.includes(e.avistamiento)) return false;
    if(filtrosState.ubicacion.length && !filtrosState.ubicacion.includes(e.ubicacion)) return false;
    if(filtrosState.epoca.length && !filtrosState.epoca.includes(e.epoca)) return false;
    if(filtrosState.subcategorias.length){
      const subcats = e.subcategorias ? e.subcategorias.split(',').map(s=>s.trim()).filter(s=>s) : [];
      if(!filtrosState.subcategorias.some(sel => subcats.includes(sel))) return false;
    }
    if(onlyFavorites && !favoritos.has(e.id)) return false;
    if(searchTerm.trim() && !e.nombre.toLowerCase().includes(searchTerm.toLowerCase()) && !e.descripcion.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    if(revFilterState.length){ const r=revisados.has(e.id); if(!(revFilterState.includes("revisado")&&revFilterState.includes("no_revisado")) && ((revFilterState.includes("revisado")&&!r) || (revFilterState.includes("no_revisado")&&r))) return false;}
    return extraCheck?extraCheck(e):true;
  };
}
const aplicarFiltrosCompletos=()=>especies.filter(buildPredicate());

function ordenarEspecies(lista){ const [campo,dir]=ordenActual.split('_'); const order=dir==="asc"?1:-1; return [...lista].sort((a,b)=>{ let va=a[campo]||"", vb=b[campo]||""; return va<vb?-order:va>vb?order:0; }); }

// ========== PERSISTENCIA ==========
const STORAGE_VERSION = 11;
function resetAllData(){
  localStorage.clear();
  filtrosState={morfologia:[],tipo:[],elemento:[],avistamiento:[],ubicacion:[],epoca:[],subcategorias:[]};
  revFilterState=[]; revisados.clear(); favoritos.clear(); onlyFavorites=false; ordenActual="nombre_asc"; perPage=24; currentPage=1; searchTerm='';
  saveLocal('catalogo_version',STORAGE_VERSION); persistState(); saveRevisados(); saveFavoritos();
}
function checkVersion(){ const v=loadLocal('catalogo_version'); if(v!==STORAGE_VERSION){ resetAllData(); return false; } return true; }
function loadRevisados(){ const s=loadLocal('catalogo_revisados'); if(s) revisados=new Set(s); }
function saveRevisados(){ saveLocal('catalogo_revisados',[...revisados]); }
function loadModoRevision(){ const m=localStorage.getItem('catalogo_modo_revision'); if(m) modoRevision=m; tempModoRevision=modoRevision; }
function saveModoRevision(){ localStorage.setItem('catalogo_modo_revision',modoRevision); }
function loadFavoritos(){ const f=loadLocal('catalogo_favoritos'); if(f) favoritos=new Set(f); actualizarEstadoFavoritosYBoton(); }
function saveFavoritos(){ saveLocal('catalogo_favoritos',[...favoritos]); actualizarEstadoFavoritosYBoton(); }
function loadRevFilterState(){ const s=loadLocal('catalogo_rev_filter'); revFilterState=s||[]; }
function saveRevFilterState(){ saveLocal('catalogo_rev_filter',revFilterState); updateRevFilterBadge(); }

function validarFiltrosState(){
  if(!especies.length) return;
  const categoriasSimples=['morfologia','tipo','elemento','avistamiento','ubicacion','epoca'];
  for(let cat of categoriasSimples){
    const valoresExistentes=new Set(especies.map(e=>e[cat]).filter(v=>v));
    if(filtrosState[cat] && filtrosState[cat].length) filtrosState[cat]=filtrosState[cat].filter(v=>valoresExistentes.has(v));
  }
  const todasSubs = new Set();
  especies.forEach(e=>{ if(e.subcategorias) e.subcategorias.split(',').forEach(s=>{ let t=s.trim(); if(t) todasSubs.add(t); }); });
  if(filtrosState.subcategorias && filtrosState.subcategorias.length) filtrosState.subcategorias=filtrosState.subcategorias.filter(v=>todasSubs.has(v));
  persistState();
}
function loadPersistedState(){
  if(!checkVersion()) return;
  const f=loadLocal('catalogo_filtros'); if(f) filtrosState=f;
  const o=loadLocal('catalogo_orden'); ordenActual=o||"nombre_asc";
  const pp=loadLocal('catalogo_perpage'); if(pp) perPage=+pp;
  const of=loadLocal('catalogo_onlyFav'); onlyFavorites=(of===true||of==='true');
  loadRevFilterState();
  if(especies.length) validarFiltrosState();

}

// ========== CARGA DE IMAGEN ==========
function setImageWithFallback(imgElement, nombre, transformStyle="", isPrioritario=false){
  const extensions=['jpg','jpeg','png']; let currentExtIndex=0;
  if(isPrioritario){
    imgElement.fetchPriority = "high";
    imgElement.loading = "eager";
  } else {
    imgElement.loading = "lazy";
  }
  const tryNext=()=>{
    if(currentExtIndex>=extensions.length){
      imgElement.style.display="none";
      const parent=imgElement.parentNode;
      if(!parent.querySelector(".img-placeholder")){
        const placeholder=document.createElement("div");
        placeholder.className="mini-badge img-placeholder";
        placeholder.style.cssText="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;background:rgba(0,0,0,0.6);";
        placeholder.textContent="📜✨";
        parent.appendChild(placeholder);
      }
      return;
    }
    const ext=extensions[currentExtIndex];
    const url=`img/${encodeURIComponent(nombre)}.${ext}`;
    imgElement.src=url; imgElement.style.display="block";
    if(transformStyle) imgElement.style.transform=transformStyle;
    imgElement.onerror=()=>{ const parent=imgElement.parentNode; const oldPlaceholder=parent.querySelector(".img-placeholder"); if(oldPlaceholder) oldPlaceholder.remove(); currentExtIndex++; tryNext(); };
    imgElement.onload=()=>{ const parent=imgElement.parentNode; const oldPlaceholder=parent.querySelector(".img-placeholder"); if(oldPlaceholder) oldPlaceholder.remove(); imgElement.style.display="block"; };
  };
  tryNext();
}
function crearImg(e, isPrioritario=false){
  const img=document.createElement("img");
  const transformStyle=`translate(${e.posX||0}px, ${e.posY||0}px) scale(${e.zoom||1})`;
  setImageWithFallback(img, e.nombre, transformStyle, isPrioritario);
  return img;
}

function levenshteinDistance(a,b){ if(!a.length)return b.length; if(!b.length)return a.length; const m=[]; for(let i=0;i<=b.length;i++) m[i]=[i]; for(let j=0;j<=a.length;j++) m[0][j]=j; for(let i=1;i<=b.length;i++) for(let j=1;j<=a.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[j-1]===b[i-1]?0:1)); return m[b.length][a.length]; }
function showTemporaryTooltip(el,text, duration=1500){
  if(!el) return;
  const rect = el.getBoundingClientRect();
  let x = rect.left + rect.width/2;
  let y = rect.top - 8;
  if(y < 0) y = rect.bottom + 8;
  x = Math.min(Math.max(x, 10), window.innerWidth-10);
  showTooltip(text, x-25, y-5, duration);
}
function setupBadgeHover(badge, text){
  let hoverTimeout=null;
  badge.addEventListener("mouseenter", (e)=>{
    if(hoverTimeout) clearTimeout(hoverTimeout);
    hoverTimeout = setTimeout(()=>{
      const rect = badge.getBoundingClientRect();
      let x = rect.left + rect.width/2 - 25;
      let y = rect.top - 8;
      if(y < 0) y = rect.bottom + 8;
      x = Math.min(Math.max(x, 10), window.innerWidth-50);
      showTooltip(text, x, y-5, 2000);
    }, 300);
  });
  badge.addEventListener("mouseleave", ()=>{
    if(hoverTimeout){ clearTimeout(hoverTimeout); hoverTimeout=null; }
    hideTooltip();
  });
}

function adjustTitleFontSize(){ const ruler=document.createElement('span'); ruler.style.cssText='position:fixed;visibility:hidden;white-space:nowrap;font-family:Cinzel,serif;font-weight:700;padding:0 8px;pointer-events:none'; document.body.appendChild(ruler); const minFontSize=0.7; document.querySelectorAll('.card b').forEach(t=>{ const a=t.clientWidth; if(a<=0) return; ruler.textContent=t.textContent; let fs=0.9; ruler.style.fontSize=fs+'rem'; while(fs>minFontSize&&ruler.offsetWidth>a){ fs-=0.005; ruler.style.fontSize=fs+'rem'; } if(ruler.offsetWidth>a){ t.classList.add('wrap-name'); t.style.fontSize=minFontSize+'rem'; } else { t.classList.remove('wrap-name'); t.style.fontSize=fs+'rem'; } }); ruler.remove(); }
function adjustModalTitleFontSize(){ const h3=modalTitle; if(!h3) return; const availableWidth=h3.clientWidth; if(availableWidth<=0) return; const minFontSize=0.8; const testEl=document.createElement('span'); testEl.style.cssText='position:fixed;visibility:hidden;white-space:nowrap;font-family:"Cinzel",serif;font-weight:800;width:'+availableWidth+'px;display:inline-block;pointer-events:none;box-sizing:content-box;'; testEl.textContent=h3.textContent; document.body.appendChild(testEl); let fs=1.4; testEl.style.fontSize=fs+'rem'; while(fs>minFontSize&&testEl.scrollWidth>testEl.clientWidth){ fs-=0.05; testEl.style.fontSize=fs+'rem'; } if(testEl.scrollWidth>testEl.clientWidth){ h3.classList.add('wrap-name'); h3.style.fontSize=minFontSize+'rem'; } else { h3.classList.remove('wrap-name'); h3.style.fontSize=fs+'rem'; } testEl.remove(); }

// ========== NUEVA LÓGICA DE CARGA MÚLTIPLE ==========
async function cargarArchivosDesdeCarpeta() {
  let todosLosDatos = [];
  let indice = 1;
  let hayError = false;
  
  while (!hayError) {
    const url = `dtsk/Datos${indice}.json`;
    try {
      const respuesta = await fetch(url, { cache: 'no-store' });
      if (!respuesta.ok) {
        hayError = true;
        break;
      }
      const datos = await respuesta.json();
      if (Array.isArray(datos)) {
        todosLosDatos.push(...datos);
      } else {
        todosLosDatos.push(datos);
      }
      indice++;
    } catch (error) {
      hayError = true;
      break;
    }
  }
  return todosLosDatos;
}

async function cargarDatos(){
  try {
    let datosCombinados = await cargarArchivosDesdeCarpeta();
    if (datosCombinados.length === 0) {
      console.warn("No se encontraron archivos DatosX.json en la carpeta dtsk/");
      const res = await fetch('datos.json', { cache: 'no-store' });
      if (res.ok) {
        const respaldo = await res.json();
        datosCombinados = Array.isArray(respaldo) ? respaldo : [respaldo];
      }
    }
    
    especies = datosCombinados.map((criatura, idx) => {
      if (criatura.posX === undefined) {
        if (criatura.posx !== undefined) criatura.posX = criatura.posx;
        else criatura.posX = 0;
      }
      if (criatura.posY === undefined) {
        if (criatura.posy !== undefined) criatura.posY = criatura.posy;
        else criatura.posY = 0;
      }
      if (criatura.zoom === undefined) criatura.zoom = 1;
      
      if (!criatura.id) {
        criatura.id = `criatura_${idx}_${Date.now()}_${Math.random()}`;
      }
      return criatura;
    });
    
    dataLoaded = true;
    buildIndexes();
    loadFavoritos(); 
    loadRevisados(); 
    loadModoRevision(); 
    loadPersistedState();
    updateSearchSuggestions(); 
    updateClearSearchState(); 
    regenerarMenus(); 
    await render();
    window.addEventListener('resize',()=>{ if(dataLoaded) adjustTitleFontSize(); if(overlayEl.classList.contains("show")) adjustModalTitleFontSize(); actualizarImagenEsquina(); });
    actualizarImagenEsquina();
    const hash=window.location.hash.substring(1); if(hash.startsWith("id=")){ const id=decodeURIComponent(hash.substring(3)); const cr=especies.find(e=>e.id===id); if(cr) setTimeout(()=>abrirDetalle(cr),300); }
    window.scrollTo({top:0,behavior:'instant'});
  } catch(err){ 
    console.error("Error cargando datos:", err);
    especies = [];
    dataLoaded = true;
    render();
  }
}

initMenus(); 
cargarDatos();
</script>
