<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Índice de Seres Místicos</title>
<link rel="icon" href="img2/icono4.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img2/anuncio1.gif">
<style>
/* ── Variables ──────────────────────────────── */
:root {
  --bg:              #0f0c18;
  --header-bg:       rgba(10,8,18,.95);
  --card-bg:         rgba(18,15,30,.85);
  --text-primary:    #f0eef7;
  --text-secondary:  #e5dccf;
  --accent:          #e0bc6c;
  --accent-hover:    #f3d27e;
  --border:          #dbba6c;
  --disabled-op:     0.5;
  --filter-shadow:   0 0 4px #f3d27e;
  --title-gradient:  linear-gradient(135deg,#ffe6b3,#f3d27e,#e0bc6c,#f3d27e,#ffe6b3);
}

/* ── Reset & Base ───────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
html { scroll-padding-top:70px }
body {
  background:var(--bg); color:var(--text-primary);
  font-family:'Inter',sans-serif; overflow-x:hidden; position:relative;
}
body.modal-open { overflow:hidden }
body::before {
  content:""; position:fixed; inset:0;
  background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDYiLz48L3N2Zz4=');
  background-repeat:repeat; opacity:.2; pointer-events:none; z-index:0;
}

/* ── Layout z-index ─────────────────────────── */
.container, .main-header, .grid-wrapper, #overlay { position:relative; z-index:1 }

/* ── Header ─────────────────────────────────── */
.main-header {
  position:sticky; top:0; z-index:100;
  background:var(--header-bg); padding:8px 16px 8px 16px; padding-right:60px;
  box-shadow:0 1px 3px rgba(0,0,0,.3); border-bottom:1px solid var(--border);
}
.header-corner {
  position:absolute; top:0; right:0; height:100%; max-height:100%; width:auto;
  object-fit:contain; z-index:2; filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));
  cursor:pointer; pointer-events:all;
}

/* ── Título ─────────────────────────────────── */
h2 {
  font-family:'Cinzel',serif; font-size:1.6rem; font-weight:800; letter-spacing:2px;
  background:var(--title-gradient); -webkit-background-clip:text; background-clip:text;
  color:transparent; margin-bottom:6px; text-shadow:0 0 6px rgba(224,188,108,.3);
  cursor:pointer; user-select:none;
}

/* ── Panel de filtros ───────────────────────── */
.filtros-panel { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; align-items:center }
.filtros-panel.oculto { display:none }
.filtro-group { position:relative }

/* ── Botones generales ──────────────────────── */
.filtro-boton, .btn-limpiar, .fav-filter-btn, .pagination-btn, .config-btn {
  background:rgba(25,20,40,.85); border:1px solid var(--border); border-radius:40px;
  padding:5px 10px; font-family:'Cinzel',serif; font-weight:600;
  color:var(--text-primary); font-size:.9rem; cursor:pointer;
  transition:transform .1s ease, background .1s; white-space:nowrap; line-height:1; outline:none;
}
.filtro-boton:disabled, .btn-limpiar:disabled,
.fav-filter-btn:disabled, .pagination-btn:disabled, .config-btn:disabled,
.limpiar-categoria:disabled { opacity:var(--disabled-op); cursor:not-allowed; pointer-events:none }

.search-clear {
  cursor:pointer; font-size:.9rem; font-weight:700; color:var(--accent);
  background:none; border:none; padding:0 2px; transition:opacity .2s;
}
.search-clear.disabled { opacity:var(--disabled-op); pointer-events:none; cursor:default }
.search-clear:active:not(.disabled) { transform:scale(.9) }
.filtro-menu input:disabled, .rev-filter-menu input:disabled { opacity:var(--disabled-op); cursor:not-allowed }
.filtro-menu label:has(input:disabled), .rev-filter-menu label:has(input:disabled) { opacity:var(--disabled-op); cursor:default }

/* Hover (solo dispositivos con puntero fino) */
@media (hover:hover) {
  .filtro-boton:hover:not(:disabled), .btn-limpiar:hover:not(:disabled),
  .fav-filter-btn:hover:not(:disabled), .pagination-btn:hover:not(:disabled),
  .config-btn:hover {
    background:var(--accent-hover); color:#1a1625; border-color:var(--accent);
  }
  .filtro-menu button:hover, .rev-filter-menu label:hover:has(input:not(:disabled)),
  .orden-menu button:hover, .config-menu button:hover, .config-submenu button:hover {
    background:var(--accent-hover); color:#1a1625;
  }
}

/* Active state compartido */
.filtro-boton:active:not(:disabled), .btn-limpiar:active:not(:disabled),
.fav-filter-btn:active:not(:disabled), .pagination-btn:active:not(:disabled),
.config-btn:active {
  background:var(--accent-hover); color:#1a1625; border-color:var(--accent); transform:scale(.98);
}
.filtro-boton.active-filter { border-color:var(--accent-hover); box-shadow:var(--filter-shadow) }
.fav-filter-btn.active { background:var(--accent); color:#1a1625; border-color:var(--accent-hover); box-shadow:0 0 4px var(--accent) }

/* ── Menús flotantes (dropdown) ─────────────── */
.filtro-menu, .orden-menu, .config-menu, .rev-filter-menu {
  position:absolute; top:110%; left:0;
  background:rgba(25,20,40,.9); backdrop-filter:blur(8px);
  border:1px solid var(--border); border-radius:20px; padding:8px 12px;
  min-width:180px; z-index:200; box-shadow:0 8px 20px rgba(0,0,0,.4);
  display:none; flex-direction:column; gap:4px;
}
.config-menu { min-width:200px }
.config-submenu {
  position:absolute; top:0; left:100%; margin-left:5px;
  background:rgba(25,20,40,.9); backdrop-filter:blur(8px);
  border:1px solid var(--border); border-radius:20px; padding:6px;
  min-width:100px; display:none; flex-direction:column; gap:4px; z-index:210;
}
.config-submenu.show, .filtro-menu.show, .orden-menu.show,
.config-menu.show, .rev-filter-menu.show { display:flex }

.filtro-menu label, .rev-filter-menu label,
.orden-menu button, .config-menu button, .config-submenu button {
  background:none; border:none; text-align:left; padding:4px 8px;
  font-family:'Cinzel',serif; font-size:.7rem; color:#fff;
  cursor:pointer; border-radius:30px; transition:all .2s;
  display:flex; align-items:center; width:100%; justify-content:space-between;
}
.filtro-menu input, .rev-filter-menu input { accent-color:var(--accent); width:14px; height:14px; margin-right:6px; flex-shrink:0 }
.filtro-menu .label-text, .rev-filter-menu .label-text { flex-grow:1; margin-right:6px }
.filtro-menu span.count, .rev-filter-menu span.count { color:#b8a87a; font-size:.6rem; flex-shrink:0; margin-left:auto }
.limpiar-categoria {
  background:rgba(100,70,40,.7); border:1px solid var(--border); border-radius:30px;
  padding:2px 8px; font-family:'Cinzel',serif; font-size:.65rem;
  color:var(--text-primary); cursor:pointer; margin-top:4px; text-align:center;
}

/* ── Overlay de cierre de menús ─────────────── */
.menu-overlay { position:fixed; inset:0; background:transparent; z-index:199 }

/* ── Modales flotantes genéricos ────────────── */
.temp-floating-menu {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(25,20,40,.95); backdrop-filter:blur(12px);
  border:1px solid var(--border); border-radius:24px;
  padding:15px 18px; min-width:280px; max-width:90vw;
  z-index:1001; box-shadow:0 15px 35px rgba(0,0,0,.6);
  display:none; flex-direction:column; gap:10px;
}
.temp-floating-menu.show { display:flex }
.temp-floating-menu .temp-header {
  text-align:center; font-family:'Cinzel',serif; color:var(--accent);
  font-weight:600; font-size:.85rem; border-bottom:1px solid var(--border);
  padding-bottom:8px; margin-bottom:4px;
  display:flex; justify-content:space-between; align-items:center;
}
.temp-floating-menu .temp-header button { background:none; border:none; font-size:1rem; color:var(--accent); cursor:pointer; padding:0 4px; margin-left:8px }
.temp-floating-menu input[type=range] { width:100%; accent-color:var(--accent); margin:6px 0 }
.temp-floating-menu .slider-labels { display:flex; justify-content:space-between; font-size:.65rem; color:var(--text-secondary); padding:0 2px; margin-bottom:4px }
.temp-floating-menu .temp-value { text-align:center; font-family:'Cinzel',serif; color:var(--accent); font-size:.9rem; margin:4px 0 }
.temp-floating-menu .temp-actions {
  display:flex; gap:10px; justify-content:center; margin-top:6px;
}
.temp-floating-menu .temp-actions button, .modal-actions button {
  flex:0 0 auto; min-width:44px; width:44px; height:44px;
  background:rgba(100,70,40,.7); border:1px solid var(--border); border-radius:40px;
  font-size:1.3rem; color:var(--text-primary); cursor:pointer; transition:all .2s;
  display:inline-flex; align-items:center; justify-content:center;
  font-family:'Inter',sans-serif; font-weight:500;
}
.temp-floating-menu .temp-actions button:hover:not(:disabled),
.modal-actions button:hover:not(:disabled) { background:var(--accent-hover); color:#1a1625; transform:scale(.96) }
.temp-floating-menu .temp-actions button:active:not(:disabled),
.modal-actions button:active:not(:disabled) { transform:scale(.92) }
.temp-floating-menu .temp-actions button:disabled,
.modal-actions button:disabled { opacity:var(--disabled-op); cursor:not-allowed }

/* Grid de checkboxes en modales */
.modal-checkbox-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:8px; max-height:50vh; overflow-y:auto; padding:4px 8px; margin-bottom:16px;
}
.modal-checkbox-grid label {
  display:flex; align-items:center; gap:8px; font-size:.75rem; cursor:pointer;
  color:var(--text-primary); background:rgba(0,0,0,.2); padding:4px 8px; border-radius:20px;
}
.modal-checkbox-grid label.disabled { opacity:var(--disabled-op); cursor:not-allowed }
.modal-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px }
.modal-actions button { font-size:1.4rem }

/* Modal CSV */
#csvModal.temp-floating-menu { min-width:360px; max-height:80vh; overflow-y:auto }
#csvModal .csv-checkbox-group {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:8px; max-height:40vh; overflow-y:auto; margin-bottom:16px; padding-right:4px;
}
#csvModal .csv-checkbox-group label {
  display:flex; align-items:center; gap:8px; font-size:.75rem; cursor:pointer;
  color:var(--text-primary); background:rgba(0,0,0,.2); padding:4px 8px; border-radius:20px;
}

/* ── Barra superior (búsqueda, conteo, paginación) ── */
.search-wrapper {
  display:inline-flex; align-items:center; gap:4px;
  background:rgba(25,20,40,.85); border-radius:40px; padding:2px 8px;
}
.search-wrapper input {
  background:transparent; border:none; padding:4px 0;
  font-family:'Inter',sans-serif; font-size:.7rem; color:var(--text-primary);
  outline:none; width:140px;
}
.result-count {
  background:rgba(0,0,0,.4); padding:2px 8px; border-radius:40px;
  font-size:.7rem; color:var(--accent); display:inline-flex; align-items:center; gap:4px;
}
.pagination-controls { display:inline-flex; align-items:center; gap:3px; background:rgba(0,0,0,.2); border-radius:40px; padding:2px 5px }
.pagination-controls input {
  width:40px; text-align:center; background:rgba(25,20,40,.7); border:1px solid var(--border);
  border-radius:30px; padding:2px 0; font-family:'Cinzel',serif; font-size:.65rem;
  color:var(--text-primary); outline:none;
}
.pagination-controls input:read-only { opacity:.6; cursor:default }

/* ── Grid de tarjetas ───────────────────────── */
.grid-wrapper { padding:15px 20px 30px }
.grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px; opacity:1; transition:opacity .2s;
}

/* ── Tarjeta ────────────────────────────────── */
.card {
  background:var(--card-bg); border-radius:20px; cursor:pointer;
  border:1px solid var(--border); transition:transform .2s ease, border-color .2s ease, background .2s ease;
  display:flex; flex-direction:column; position:relative; overflow:hidden;
}
/* Gradiente animado de fondo */
.card::before {
  content:""; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(224,188,108,.5),rgba(180,130,200,.5),rgba(100,160,220,.5),rgba(224,188,108,.5));
  background-size:300% 300%; opacity:0; transition:opacity .4s ease; z-index:-1; pointer-events:none;
}
.card:hover::before { opacity:1; animation:gradientShift 4s ease infinite }
@keyframes gradientShift {
  0%,100% { background-position:0% 50% }
  50%      { background-position:100% 50% }
}
/* Barrido cristalino */
.card::after {
  content:""; position:absolute; top:0; left:0; width:200%; height:120%;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.08) 55%,transparent 65%);
  opacity:0; transition:opacity .3s ease; z-index:2; pointer-events:none;
}
.card:hover::after { opacity:1; animation:barridoCristal 1.65s linear infinite }
@keyframes barridoCristal {
  0%   { transform:translateX(-100%) }
  100% { transform:translateX(100%) }
}
.card > * { position:relative; z-index:1 }
.card:hover { transform:translateY(-2px); border-color:var(--accent) }

.img-container { width:100%; height:150px; position:relative; overflow:hidden; border-radius:20px 20px 0 0; background:rgba(0,0,0,.3) }
.img-container img { width:100%; height:100%; object-fit:cover }

.card-footer-row { display:flex; justify-content:space-between; align-items:center; padding:6px 10px 10px; gap:8px; margin-top:auto; position:relative; z-index:2 }
.badges-wrapper { display:flex; flex-wrap:wrap; gap:2px; align-items:center }
.card-actions { display:flex; gap:6px; align-items:center }

.mini-badge {
  width:20px; height:20px; border-radius:30px; background:rgba(0,0,0,.7);
  display:flex; align-items:center; justify-content:center; font-size:10px;
  border:1px solid var(--border); cursor:pointer; transition:transform .1s; padding:0;
}
.mini-badge:active { transform:scale(.96) }

.card b {
  display:block; padding:12px 8px 6px; text-align:center;
  font-family:'Cinzel',serif; font-weight:700; font-size:.9rem;
  background:var(--title-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;
  word-break:break-word; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:font-size .05s linear; flex:1; position:relative; z-index:2;
}
.card b.wrap-name {
  white-space:normal !important; overflow:visible; text-overflow:unset;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  max-height:calc(2 * 1.2em + 12px); line-height:1.2; padding-bottom:6px;
}

/* ── Modal de detalle ───────────────────────── */
#overlay {
  position:fixed; inset:0; background:rgba(8,5,18,.94); backdrop-filter:blur(12px);
  display:none; justify-content:center; align-items:center;
  z-index:1000; opacity:0; transition:opacity .3s ease;
}
#overlay.show { display:flex; opacity:1 }

.modal-container { position:relative; width:90%; max-width:850px; margin:auto }

.modal-arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px); border-radius:12px;
  width:32px; height:110px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background .2s; z-index:1010;
  border:1px solid var(--border); opacity:.85; font-size:24px; color:var(--accent); font-weight:300;
}
.modal-arrow:hover { background:rgba(0,0,0,.8); border-color:var(--accent-hover); opacity:1 }
.modal-arrow:active { transform:translateY(-50%) scale(.96) }
.modal-arrow.disabled { opacity:.3; pointer-events:none }
.modal-arrow.prev { left:-20px }
.modal-arrow.next { right:-20px }

#detalle {
  background:var(--card-bg); border-radius:30px; border:1px solid var(--border);
  max-height:85vh; display:flex; flex-direction:column; overflow:hidden; position:relative;
}
#detalle::before {
  content:''; position:absolute; bottom:0; left:0; width:100%; height:35%;
  background:linear-gradient(to bottom,transparent,rgba(219,186,108,.15));
  pointer-events:none; z-index:1;
}
#detalle > * { position:relative; z-index:2 }

.modal-header { padding:12px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center }
.modal-header h3 {
  margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:calc(100% - 100px); transition:font-size .05s linear;
  font-family:'Cinzel',serif; font-weight:800;
  background:var(--title-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.modal-header h3.wrap-name { white-space:normal !important }
.modal-header-actions { display:flex; gap:10px; align-items:center }
.modal-header-actions button { background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--accent); transition:transform .1s; padding:2px; line-height:1 }
.modal-header-actions button:active { transform:scale(.95) }
#cerrar { font-size:1.5rem; cursor:pointer; color:var(--accent) }

.modal-body { display:flex; gap:20px; padding:16px 20px; overflow-y:auto; flex:1 }
.info-scroll { flex:1; overflow-y:auto; overflow-x:hidden; padding-right:8px; max-height:65vh }
.image-fixed { flex:.6; min-width:120px; text-align:center }
.image-fixed img { max-width:100%; max-height:180px; object-fit:contain; border-radius:20px; border:1px solid var(--border); background:#000 }

.info-grid { background:rgba(0,0,0,.4); border-radius:20px; padding:10px 14px; margin-bottom:12px }
.info-item { display:flex; gap:8px; font-size:.75rem; margin-bottom:4px; flex-wrap:wrap }
.info-label { font-weight:700; color:var(--accent); min-width:90px }
.modal-description { line-height:1.5; font-size:.85rem; color:var(--text-secondary); white-space:pre-wrap; word-break:break-word }
.links-list { margin-top:12px; border-top:1px dashed var(--border); padding-top:8px }
.link-item { display:block; color:var(--accent); font-size:.75rem; margin-bottom:4px; text-decoration:none; word-break:break-word }
.link-item:active { text-decoration:underline }

/* ── Tooltip ────────────────────────────────── */
.temp-tooltip {
  position:fixed; background:rgba(0,0,0,.8); backdrop-filter:blur(4px);
  color:var(--accent); font-family:'Cinzel',serif; font-size:.7rem;
  padding:4px 8px; border-radius:20px; border:1px solid var(--border);
  white-space:nowrap; z-index:10001; pointer-events:none;
  transition:opacity .2s; box-shadow:0 2px 6px rgba(0,0,0,.3);
}

/* ── Sin resultados ─────────────────────────── */
.no-results { text-align:center; padding:30px 20px; font-family:'Cinzel',serif; color:var(--accent); font-size:1rem }
.no-results img { display:block; margin:20px auto 0; max-width:200px; border-radius:16px; border:1px solid var(--border); background:rgba(0,0,0,.3) }

/* ── Responsive ─────────────────────────────── */
@media (max-width:700px) {
  .main-header { padding:4px 8px; padding-right:45px }
  .header-corner { max-width:40px }
  h2 { font-size:1.2rem !important; margin-bottom:3px }
  .filtro-boton, .btn-limpiar, .fav-filter-btn, .pagination-btn, .config-btn { padding:3px 6px !important; font-size:.7rem !important }
  .result-count { font-size:.65rem !important; padding:1px 6px !important }
  .pagination-controls input { width:30px !important; font-size:.6rem !important }
  .search-wrapper input { width:90px !important; font-size:.65rem !important }
  .filtros-panel { gap:4px }
  .modal-arrow { width:28px; height:80px; font-size:20px }
  .modal-arrow.prev { left:-14px }
  .modal-arrow.next { right:-14px }
  .modal-body { flex-direction:column }
  .image-fixed { order:2; margin-top:16px; flex:none }
  .info-scroll { order:1; max-height:50vh }
}
</style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════════ -->
<div class="main-header" id="mainHeader">
  <img id="headerCornerImg" class="header-corner" alt="Ayuda decorativa" aria-label="Abrir ayuda" role="button">
  <div class="container" id="headerContainer">
    <h2 id="mainTitle" aria-label="Título principal">✦ ÍNDICE DE SERES MÍSTICOS ✦</h2>
    <div class="filtros-panel" id="filtrosPanel">
      <!-- Filtros con submenú inline -->
      <div class="filtro-group"><button class="filtro-boton" id="btnMorfologia" title="Morfología" aria-label="Filtrar por morfología">🔮</button><div class="filtro-menu" id="menu-morfologia"></div></div>
      <div class="filtro-group"><button class="filtro-boton" id="btnTipo" title="Tipo de ser" aria-label="Filtrar por tipo">🌙</button><div class="filtro-menu" id="menu-tipo"></div></div>
      <div class="filtro-group"><button class="filtro-boton" id="btnElemento" title="Elemento" aria-label="Filtrar por elemento">💧</button><div class="filtro-menu" id="menu-elemento"></div></div>
      <div class="filtro-group"><button class="filtro-boton" id="btnAvistamiento" title="Avistamiento" aria-label="Filtrar por avistamiento">👁️</button><div class="filtro-menu" id="menu-avistamiento"></div></div>
      <!-- Filtros con modal flotante -->

<script>
/* ══════════════════════════════════════════════════════════
   CONFIGURACIÓN DE CATEGORÍAS
   ══════════════════════════════════════════════════════════ */
const CATEGORIAS = {
  morfologia:   { options:["Humano","Humanoide","Mamífero","Híbrido","Ave","Reptil","Pez","Insecto","Amorfo","Etéreo","Artificial","Otro"],  icons:{"Humano":"🧑","Humanoide":"🧝","Mamífero":"🦌","Híbrido":"🦄","Ave":"🕊️","Reptil":"🐍","Pez":"🐟","Insecto":"🐞","Amorfo":"🌀","Etéreo":"✨","Artificial":"🤖","Otro":"❓"}, btn:"🔮", titulo:"Morfología" },
  tipo:         { options:["Mitológico","Criptido","Difuso"],                                                                                icons:{"Mitológico":"🏛️","Criptido":"🐾","Difuso":"🌫️"},                                                                                                                                                  btn:"🌙", titulo:"Tipo de ser" },
  elemento:     { options:["Aéreo","Acuático","Terrestre","Subterráneo","Anfibio","Misceláneo"],                                              icons:{"Aéreo":"💨","Acuático":"💧","Terrestre":"🌿","Subterráneo":"⛰️","Anfibio":"🐸","Misceláneo":"⚙️"},                                                                                         btn:"💧", titulo:"Elemento" },
  avistamiento: { options:["Grabado / Capturado","Documentado","Crónicas","Avistamiento","Ficción","Tradición oral","Difuso"],                icons:{"Grabado / Capturado":"📹","Documentado":"📜","Crónicas":"📖","Avistamiento":"👁️","Ficción":"📚","Tradición oral":"🗣️","Difuso":"❓"},                                                    btn:"👁️", titulo:"Avistamiento" }
};

const ORDEN_OPCIONES = [
  {v:"nombre_asc",       l:"Alfabético A→Z"},     {v:"nombre_desc",       l:"Alfabético Z→A"},
  {v:"morfologia_asc",   l:"Morfología A→Z"},     {v:"morfologia_desc",   l:"Morfología Z→A"},
  {v:"tipo_asc",         l:"Tipo A→Z"},           {v:"tipo_desc",         l:"Tipo Z→A"},
  {v:"elemento_asc",     l:"Elemento A→Z"},       {v:"elemento_desc",     l:"Elemento Z→A"},
  {v:"avistamiento_asc", l:"Avistamiento A→Z"},   {v:"avistamiento_desc", l:"Avistamiento Z→A"}
];

const CSV_CAMPOS = ["id","nombre","morfologia","tipo","elemento","avistamiento","ubicacion","epoca","subcategorias","descripcion","links"];
const STORAGE_VERSION = 12;

/* ══ Mapa de foco → object-position ══════════════════════
   Cuadrícula 3×3:
     1=superior izquierda  2=superior centro  3=superior derecha
     4=centro izquierda    5=centro           6=centro derecha
     7=inferior izquierda  8=inferior centro  9=inferior derecha
   ══════════════════════════════════════════════════════════ */
const FOCO_POSITION = {
  1: "left top",
  2: "center top",
  3: "right top",
  4: "left center",
  5: "center center",
  6: "right center",
  7: "left bottom",
  8: "center bottom",
  9: "right bottom"
};

function focoToObjectPosition(foco) {
  const n = parseInt(foco, 10);
  return FOCO_POSITION[n] || FOCO_POSITION[5]; // default: centro
}

/* ══ Estado de la app ═════════════════════════════════════ */
let especies = [], dataLoaded = false;
let filtrosState  = { morfologia:[], tipo:[], elemento:[], avistamiento:[], ubicacion:[], epoca:[], subcategorias:[] };
let revFilterState = [], ordenActual = "nombre_asc", perPage = 24, currentPage = 1;
let onlyFavorites = false, searchTerm = '';
let favoritos = new Set(), revisados = new Set();
let modoRevision = "automatico";
let currentOrderedList = [], currentModalCreature = null, currentModalIndex = -1;
let navegacionBloqueada = false;
let selectedCsvFields = [...CSV_CAMPOS.filter(f => f !== 'nombre')];
let touchStartX = 0, panelVisible = true;
// Referencias a modales flotantes reutilizados
let csvMenu = null, ubicacionModal = null, epocaModal = null, subcategoriasModal = null;
let menuOverlay = null;
const HEADER_Z = '100';

/* ══ Referencias DOM ══════════════════════════════════════ */
const $ = id => document.getElementById(id);
const btnMorfologia    = $('btnMorfologia'),  btnTipo          = $('btnTipo');
const btnElemento      = $('btnElemento'),    btnAvistamiento  = $('btnAvistamiento');
const btnUbicacion     = $('btnUbicacion'),   btnEpoca         = $('btnEpoca');
const btnSubcategorias = $('btnSubcategorias'),btnRevFilter    = $('btnRevFilter');
const btnLimpiar       = $('btnLimpiar'),      btnOrden        = $('btnOrden');
const favFilterBtn     = $('favFilterBtn'),   configBtn        = $('configBtn');
const btnResetTotal    = $('btnResetTotal');
const ordenMenu        = $('ordenMenu'),      configMenu       = $('configMenu');
const revFilterMenu    = $('menu-rev');
const overlayEl        = $('overlay'),        mainTitle        = $('mainTitle');
const headerCornerImg  = $('headerCornerImg'),mainHeader       = $('mainHeader');
const gridDiv          = $('grid'),           resultSpan       = $('resultText');
const searchInput      = $('searchInput'),    clearSearchBtn   = $('clearSearch');
const searchDatalist   = $('searchSuggestions');
const paginationControlsDiv = $('paginationControls');

const modalTitle       = $('modal-title'),    modalImg         = $('modal-image');

/* ══ Inicialización de botones de categorías ══════════════ */
(function configurarBotonesCategorias() {
  for (const [cat, cfg] of Object.entries(CATEGORIAS)) {
    const btn = { morfologia:btnMorfologia, tipo:btnTipo, elemento:btnElemento, avistamiento:btnAvistamiento }[cat];
    if (btn) { btn.textContent = cfg.btn; btn.title = cfg.titulo; }

})();

/* ══ Helpers de iconos ════════════════════════════════════ */
const getIcon = (cat, val) => CATEGORIAS[cat]?.icons[val] || '❓';

/* ══ LocalStorage ═════════════════════════════════════════ */
const saveLocal = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const loadLocal = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } };

function persistState() {
  saveLocal('catalogo_filtros',  filtrosState);
  saveLocal('catalogo_orden',    ordenActual);
  saveLocal('catalogo_perpage',  perPage);
  saveLocal('catalogo_onlyFav',  onlyFavorites);
  saveRevFilterState();
}
const loadRevisados     = () => { const s = loadLocal('catalogo_revisados'); if (s) revisados = new Set(s); };
const saveRevisados     = () => saveLocal('catalogo_revisados', [...revisados]);
const loadFavoritos     = () => { const f = loadLocal('catalogo_favoritos'); if (f) { favoritos = new Set(f); actualizarEstadoFavoritosYBoton(); } };
const saveFavoritos     = () => { saveLocal('catalogo_favoritos', [...favoritos]); actualizarEstadoFavoritosYBoton(); };
const loadRevFilterState= () => { revFilterState = loadLocal('catalogo_rev_filter') || []; };
const saveRevFilterState= () => { saveLocal('catalogo_rev_filter', revFilterState); updateRevFilterBadge(); };
const loadModoRevision  = () => { const m = localStorage.getItem('catalogo_modo_revision'); if (m) modoRevision = m; };
const saveModoRevision  = () => localStorage.setItem('catalogo_modo_revision', modoRevision);

function resetAllData() {
  localStorage.clear();
  filtrosState = { morfologia:[], tipo:[], elemento:[], avistamiento:[], ubicacion:[], epoca:[], subcategorias:[] };
  revFilterState = []; revisados.clear(); favoritos.clear();
  onlyFavorites = false; ordenActual = "nombre_asc"; perPage = 24; currentPage = 1; searchTerm = '';
  saveLocal('catalogo_version', STORAGE_VERSION);
  persistState(); saveRevisados(); saveFavoritos();
}
function checkVersion() { const v = loadLocal('catalogo_version'); if (v !== STORAGE_VERSION) { resetAllData(); return false; } return true; }

function validarFiltrosState() {
  if (!especies.length) return;
  const catSimples = ['morfologia','tipo','elemento','avistamiento','ubicacion','epoca'];
  for (const cat of catSimples) {
    const existentes = new Set(especies.map(e => e[cat]).filter(Boolean));
    if (filtrosState[cat]?.length) filtrosState[cat] = filtrosState[cat].filter(v => existentes.has(v));
  }
  const todasSubs = new Set();
  especies.forEach(e => { if (e.subcategorias) e.subcategorias.split(',').forEach(s => { const t = s.trim(); if (t) todasSubs.add(t); }); });
  if (filtrosState.subcategorias?.length) filtrosState.subcategorias = filtrosState.subcategorias.filter(v => todasSubs.has(v));
  persistState();
}

function loadPersistedState() {
  if (!checkVersion()) return;
  const f = loadLocal('catalogo_filtros'); if (f) filtrosState = f;
  ordenActual = loadLocal('catalogo_orden') || "nombre_asc";
  const pp = loadLocal('catalogo_perpage'); if (pp) perPage = +pp;
  const of = loadLocal('catalogo_onlyFav'); onlyFavorites = (of === true || of === 'true');
  loadRevFilterState();
  if (especies.length) validarFiltrosState();
  actualizarTooltipOrden();
  actualizarEstadoFavoritosYBoton();
}

/* ══ Índices e invalidación de caché ══════════════════════ */
let idxMorfologia, idxTipo, idxElemento, idxAvistamiento, idxUbicacion, idxEpoca, idxSubcategorias;

function buildIndexes() {
  idxMorfologia = new Map(); idxTipo = new Map(); idxElemento = new Map();
  idxAvistamiento = new Map(); idxUbicacion = new Map(); idxEpoca = new Map(); idxSubcategorias = new Map();
  for (const e of especies) {
    const id = e.id;
    addToIndex(idxMorfologia,   e.morfologia,   id);
    addToIndex(idxTipo,         e.tipo,         id);
    addToIndex(idxElemento,     e.elemento,     id);
    addToIndex(idxAvistamiento, e.avistamiento, id);
    if (e.ubicacion) addToIndex(idxUbicacion, e.ubicacion, id);
    if (e.epoca)     addToIndex(idxEpoca,     e.epoca,     id);
    if (e.subcategorias) e.subcategorias.split(',').forEach(s => { const t = s.trim(); if (t) addToIndex(idxSubcategorias, t, id); });
  }
}
const addToIndex = (map, key, id) => { if (!map.has(key)) map.set(key, new Set()); map.get(key).add(id); };

let baseFilterVersion = 0, cachedBaseIds = null, cachedBaseVersion = -1, cachedIgnoreCat = null;
let filterCountCache = new Map();
let revCountCache = { revisado:-1, no_revisado:-1 };

function invalidateBaseCache() {
  baseFilterVersion++;
  filterCountCache.clear();
  revCountCache = { revisado:-1, no_revisado:-1 };
}

function getBaseFilteredIds(ignoreCat = null) {
  if (baseFilterVersion === cachedBaseVersion && ignoreCat === cachedIgnoreCat && cachedBaseIds !== null) return cachedBaseIds;
  const pred = buildPredicate(ignoreCat);
  const ids = new Set();
  for (const e of especies) if (pred(e)) ids.add(e.id);
  cachedBaseIds = ids; cachedBaseVersion = baseFilterVersion; cachedIgnoreCat = ignoreCat;
  return ids;
}

/* ══ Predicado de filtro ══════════════════════════════════ */
function buildPredicate(ignoreCat = null) {
  return e => {
    if (ignoreCat !== 'morfologia'    && filtrosState.morfologia.length    && !filtrosState.morfologia.includes(e.morfologia))    return false;
    if (ignoreCat !== 'tipo'          && filtrosState.tipo.length          && !filtrosState.tipo.includes(e.tipo))                return false;
    if (ignoreCat !== 'elemento'      && filtrosState.elemento.length      && !filtrosState.elemento.includes(e.elemento))        return false;
    if (ignoreCat !== 'avistamiento'  && filtrosState.avistamiento.length  && !filtrosState.avistamiento.includes(e.avistamiento))return false;
    if (ignoreCat !== 'ubicacion'     && filtrosState.ubicacion.length     && !filtrosState.ubicacion.includes(e.ubicacion))      return false;
    if (ignoreCat !== 'epoca'         && filtrosState.epoca.length         && !filtrosState.epoca.includes(e.epoca))              return false;
    if (ignoreCat !== 'subcategorias' && filtrosState.subcategorias.length) {
      const subcats = e.subcategorias ? e.subcategorias.split(',').map(s => s.trim()).filter(Boolean) : [];
      if (!filtrosState.subcategorias.some(sel => subcats.includes(sel))) return false;
    }
    if (onlyFavorites && !favoritos.has(e.id)) return false;
    if (searchTerm.trim() && !e.nombre.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    if (revFilterState.length && ignoreCat !== 'revisado') {
      const r = revisados.has(e.id);
      const ambos = revFilterState.includes("revisado") && revFilterState.includes("no_revisado");
      if (!ambos && ((revFilterState.includes("revisado") && !r) || (revFilterState.includes("no_revisado") && r))) return false;
    }
    return true;
  };
}

/* ══ Contadores con caché ═════════════════════════════════ */
function contarConOpcion(categoria, opcion) {
  const key = `${categoria}_${opcion}`;
  if (filterCountCache.has(key)) return filterCountCache.get(key);
  const baseIds = getBaseFilteredIds(categoria);
  if (!baseIds.size) { filterCountCache.set(key, 0); return 0; }
  const idx = { morfologia:idxMorfologia, tipo:idxTipo, elemento:idxElemento, avistamiento:idxAvistamiento, ubicacion:idxUbicacion, epoca:idxEpoca, subcategorias:idxSubcategorias }[categoria];
  const opSet = idx?.get(opcion);
  let count = 0;
  if (opSet?.size) {
    const [small, big] = baseIds.size < opSet.size ? [baseIds, opSet] : [opSet, baseIds];
    for (const id of small) if (big.has(id)) count++;
  }
  filterCountCache.set(key, count);
  return count;
}

function contarPorEstado(estado) {
  if (revCountCache[estado] !== -1) return revCountCache[estado];
  const baseIds = getBaseFilteredIds(null);
  let count = 0;
  for (const id of baseIds) { const r = revisados.has(id); if (estado === "revisado" ? r : !r) count++; }
  revCountCache[estado] = count;
  return count;
}

// Caché de conteo de opciones visibles por categoría
const opcionesConDatosCache = { cache: new Map() };
function getCachedOpcionesConDatos(categoria) {
  if (opcionesConDatosCache.cache.has(categoria)) return opcionesConDatosCache.cache.get(categoria);
  let result;
  if (categoria === 'revisado') {
    result = (contarPorEstado("revisado") > 0 ? 1 : 0) + (contarPorEstado("no_revisado") > 0 ? 1 : 0);
  } else if (['ubicacion','epoca','subcategorias'].includes(categoria)) {
    const valores = obtenerValoresCategoria(categoria);
    result = valores.filter(op => contarConOpcion(categoria, op) > 0).length;
  } else {
    result = CATEGORIAS[categoria]?.options.filter(op => contarConOpcion(categoria, op) > 0).length ?? 0;
  }
  opcionesConDatosCache.cache.set(categoria, result);
  return result;
}

function obtenerValoresCategoria(categoria) {
  if (categoria === 'ubicacion')     return [...new Set(especies.map(e => e.ubicacion).filter(Boolean))].sort();
  if (categoria === 'epoca')         return [...new Set(especies.map(e => e.epoca).filter(Boolean))].sort();
  if (categoria === 'subcategorias') {
    const todas = new Set();
    especies.forEach(e => { if (e.subcategorias) e.subcategorias.split(',').forEach(s => { const t = s.trim(); if (t) todas.add(t); }); });
    return [...todas].sort();
  }
  return CATEGORIAS[categoria]?.options ?? [];
}

/* ══ Filtrado y ordenamiento ══════════════════════════════ */
const aplicarFiltrosCompletos = () => especies.filter(buildPredicate());

function ordenarEspecies(lista) {
  const [campo, dir] = ordenActual.split('_');
  const order = dir === "asc" ? 1 : -1;
  return [...lista].sort((a, b) => {
    const va = a[campo] || '', vb = b[campo] || '';
    return va < vb ? -order : va > vb ? order : 0;
  });
}

function actualizarTooltipOrden() {
  const mapa = Object.fromEntries(ORDEN_OPCIONES.map(o => [o.v, o.l]));
  btnOrden.title = mapa[ordenActual] || "Ordenar";
}

/* ══ Tooltip ══════════════════════════════════════════════ */
let tooltipEl = null, tooltipTimeout = null;

function showTooltip(text, x, y, duration = 1500) {
  if (!tooltipEl) { tooltipEl = document.createElement("div"); tooltipEl.className = "temp-tooltip"; tooltipEl.style.opacity = "0"; document.body.appendChild(tooltipEl); }
  if (tooltipTimeout) clearTimeout(tooltipTimeout);
  tooltipEl.textContent = text; tooltipEl.style.left = x + "px"; tooltipEl.style.top = y + "px"; tooltipEl.style.opacity = "1";
  const r = tooltipEl.getBoundingClientRect();
  let fx = Math.max(10, Math.min(x, window.innerWidth - r.width - 10));
  let fy = Math.max(10, Math.min(y, window.innerHeight - r.height - 10));
  tooltipEl.style.left = fx + "px"; tooltipEl.style.top = fy + "px";
  tooltipTimeout = setTimeout(() => { tooltipEl.style.opacity = "0"; tooltipTimeout = null; }, duration);
}
function hideTooltip() { if (tooltipEl) tooltipEl.style.opacity = "0"; if (tooltipTimeout) { clearTimeout(tooltipTimeout); tooltipTimeout = null; } }
document.addEventListener("click", () => hideTooltip());

function setupBadgeHover(badge, text) {
  badge.addEventListener("mouseenter", () => { const r = badge.getBoundingClientRect(); showTooltip(text, r.left + r.width / 2, r.top - 10, 2000); });
  badge.addEventListener("mouseleave", () => hideTooltip());
}

/* ══ Imagen con fallback y sistema de foco ════════════════ */
const IMG_EXTS = ['jpg','jpeg','png'];

/**
 * setImageWithFallback
 * @param {HTMLImageElement} imgEl  - elemento <img>
 * @param {string}           nombre - nombre de la criatura (base del archivo)
 * @param {string|number}    foco   - valor 1-9; define object-position en miniaturas
 * @param {boolean}          isPriority - si es imagen prioritaria (LCP)
 * @param {boolean}          isModal    - si es la imagen del modal (no aplicar foco)
 */
function setImageWithFallback(imgEl, nombre, foco, isPriority = false, isModal = false) {
  if (isPriority) { imgEl.fetchPriority = "high"; imgEl.loading = "eager"; } else { imgEl.loading = "lazy"; }

  // Aplicar posición de foco solo en miniaturas de la grid (no en el modal)
  if (!isModal) {
    imgEl.style.objectFit      = "cover";
    imgEl.style.objectPosition = focoToObjectPosition(foco);
    imgEl.style.transform      = "";
  }

  const parent = imgEl.parentNode;
  parent?.querySelectorAll('.img-placeholder').forEach(el => el.remove());
  let idx = 0;
  const tryNext = () => {
    if (idx >= IMG_EXTS.length) {
      imgEl.style.display = "none";
      if (!parent?.querySelector(".img-placeholder")) {
        const ph = document.createElement("div");
        ph.className = "img-placeholder";
        ph.style.cssText = "width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--accent);background:rgba(0,0,0,.3);border-radius:16px;";
        ph.textContent = "🖼️"; ph.setAttribute("aria-label","Imagen no disponible");
        parent?.appendChild(ph);
      }
      return;
    }
    imgEl.src = `img/${encodeURIComponent(nombre)}.${IMG_EXTS[idx]}`;
    imgEl.style.display = "block";
    imgEl.onerror = () => { idx++; tryNext(); };
    imgEl.onload  = () => { parent?.querySelector(".img-placeholder")?.remove(); imgEl.style.display = "block"; };
  };
  tryNext();

}

function toggleFavorito(id, uiOnly = false) {
  favoritos.has(id) ? favoritos.delete(id) : favoritos.add(id);
  saveFavoritos();
  if (!uiOnly) {
    if (onlyFavorites) { render(); }
    else {
      const card = document.querySelector(`.card[data-id="${id}"]`);
      card?.querySelector(".fav-star")?.textContent && (card.querySelector(".fav-star").textContent = favoritos.has(id) ? "★" : "☆");
      if (currentModalCreature?.id === id && modalFavBtn) modalFavBtn.textContent = favoritos.has(id) ? "★" : "☆";
    }
  }
  updateFilterBadges(); actualizarEstadoFavoritosYBoton(); invalidateBaseCache();
}

function toggleRevisado(id, esAuto = false) {
  const estaba = revisados.has(id);
  if (modoRevision === "bloqueo") {
    if (!esAuto && estaba && !confirm("¿Estás seguro de marcar como NO revisado?")) return;
    if (!esAuto && !estaba) return;
  }
  estaba ? revisados.delete(id) : revisados.add(id);
  saveRevisados(); actualizarIconoRevisadoTarjeta(id); afterRevisadoToggle();
}

function afterRevisadoToggle() {
  invalidateBaseCache(); actualizarEstadoBotonRevisado();
  const soloRevFilter = revFilterState.length > 0 && revFilterState.length < 2;
  if (soloRevFilter) { render(); }
  else { updateFilterBadges(); regenerarMenus(); updateSearchSuggestions(); actualizarContadorYPaginacion(); adjustTitleFontSize(); actualizarImagenEsquina(); actualizarDisabledOtrosFiltros(); }
}

/* ══ Construcción de menús de categorías ══════════════════ */
function generarMenuCategoria(cat, menuId) {
  const menu = document.getElementById(menuId); menu.innerHTML = "";
  const opciones = CATEGORIAS[cat]?.options ?? [];
  const opcionesVisibles = opciones.filter(v => contarConOpcion(cat, v) > 0);
  const solaUna = opcionesVisibles.length === 1;

  opcionesVisibles.forEach(val => {
    const count = contarConOpcion(cat, val);
    const label = document.createElement("label");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = val; cb.checked = filtrosState[cat].includes(val); cb.disabled = solaUna;
    cb.addEventListener("change", () => {
      if (cb.checked) { if (!filtrosState[cat].includes(val)) filtrosState[cat].push(val); }
      else { filtrosState[cat] = filtrosState[cat].filter(v => v !== val); }
      currentPage = 1; render(); persistState(); invalidateBaseCache();
    });
    const ts = document.createElement("span"); ts.className = "label-text"; ts.textContent = ` ${val}`;
    const cs = document.createElement("span"); cs.className = "count"; cs.textContent = `(${count})`;
    label.append(cb, ts, cs); menu.appendChild(label);
  });

  const bc = document.createElement("button"); bc.textContent = "Limpiar esta categoría"; bc.className = "limpiar-categoria"; bc.disabled = !filtrosState[cat].length;
  bc.addEventListener('click', e => { e.stopPropagation(); limpiarCategoriaORevisados(cat); });
  menu.appendChild(bc);
}

function generarRevFilterMenu() {
  revFilterMenu.innerHTML = "";
  const ops = [{ id:"revisado", label:"Revisado" }, { id:"no_revisado", label:"No revisado" }];
  const visibles = ops.filter(o => contarPorEstado(o.id) > 0);
  const solaUna = visibles.length === 1;

  visibles.forEach(opt => {
    const count = contarPorEstado(opt.id);
    const label = document.createElement("label");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = opt.id; cb.checked = revFilterState.includes(opt.id); cb.disabled = solaUna;
    cb.addEventListener("change", () => {
      cb.checked ? (!revFilterState.includes(opt.id) && revFilterState.push(opt.id)) : (revFilterState = revFilterState.filter(v => v !== opt.id));
      saveRevFilterState(); currentPage = 1; render(); invalidateBaseCache();
    });
    const ts = document.createElement("span"); ts.className = "label-text"; ts.textContent = ` ${opt.label}`;
    const cs = document.createElement("span"); cs.className = "count"; cs.textContent = `(${count})`;
    label.append(cb, ts, cs); revFilterMenu.appendChild(label);
  });

  const bc = document.createElement("button"); bc.textContent = "Limpiar esta categoría"; bc.className = "limpiar-categoria"; bc.disabled = !revFilterState.length;

function aplicarCambioModalFiltro(cat, nuevosValores, totalVisibles) {
  const antesTotal = !filtrosState[cat].length || filtrosState[cat].length === totalVisibles;
  const despuesTotal = !nuevosValores.length || nuevosValores.length === totalVisibles;
  filtrosState[cat] = nuevosValores; currentPage = 1; persistState(); invalidateBaseCache();
  if (antesTotal && despuesTotal) { updateFilterBadges(); regenerarMenus(); updateSearchSuggestions(); actualizarContadorYPaginacion(); adjustTitleFontSize(); actualizarImagenEsquina(); }
  else render();
}

function crearModalFiltro(titulo, cat, valores, counts) {
  closeAllMenus(); closeTempMenus();
  createMenuOverlay(999, () => closeTempMenus());

  const modal = document.createElement('div'); modal.className = 'temp-floating-menu'; modal.id = cat + 'Modal';
  const opcionesConDatos = valores.filter(v => counts.get(v) > 0);
  const totalVisibles = opcionesConDatos.length;

  let html = `<div class="temp-header">${titulo} <button id="${cat}CancelBtn" title="Cerrar">✕</button></div><div class="modal-checkbox-grid" id="${cat}Grid">`;
  opcionesConDatos.forEach(val => {
    html += `<label><input type="checkbox" value="${val.replace(/"/g,'&quot;')}" ${filtrosState[cat].includes(val)?'checked':''} ${totalVisibles===1?'disabled':''}> ${val} <span style="color:#b8a87a;font-size:.6rem">(${counts.get(val)})</span></label>`;
  });
  html += `</div><div class="modal-actions" id="${cat}Actions"></div>`;
  modal.innerHTML = html; document.body.appendChild(modal); modal.classList.add('show');

  if (cat === 'ubicacion')     ubicacionModal    = modal;
  else if (cat === 'epoca')    epocaModal        = modal;
  else if (cat === 'subcategorias') subcategoriasModal = modal;

  const grid = modal.querySelector(`#${cat}Grid`), actionsDiv = modal.querySelector(`#${cat}Actions`);
  const mkBtn = (icon, title) => { const b = document.createElement('button'); b.textContent = icon; b.title = title; b.setAttribute('aria-label', title); return b; };
  const sa = mkBtn('📋','Seleccionar todo'), da = mkBtn('🗑️','Deseleccionar todo'), inv = mkBtn('🔄','Invertir selección');
  actionsDiv.append(sa, da, inv);

  const getChecks    = () => grid.querySelectorAll('input[type="checkbox"]:not([disabled])');
  const getSelected  = () => Array.from(getChecks()).filter(cb => cb.checked).map(cb => cb.value);
  const syncBotones  = () => { const checks = getChecks(); const n = Array.from(checks).filter(cb=>cb.checked).length; sa.disabled = n === checks.length; da.disabled = n === 0; };

  grid.addEventListener('change', () => { aplicarCambioModalFiltro(cat, getSelected(), totalVisibles); syncBotones(); });
  sa.onclick  = () => { getChecks().forEach(cb => cb.checked = true);  aplicarCambioModalFiltro(cat, getSelected(), totalVisibles); syncBotones(); };
  da.onclick  = () => { getChecks().forEach(cb => cb.checked = false); aplicarCambioModalFiltro(cat, [],            totalVisibles); syncBotones(); };
  inv.onclick = () => { const ns = []; getChecks().forEach(cb => { cb.checked = !cb.checked; if (cb.checked) ns.push(cb.value); }); aplicarCambioModalFiltro(cat, ns, totalVisibles); syncBotones(); };
  modal.querySelector(`#${cat}CancelBtn`).onclick = () => closeTempMenus();
  modal.addEventListener('click', e => e.stopPropagation());
  syncBotones();
}

  renderMenuCSV(); document.body.appendChild(csvMenu);

function renderMenuCSV() {
  if (!csvMenu) return;
  const camposVisibles = CSV_CAMPOS.filter(f => f !== 'nombre');
  csvMenu.innerHTML = `<div class="temp-header">📎 Exportar CSV (nombre siempre incluido) <button id="csvCloseBtn" title="Cerrar">✕</button></div><div class="csv-checkbox-group">${camposVisibles.map(f => `<label><input type="checkbox" value="${f}" ${selectedCsvFields.includes(f)?'checked':''}> ${f}</label>`).join('')}</div>`;
  const cg = csvMenu.querySelector(".csv-checkbox-group");
  const actionsDiv = document.createElement("div"); actionsDiv.className = "temp-actions";
  const sa = document.createElement("button"); sa.textContent = "📋"; sa.title = "Seleccionar todo"; sa.setAttribute('aria-label','Seleccionar todo');
  const da = document.createElement("button"); da.textContent = "🗑️"; da.title = "Deseleccionar todo"; da.setAttribute('aria-label','Deseleccionar todo');
  const inv = document.createElement("button"); inv.textContent = "🔄"; inv.title = "Invertir selección"; inv.setAttribute('aria-label','Invertir selección');
  const acceptBtn = document.createElement("button"); acceptBtn.textContent = "✓"; acceptBtn.title = "Exportar"; acceptBtn.disabled = !selectedCsvFields.length;
  actionsDiv.append(sa, da, inv, acceptBtn);
  csvMenu.appendChild(actionsDiv);

  const sync = () => { const n = cg.querySelectorAll("input:checked").length, t = cg.querySelectorAll("input").length; sa.disabled = n === t; da.disabled = n === 0; acceptBtn.disabled = !selectedCsvFields.length; };
  cg.addEventListener("change", () => { selectedCsvFields = [...cg.querySelectorAll("input:checked")].map(c => c.value); sync(); });
  sa.onclick  = () => { selectedCsvFields = [...camposVisibles]; cg.querySelectorAll("input").forEach(c => c.checked = true);  sync(); };
  da.onclick  = () => { selectedCsvFields = [];                  cg.querySelectorAll("input").forEach(c => c.checked = false); sync(); };
  inv.onclick = () => { selectedCsvFields = []; cg.querySelectorAll("input").forEach(c => { if (!c.checked) selectedCsvFields.push(c.value); c.checked = !c.checked; }); sync(); };
  acceptBtn.onclick = () => { exportarCSV(); closeTempMenus(); };
  csvMenu.querySelector('#csvCloseBtn').onclick = () => closeTempMenus();
  sync();
}

function exportarCSV() {
  if (!dataLoaded) return;
  const ordenadas = ordenarEspecies(aplicarFiltrosCompletos()); if (!ordenadas.length) return;
  const headers = ['nombre', ...selectedCsvFields]; if (!headers.length) return;
  const rows = [headers.join(",")];
  ordenadas.forEach(e => {
    rows.push(headers.map(h => {
      let v = h === "links" ? (e.links?.join(";") ?? "") : (e[h] ?? "");
      if (typeof v === "string" && (v.includes(",") || v.includes("\n") || v.includes('"'))) v = `"${v.replace(/"/g,'""')}"`;
      return v;
    }).join(","));
  });
  const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([rows.join("\n")], { type:"text/csv" })); link.download = "indice_seres.csv"; link.click(); URL.revokeObjectURL(link.href);
}

  const s  = document.createElement("span"); s.textContent = `/ ${tp}`;

  if (tp <= 1) { pi.readOnly = true; paginationControlsDiv.append(mkBtn("<<",true), mkBtn("<",true), pi, s, mkBtn(">",true), mkBtn(">>",true)); return; }

  const goTo = v => { if (v < 1) v = 1; if (v > tp) v = tp; if (v !== currentPage) { currentPage = v; render(); window.scrollTo({top:0,behavior:'smooth'}); } pi.value = currentPage; };
  pi.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); goTo(parseInt(pi.value)||currentPage); pi.blur(); } });
  pi.addEventListener("input",   () => { pi.value = pi.value.replace(/[^0-9]/g,''); });
  pi.addEventListener("blur",    () => goTo(parseInt(pi.value)||currentPage));

  const bf = mkBtn("<<", currentPage===1),  bp = mkBtn("<", currentPage===1);
  const bn = mkBtn(">",  currentPage===tp), bl = mkBtn(">>", currentPage===tp);
  if (tp === 2) { bf.disabled = true; bl.disabled = true; }
  bf.onclick = () => { if (!bf.disabled) goTo(1); };
  bp.onclick = () => { if (!bp.disabled) goTo(currentPage - 1); };
  bn.onclick = () => { if (!bn.disabled) goTo(currentPage + 1); };
  bl.onclick = () => { if (!bl.disabled) goTo(tp); };
  paginationControlsDiv.append(bf, bp, pi, s, bn, bl);
}

/* ══ Búsqueda ═════════════════════════════════════════════ */
function levenshteinDistance(a, b) {
  if (!a.length) return b.length; if (!b.length) return a.length;
  const m = Array.from({length: b.length+1}, (_,i) => [i, ...Array(a.length).fill(0)]);
  for (let j = 0; j <= a.length; j++) m[0][j] = j;
  for (let i = 1; i <= b.length; i++) for (let j = 1; j <= a.length; j++) m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1]+(a[j-1]===b[i-1]?0:1));
  return m[b.length][a.length];
}

function updateSearchSuggestions() {
  const term = searchInput.value.trim().toLowerCase();
  const cand = aplicarFiltrosCompletos();
  let sug;
  if (!term) {
    sug = ordenarEspecies(cand).slice(0, 6).map(e => e.nombre);
  } else {
    const comienzan = cand.filter(e => e.nombre.toLowerCase().startsWith(term));
    if (comienzan.length >= 6) {
      sug = comienzan.slice(0, 6).map(e => e.nombre);
    } else {
      const resto = cand.filter(e => !e.nombre.toLowerCase().startsWith(term)).map(e => ({ nombre:e.nombre, dist:levenshteinDistance(term, e.nombre.toLowerCase()) })).sort((a,b) => a.dist - b.dist);
      sug = [...comienzan.map(e => e.nombre), ...resto.slice(0, 6 - comienzan.length).map(x => x.nombre)];
    }
  }
  searchDatalist.innerHTML = sug.map(s => `<option value="${s}">`).join('');
}
function updateClearSearchState() { clearSearchBtn.classList.toggle("disabled", !searchInput.value.trim()); }

let searchTimeout;
function onSearchInput() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { searchTerm = searchInput.value; currentPage = 1; render(); updateClearSearchState(); updateSearchSuggestions(); invalidateBaseCache(); }, 300);
}

/* ══ Badges y estado de filtros ══════════════════════════ */
function updateFilterBadges() {
  const { morfologia:mc, tipo:tc, elemento:ec, avistamiento:ac, ubicacion:uc, epoca:epc, subcategorias:sc } = Object.fromEntries(Object.entries(filtrosState).map(([k,v])=>[k,v.length]));
  btnMorfologia.title    = `Morfología${mc ? ` (${mc})`:''}`;    actualizarFiltroActivo(btnMorfologia,    mc > 0);
  btnTipo.title          = `Tipo${tc ? ` (${tc})`:''}`;          actualizarFiltroActivo(btnTipo,          tc > 0);
  btnElemento.title      = `Elemento${ec ? ` (${ec})`:''}`;      actualizarFiltroActivo(btnElemento,      ec > 0);
  btnAvistamiento.title  = `Avistamiento${ac ? ` (${ac})`:''}`;  actualizarFiltroActivo(btnAvistamiento,  ac > 0);
  btnUbicacion.title     = `Ubicación${uc ? ` (${uc})`:''}`;     actualizarFiltroActivo(btnUbicacion,     uc > 0);
  btnEpoca.title         = `Época${epc ? ` (${epc})`:''}`;       actualizarFiltroActivo(btnEpoca,         epc > 0);
  btnSubcategorias.title = `Subcategorías${sc ? ` (${sc})`:''}`;  actualizarFiltroActivo(btnSubcategorias, sc > 0);
  favFilterBtn.classList.toggle('active', onlyFavorites);
  updateRevFilterBadge(); actualizarBotonLimpiar();
}
const actualizarFiltroActivo = (btn, activo) => btn.classList.toggle('active-filter', activo);
function actualizarBotonLimpiar() {
  btnLimpiar.disabled = currentOrderedList.length === 0 || !Object.values(filtrosState).some(a => a.length) && !revFilterState.length;
}
function updateRevFilterBadge() {
  const n = revFilterState.length;
  btnRevFilter.title = n === 0 ? "Filtrar por revisado" : n === 1 ? `Filtrar: ${revFilterState[0]==="revisado"?"Revisado":"No revisado"}` : "Filtrar: revisado y no revisado";
  actualizarFiltroActivo(btnRevFilter, n > 0);
}

/* ══ Limpiar filtros ══════════════════════════════════════ */
function limpiarCategoriaORevisados(cat) {
  if (cat === 'revisado') { revFilterState = []; saveRevFilterState(); }
  else { filtrosState[cat] = []; }
  currentPage = 1; persistState(); invalidateBaseCache();
  render();
}

function limpiarTodosFiltros() {
  if (btnLimpiar.disabled) return;
  filtrosState = { morfologia:[], tipo:[], elemento:[], avistamiento:[], ubicacion:[], epoca:[], subcategorias:[] };

}

/* ══ Modal de detalle ═════════════════════════════════════ */
function actualizarModal() {
  if (!currentModalCreature) return;
  const e = currentModalCreature;
  modalTitle.innerText = e.nombre; adjustModalTitleFontSize();
  // En el modal usamos object-fit:contain (ver CSS), sin foco
  setImageWithFallback(modalImg, e.nombre, e.foco, true, true);

  const linksHtml = e.links?.length ? `<div class="links-list">${e.links.map(u => `<a href="${u}" target="_blank" class="link-item" onclick="marcarRevisadoPorLink('${e.id}')">${u}</a>`).join('')}</div>` : "";
  const subcatsHtml = e.subcategorias ? `<div class="info-item"><span class="info-label">Subcategorías:</span> ${e.subcategorias}</div>` : '';
  modalInfoScroll.innerHTML = `<div class="info-grid">
    <div class="info-item"><span class="info-label">Morfología:</span> ${e.morfologia}</div>
    <div class="info-item"><span class="info-label">Tipo:</span> ${e.tipo}</div>
    <div class="info-item"><span class="info-label">Elemento:</span> ${e.elemento}</div>
    <div class="info-item"><span class="info-label">Avistamiento:</span> ${e.avistamiento}</div>
    <div class="info-item"><span class="info-label">Ubicación:</span> ${e.ubicacion||"?"}</div>
    <div class="info-item"><span class="info-label">Época:</span> ${e.epoca||"?"}</div>
    ${subcatsHtml}
  </div><div class="modal-description">${e.descripcion}</div>${linksHtml}`;

  const est = revisados.has(e.id);
  modalRevisadoBtn.innerHTML = est ? "◆" : "◇";
  modalRevisadoBtn.className = `revisado-icon ${est ? 'revisado' : 'no_revisado'}`;
  modalRevisadoBtn.style.color = "var(--accent)";
  modalRevisadoBtn.onclick = () => toggleRevisado(e.id, false);
  if (modalFavBtn) modalFavBtn.textContent = favoritos.has(e.id) ? "★" : "☆";
  modalPrevArrow.style.display = modalNextArrow.style.display = navegacionBloqueada ? "none" : "flex";
  actualizarFlechasModal();
  requestAnimationFrame(adjustModalTitleFontSize);
}

function abrirDetalle(e) {
  currentModalCreature = e; currentModalIndex = currentOrderedList.findIndex(c => c.id === e.id);
  actualizarModal(); actualizarFlechasModal(); overlayEl.style.display = "flex"; document.body.classList.add("modal-open");
  setTimeout(() => { overlayEl.classList.add("show"); adjustModalTitleFontSize(); }, 10);
}

function actualizarFlechasModal() {
  if (!currentOrderedList.length || navegacionBloqueada) return;
  modalPrevArrow.classList.toggle("disabled", currentModalIndex === 0);
  modalNextArrow.classList.toggle("disabled", currentModalIndex === currentOrderedList.length - 1);
}

function navegarModal(d) {
  if (navegacionBloqueada || !currentOrderedList.length) return;
  const ni = Math.max(0, Math.min(currentOrderedList.length - 1, currentModalIndex + d));
  if (ni !== currentModalIndex) { currentModalIndex = ni; currentModalCreature = currentOrderedList[ni]; actualizarModal(); actualizarFlechasModal(); }
}

async function closeModal() {
  const eraAleatorio = navegacionBloqueada; navegacionBloqueada = false;
  if (!eraAleatorio && currentModalCreature) {
    const idx = currentOrderedList.findIndex(c => c.id === currentModalCreature.id);
    if (idx !== -1) {
      const newPage = Math.floor(idx / perPage) + 1;
      if (newPage !== currentPage) { currentPage = newPage; await render(); }
      requestAnimationFrame(() => { document.querySelector(`.card[data-id="${currentModalCreature.id}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' }); });
    }
  }
  overlayEl.classList.remove("show"); document.body.classList.remove("modal-open");
  setTimeout(() => { if (!overlayEl.classList.contains("show")) overlayEl.style.display = "none"; }, 300);
}

/* ══ Render principal ═════════════════════════════════════ */
async function render() {
  if (!dataLoaded) return;
  gridDiv.classList.add("fade-out"); await new Promise(r => setTimeout(r, 30));
  invalidateBaseCache(); opcionesConDatosCache.cache.clear();
  const filtradas = aplicarFiltrosCompletos(), ordenadas = ordenarEspecies(filtradas);
  currentOrderedList = ordenadas;
  const total = ordenadas.length;
  const favEnResultados = onlyFavorites ? total : ordenadas.filter(e => favoritos.has(e.id)).length;

  // Auto-corrección de estados inválidos
  let reRender = false;
  if (onlyFavorites && favEnResultados === 0) { onlyFavorites = false; reRender = true; }
  for (const estado of ["revisado","no_revisado"]) {
    if (revFilterState.includes(estado) && !revFilterState.includes(estado === "revisado" ? "no_revisado" : "revisado") && contarPorEstado(estado) === 0) {
      revFilterState = revFilterState.filter(v => v !== estado); saveRevFilterState(); reRender = true;
    }
  }
  if (reRender) { persistState(); render(); return; }

  const tp = Math.max(1, Math.ceil(total / perPage)); if (currentPage > tp) currentPage = tp;
  const start = (currentPage - 1) * perPage, paginated = ordenadas.slice(start, start + perPage), end = Math.min(start + perPage, total);
  resultSpan.innerText = `${start+1}-${end} / ${total}`;
  gridDiv.className = 'grid'; gridDiv.innerHTML = "";

  // Estado de botones
  const sinResultados = total === 0;
  document.querySelectorAll('.filtro-boton').forEach(b => { b.disabled = sinResultados; });
  if (!sinResultados) {
    btnOrden.disabled = total === 1;
    favFilterBtn.disabled = favoritos.size === 0 || favEnResultados === 0;
    btnLimpiar.disabled = !Object.values(filtrosState).some(a => a.length) && !revFilterState.length;
    actualizarDisabledOtrosFiltros();
  } else {
    btnOrden.disabled = true; favFilterBtn.disabled = true; btnLimpiar.disabled = true; configBtn.disabled = true;
  }

  if (!paginated.length) {
    const nd = document.createElement("div"); nd.className = "no-results";
    nd.innerHTML = `<div>🜁 ${especies.length === 0 ? 'No se pudieron cargar los datos desde dtsk/Datos*.json.' : 'No se encontraron criaturas con esos filtros.'}</div><img src="img2/non.jpeg" alt="Sin resultados" loading="lazy">`;
    gridDiv.appendChild(nd);
  } else {
    const frag = document.createDocumentFragment();
    paginated.forEach((e, i) => frag.appendChild(crearCardGrid(e, i)));
    gridDiv.appendChild(frag);
  }

  actualizarPaginacionHeader(tp);
  gridDiv.classList.remove("fade-out");
  updateFilterBadges(); regenerarMenus(); updateSearchSuggestions(); adjustTitleFontSize(); actualizarImagenEsquina();
}

function actualizarContadorYPaginacion() {
  const total = currentOrderedList.length, tp = Math.max(1, Math.ceil(total / perPage));
  if (currentPage > tp) currentPage = tp;
  const start = (currentPage - 1) * perPage, end = Math.min(start + perPage, total);
  resultSpan.innerText = `${start+1}-${end} / ${total}`;
  actualizarPaginacionHeader(tp);
}

/* ══ Ajuste de fuente ═════════════════════════════════════ */
function adjustTitleFontSize() {
  const ruler = document.createElement('span');
  ruler.style.cssText = 'position:fixed;visibility:hidden;white-space:nowrap;font-family:Cinzel,serif;font-weight:700;padding:0 8px;pointer-events:none';
  document.body.appendChild(ruler);
  document.querySelectorAll('.card b').forEach(t => {
    const avail = t.clientWidth; if (!avail) return;
    ruler.textContent = t.textContent; let fs = 0.9;
    ruler.style.fontSize = fs + 'rem';
    while (fs > 0.7 && ruler.offsetWidth > avail) { fs -= 0.005; ruler.style.fontSize = fs + 'rem'; }
    if (ruler.offsetWidth > avail) { t.classList.add('wrap-name'); t.style.fontSize = '0.7rem'; }
    else { t.classList.remove('wrap-name'); t.style.fontSize = fs + 'rem'; }
  });
  ruler.remove();
}

function adjustModalTitleFontSize() {
  const h3 = modalTitle; if (!h3) return;
  const avail = h3.clientWidth; if (!avail) return;
  const test = document.createElement('span'); test.style.cssText = `position:fixed;visibility:hidden;white-space:nowrap;font-family:"Cinzel",serif;font-weight:800;width:${avail}px;display:inline-block;pointer-events:none`;
  test.textContent = h3.textContent; document.body.appendChild(test);
  let fs = 1.4;
  test.style.fontSize = fs + 'rem';
  while (fs > 0.8 && test.scrollWidth > test.clientWidth) { fs -= 0.05; test.style.fontSize = fs + 'rem'; }
  if (test.scrollWidth > test.clientWidth) { h3.classList.add('wrap-name'); h3.style.fontSize = '0.8rem'; }
  else { h3.classList.remove('wrap-name'); h3.style.fontSize = fs + 'rem'; }
  test.remove();
}

/* ══ Imagen de esquina ════════════════════════════════════ */
function actualizarImagenEsquina() {
  const src = window.innerWidth <= 700 ? 'img2/esquina.png' : 'img2/esquina.gif';
  if (headerCornerImg.getAttribute('src') !== src) headerCornerImg.src = src;
  headerCornerImg.onerror  = () => headerCornerImg.style.display = 'none';
  headerCornerImg.onload   = () => headerCornerImg.style.display = 'block';
}

/* ══ Debounce ═════════════════════════════════════════════ */
const debounce = (fn, ms) => { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; };
const debouncedAdjustTitle  = debounce(adjustTitleFontSize, 100);
const debouncedImagenEsquina= debounce(actualizarImagenEsquina, 100);

/* ══ Reposicionamiento de menús ═══════════════════════════ */
function repositionMenu(menu, button) {
  if (!menu || !button) return;
  const r = button.getBoundingClientRect(), mr = menu.getBoundingClientRect();
  menu.style.top    = mr.height > window.innerHeight - r.bottom && r.top > mr.height ? 'auto' : '110%';
  menu.style.bottom = menu.style.top === 'auto' ? '110%' : 'auto';
  menu.style.left   = r.left + mr.width > window.innerWidth ? 'auto' : '0';
  menu.style.right  = menu.style.left === 'auto' ? '0' : 'auto';
}

/* ══ Init de menús (event listeners) ═════════════════════ */
function initMenus() {
  document.querySelectorAll(".filtro-group").forEach(g => {
    const b = g.querySelector(".filtro-boton,.config-btn");
    const m = g.querySelector(".filtro-menu,.config-menu,.orden-menu,.rev-filter-menu");
    const skipIds = ['btnUbicacion','btnEpoca','btnSubcategorias'];
    if (b && m && !skipIds.includes(b.id)) {
      b.addEventListener("click", e => {
        e.stopPropagation();
        const wasOpen = m.classList.contains("show"); closeAllMenus();
        if (!wasOpen) { m.classList.add("show"); createMenuOverlay(199, closeAllMenus); setTimeout(() => repositionMenu(m, b), 10); }
      });
    }
  });
  btnUbicacion.addEventListener("click",     e => { e.stopPropagation(); abrirModalUbicacion(); });
  btnEpoca.addEventListener("click",         e => { e.stopPropagation(); abrirModalEpoca(); });
  btnSubcategorias.addEventListener("click", e => { e.stopPropagation(); abrirModalSubcategorias(); });
  document.addEventListener("click", e => {
    if (!e.target.closest(".filtro-group") && !e.target.closest(".temp-floating-menu")) { closeAllMenus(); closeTempMenus(); }
  });
}
initMenus();

/* ══ Event listeners globales ═════════════════════════════ */
mainTitle.addEventListener("click", () => {
  panelVisible = !panelVisible;
  document.getElementById('filtrosPanel').classList.toggle("oculto", !panelVisible);
  actualizarImagenEsquina();
});

btnLimpiar.onclick    = limpiarTodosFiltros;

searchInput.addEventListener('input', onSearchInput);
clearSearchBtn.onclick= () => { if (clearSearchBtn.classList.contains("disabled")) return; searchInput.value = ''; searchTerm = ''; currentPage = 1; render(); updateClearSearchState(); updateSearchSuggestions(); invalidateBaseCache(); };
cerrarBtn.onclick     = closeModal;
overlayEl.onclick     = e => { if (e.target === overlayEl) closeModal(); };
modalPrevArrow.onclick= () => navegarModal(-1);
modalNextArrow.onclick= () => navegarModal(1);
modalFavBtn.onclick   = () => { if (currentModalCreature) toggleFavorito(currentModalCreature.id); };

if (btnResetTotal) {
  btnResetTotal.addEventListener('click', () => {
    const hayAlgo = Object.values(filtrosState).some(a => a.length) || revFilterState.length || onlyFavorites || searchTerm;
    if (!hayAlgo) return;
    filtrosState = { morfologia:[], tipo:[], elemento:[], avistamiento:[], ubicacion:[], epoca:[], subcategorias:[] };
    revFilterState = []; saveRevFilterState(); onlyFavorites = false; searchInput.value = ''; searchTerm = '';
    updateClearSearchState(); currentPage = 1; render(); persistState(); invalidateBaseCache();
  });
}

document.addEventListener("keydown", e => {
  if (!overlayEl.classList.contains("show")) return;
  if (e.key === "Escape") { closeModal(); return; }
  if (navegacionBloqueada) return;
  const acciones = { ArrowLeft:()=>navegarModal(-1), ArrowRight:()=>navegarModal(1), f:()=>currentModalCreature&&toggleFavorito(currentModalCreature.id), F:()=>currentModalCreature&&toggleFavorito(currentModalCreature.id), r:()=>currentModalCreature&&toggleRevisado(currentModalCreature.id), R:()=>currentModalCreature&&toggleRevisado(currentModalCreature.id),
    l:()=>{if(currentModalCreature?.links?.length){window.open(currentModalCreature.links[0],'_blank');marcarRevisadoPorLink(currentModalCreature.id);}},
    L:()=>{if(currentModalCreature?.links?.length){window.open(currentModalCreature.links[0],'_blank');marcarRevisadoPorLink(currentModalCreature.id);}}
  };
  if (acciones[e.key]) { e.preventDefault(); acciones[e.key](); }
});

document.getElementById('detalle').addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; });
document.getElementById('detalle').addEventListener("touchend",   e => {
  if (navegacionBloqueada) return;
  const d = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(d) > 50) { navegarModal(d > 0 ? -1 : 1); e.preventDefault(); }
});

/* ══ Carga de datos ═══════════════════════════════════════ */
async function cargarArchivosDesdeCarpeta() {
  const datos = []; let i = 1;
  while (true) {
    try {
      const r = await fetch(`dtsk/Datos${i}.json?t=${Date.now()}`, { cache:'no-store' });
      if (!r.ok) break;
      const d = await r.json();
      datos.push(...(Array.isArray(d) ? d : [d]));
      i++;
    } catch { break; }
  }
  return datos;
}

async function cargarDatos() {
  try {
    const raw = await cargarArchivosDesdeCarpeta();
    if (!raw.length) throw new Error('No se pudieron cargar datos desde dtsk/Datos*.json');

    especies = raw.map((c, idx) => ({
      id:           c.id            || `criatura_${idx}_${Date.now()}_${Math.random()}`,
      nombre:       c.nombre        || 'Sin nombre',
      morfologia:   c.morfologia    || 'Desconocido',
      tipo:         c.tipo          || 'Desconocido',
      elemento:     c.elemento      || 'Desconocido',
      avistamiento: c.avistamiento  || 'Desconocido',
      ubicacion:    c.ubicacion     || '',
      epoca:        c.epoca         || '',
      subcategorias:c.subcategorias || '',
      descripcion:  c.descripcion   || '',
      links:        c.links         || [],
      foco:         c.foco          ?? 5   // 1-9, default 5 (centro)
    }));

    dataLoaded = true;
    buildIndexes(); loadFavoritos(); loadRevisados(); loadModoRevision(); loadPersistedState();
    updateSearchSuggestions(); updateClearSearchState(); regenerarMenus(); await render();

    window.addEventListener('resize', () => { if (!dataLoaded) return; debouncedAdjustTitle(); if (overlayEl.classList.contains("show")) adjustModalTitleFontSize(); debouncedImagenEsquina(); });
    actualizarImagenEsquina();

    const hash = window.location.hash.substring(1);
    if (hash.startsWith("id=")) {
      const id = decodeURIComponent(hash.substring(3));
      const cr = especies.find(e => e.id === id);
      if (cr) setTimeout(() => abrirDetalle(cr), 300);
    }
    window.scrollTo({ top:0, behavior:'instant' });
  } catch (err) {
    console.error("Error cargando datos:", err);
    dataLoaded = true; render();
  }
}

cargarDatos();
