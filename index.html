function invalidateBaseCache(){}
async function render(){if(!dataLoaded)return; let filtradas=aplicarFiltrosCompletos(),ordenadas=ordenarEspecies(filtradas); currentOrderedList=ordenadas; let total=ordenadas.length, tp=Math.max(1,Math.ceil(total/perPage)); if(currentPage>tp)currentPage=tp; let start=(currentPage-1)*perPage, paginadas=ordenadas.slice(start,start+perPage), end=Math.min(start+perPage,total); resultSpan.innerText=`${start+1}-${end} / ${total}`; gridDiv.innerHTML=""; if(paginadas.length===0){gridDiv.innerHTML='<div class="no-results">🜁 No se encontraron criaturas.</div>';} else{paginadas.forEach(e=>{let card=document.createElement('div');card.className='card';card.setAttribute('data-id',e.id); let imgDiv=document.createElement('div');imgDiv.className='img-container';let img=document.createElement('img');img.src=`img/${encodeURIComponent(e.nombre)}.jpg`; img.onerror=function(){this.src='img2/noimg2.png';}; imgDiv.appendChild(img); let b=document.createElement('b');b.textContent=e.nombre; let footer=document.createElement('div');footer.className='card-footer-row'; let bw=document.createElement('div');bw.className='badges-wrapper'; let badges=[{ico:iconMap.morfologia[e.morfologia]||'🔮',tit:`Morfología: ${e.morfologia}`},{ico:iconMap.tipo[e.tipo]||'🌙',tit:`Tipo: ${e.tipo}`},{ico:iconMap.elemento[e.elemento]||'💧',tit:`Elemento: ${e.elemento}`},{ico:iconMap.avistamiento[e.avistamiento]||'👁️',tit:`Avistamiento: ${e.avistamiento}`}]; badges.forEach(bd=>{let d=document.createElement('div');d.className='mini-badge';d.textContent=bd.ico;d.title=bd.tit;bw.appendChild(d);}); let actions=document.createElement('div');actions.className='card-actions'; let fav=document.createElement('button');fav.className='fav-star';fav.textContent=favoritos.has(e.id)?'★':'☆';fav.onclick=(ev)=>{ev.stopPropagation(); if(favoritos.has(e.id))favoritos.delete(e.id); else favoritos.add(e.id); saveFavoritos(); fav.textContent=favoritos.has(e.id)?'★':'☆'; if(onlyFavorites)render();}; let rev=document.createElement('span');rev.className='revisado-icon';rev.innerHTML=revisados.has(e.id)?'◆':'◇';rev.title=revisados.has(e.id)?'Revisado':'No revisado'; rev.onclick=(ev)=>{ev.stopPropagation(); toggleRevisado(e.id);}; actions.append(fav,rev); footer.append(bw,actions); card.append(imgDiv,b,footer); card.onclick=()=>abrirDetalle(e); gridDiv.appendChild(card);});} actualizarPaginacionHeader(tp); updateFilterBadges(); regenerarMenus();}
function actualizarPaginacionHeader(tp){let pc=$("paginationControls"); pc.innerHTML=""; if(tp<=1)return; let input=document.createElement('input');input.type='text';input.value=currentPage; input.onchange=()=>{let v=parseInt(input.value); if(v>=1&&v<=tp){currentPage=v;render();}else input.value=currentPage;}; let span=document.createElement('span');span.textContent=` / ${tp}`; let prev=document.createElement('button');prev.textContent='<';prev.disabled=currentPage===1;prev.onclick=()=>{if(currentPage>1){currentPage--;render();}}; let next=document.createElement('button');next.textContent='>';next.disabled=currentPage===tp;next.onclick=()=>{if(currentPage<tp){currentPage++;render();}}; pc.append(prev,input,span,next);}
function updateFilterBadges(){let m=filtrosState.morfologia.length,t=filtrosState.tipo.length,el=filtrosState.elemento.length,a=filtrosState.avistamiento.length,u=filtrosState.ubicacion.length,ep=filtrosState.epoca.length,s=filtrosState.subcategorias.length; $('btnMorfologia').classList.toggle('active-filter',m>0); $('btnTipo').classList.toggle('active-filter',t>0); $('btnElemento').classList.toggle('active-filter',el>0); $('btnAvistamiento').classList.toggle('active-filter',a>0); $('btnUbicacion').classList.toggle('active-filter',u>0); $('btnEpoca').classList.toggle('active-filter',ep>0); $('btnSubcategorias').classList.toggle('active-filter',s>0); favFilterBtn.classList.toggle('active',onlyFavorites); updateRevFilterBadge();}
function regenerarMenus(){ generarMenuCategoria('morfologia','menu-morfologia',opcionesMorfologia); generarMenuCategoria('tipo','menu-tipo',opcionesTipo); generarMenuCategoria('elemento','menu-elemento',opcionesElemento); generarMenuCategoria('avistamiento','menu-avistamiento',opcionesAvistamiento); generarMenuOrden(); generarMenuConfig(); regenerarRevFilterMenu();}
function generarMenuCategoria(cat,menuId,opts){let menu=$(menuId); menu.innerHTML=""; opts.forEach(val=>{let count=contarConOpcion(cat,val); if(count===0)return; let label=document.createElement('label'); let cb=document.createElement('input');cb.type='checkbox';cb.checked=filtrosState[cat].includes(val); cb.onchange=()=>{if(cb.checked){if(!filtrosState[cat].includes(val))filtrosState[cat].push(val);}else{filtrosState[cat]=filtrosState[cat].filter(v=>v!==val);} currentPage=1; render(); persistState();}; label.appendChild(cb); label.appendChild(document.createTextNode(` ${val} (${count})`)); menu.appendChild(label);}); let limpiar=document.createElement('button');limpiar.textContent='Limpiar esta categoría';limpiar.className='limpiar-categoria';limpiar.disabled=filtrosState[cat].length===0; limpiar.onclick=()=>{filtrosState[cat]=[]; render(); persistState();}; menu.appendChild(limpiar);}
function generarMenuOrden(){ let ops=[{v:'nombre_asc',l:'Alfabético A→Z'},{v:'nombre_desc',l:'Alfabético Z→A'},{v:'morfologia_asc',l:'Morfología A→Z'},{v:'morfologia_desc',l:'Morfología Z→A'}]; ordenMenu.innerHTML=ops.map(o=>`<button ${ordenActual===o.v?'disabled':''}>${o.l}</button>`).join(''); Array.from(ordenMenu.children).forEach((btn,i)=>{btn.onclick=()=>{if(btn.disabled)return; ordenActual=ops[i].v; currentPage=1; render(); persistState(); closeAllMenus();};});}
function generarMenuConfig(){ configMenu.innerHTML='<button>🎲 Azar</button><button>📎 Exportar CSV</button>'; configMenu.children[0].onclick=()=>{let f=aplicarFiltrosCompletos(); if(f.length){navegacionBloqueada=true; abrirDetalle(f[Math.floor(Math.random()*f.length)]);} closeAllMenus();}; configMenu.children[1].onclick=()=>exportarCSV();}
function regenerarRevFilterMenu(){revFilterMenu.innerHTML=""; let ops=['revisado','no_revisado']; ops.forEach(opt=>{let count=contarPorEstado(opt); if(count===0)return; let label=document.createElement('label'); let cb=document.createElement('input');cb.type='checkbox';cb.checked=revFilterState.includes(opt); cb.onchange=()=>{let newRev=[...revFilterState]; if(cb.checked){if(!newRev.includes(opt))newRev.push(opt);}else{newRev=newRev.filter(v=>v!==opt);} revFilterState=newRev; saveLocal('catalogo_rev_filter',revFilterState); currentPage=1; render(); persistState();}; label.appendChild(cb); label.appendChild(document.createTextNode(` ${opt==='revisado'?'Revisado':'No revisado'} (${count})`)); revFilterMenu.appendChild(label);}); let limpiar=document.createElement('button');limpiar.textContent='Limpiar esta categoría';limpiar.className='limpiar-categoria';limpiar.disabled=revFilterState.length===0; limpiar.onclick=()=>{revFilterState=[]; saveLocal('catalogo_rev_filter',revFilterState); render(); persistState();}; revFilterMenu.appendChild(limpiar);}
function exportarCSV(){let filtradas=aplicarFiltrosCompletos(); if(!filtradas.length)return; let ordenadas=ordenarEspecies(filtradas); let rows=[['nombre','morfologia','tipo','elemento','avistamiento','ubicacion','epoca','subcategorias','descripcion']]; ordenadas.forEach(e=>rows.push([e.nombre,e.morfologia,e.tipo,e.elemento,e.avistamiento,e.ubicacion||'',e.epoca||'',e.subcategorias||'',e.descripcion||''])); let csv=rows.map(row=>row.map(cell=>typeof cell==='string'&&cell.includes(',')?`"${cell}"`:cell).join(',')).join('\n'); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='indice_seres.csv';a.click();URL.revokeObjectURL(a.href);}
function abrirDetalle(e){currentModalCreature=e; currentModalIndex=currentOrderedList.findIndex(c=>c.id===e.id); actualizarModal(); overlayEl.classList.add('show'); document.body.classList.add('modal-open');}
function actualizarModal(){let e=currentModalCreature; modalTitle.textContent=e.nombre; modalImg.src=`img/${encodeURIComponent(e.nombre)}.jpg`; modalImg.onerror=function(){this.src='img2/noimg2.png';}; let html=`<div class="info-grid"><div class="info-item"><span class="info-label">Morfología:</span> ${e.morfologia}</div><div class="info-item"><span class="info-label">Tipo:</span> ${e.tipo}</div><div class="info-item"><span class="info-label">Elemento:</span> ${e.elemento}</div><div class="info-item"><span class="info-label">Avistamiento:</span> ${e.avistamiento}</div><div class="info-item"><span class="info-label">Ubicación:</span> ${e.ubicacion||'?'}</div><div class="info-item"><span class="info-label">Época:</span> ${e.epoca||'?'}</div>${e.subcategorias?`<div class="info-item"><span class="info-label">Subcategorías:</span> ${e.subcategorias}</div>`:''}</div><div class="modal-description">${e.descripcion}</div>`; if(e.links&&e.links.length) html+=`<div class="links-list">${e.links.map(u=>`<a href="${u}" target="_blank" class="link-item">${u}</a>`).join('')}</div>`; modalInfoScroll.innerHTML=html; modalRevisadoBtn.innerHTML=revisados.has(e.id)?'◆':'◇'; modalFavBtn.textContent=favoritos.has(e.id)?'★':'☆'; modalFavBtn.onclick=()=>{if(favoritos.has(e.id))favoritos.delete(e.id); else favoritos.add(e.id); saveFavoritos(); modalFavBtn.textContent=favoritos.has(e.id)?'★':'☆'; if(onlyFavorites)render(); else{let card=document.querySelector(`.card[data-id="${e.id}"] .fav-star`); if(card)card.textContent=favoritos.has(e.id)?'★':'☆';}}; modalRevisadoBtn.onclick=()=>toggleRevisado(e.id); actualizarFlechasModal();}
function actualizarFlechasModal(){if(!currentOrderedList.length||navegacionBloqueada)return; modalPrevArrow.classList.toggle('disabled',currentModalIndex===0); modalNextArrow.classList.toggle('disabled',currentModalIndex===currentOrderedList.length-1);}
function navegarModal(d){let ni=currentModalIndex+d; if(ni<0||ni>=currentOrderedList.length)return; currentModalIndex=ni; currentModalCreature=currentOrderedList[ni]; actualizarModal();}
function closeModal(){overlayEl.classList.remove('show'); document.body.classList.remove('modal-open'); setTimeout(()=>overlayEl.style.display='none',300);}
function closeAllMenus(){document.querySelectorAll('.filtro-menu, .rev-filter-menu, .orden-menu, .config-menu').forEach(m=>m.classList.remove('show'));}
function initMenus(){document.querySelectorAll('.filtro-group').forEach(g=>{let b=g.querySelector('.filtro-boton'); let m=g.querySelector('.filtro-menu, .rev-filter-menu, .orden-menu, .config-menu'); if(b&&m){b.addEventListener('click',(e)=>{e.stopPropagation(); closeAllMenus(); m.classList.toggle('show');});}}); document.addEventListener('click',()=>closeAllMenus());}
async function cargarDatos(){let resp=await fetch('datos.json'); let data=await resp.json(); especies=Array.isArray(data)?data:[data]; especies.forEach((e,idx)=>{if(!e.id)e.id=`criatura_${idx}`;}); opcionesMorfologia=defaultCategorias.morfologia.options; opcionesTipo=defaultCategorias.tipo.options; opcionesElemento=defaultCategorias.elemento.options; opcionesAvistamiento=defaultCategorias.avistamiento.options; iconMap={morfologia:defaultCategorias.morfologia.icons,tipo:defaultCategorias.tipo.icons,elemento:defaultCategorias.elemento.icons,avistamiento:v=>defaultCategorias.avistamiento.icons[v]||'❓'}; dataLoaded=true; loadFavoritos(); loadRevisados(); loadPersistedState(); await render();}
$('btnLimpiar').onclick=()=>{filtrosState={morfologia:[],tipo:[],elemento:[],avistamiento:[],ubicacion:[],epoca:[],subcategorias:[]}; revFilterState=[]; onlyFavorites=false; searchTerm=''; searchInput.value=''; currentPage=1; render(); persistState();};
favFilterBtn.onclick=()=>{if(favFilterBtn.disabled)return; onlyFavorites=!onlyFavorites; currentPage=1; render(); persistState();};
searchInput.addEventListener('input',()=>{searchTerm=searchInput.value; currentPage=1; render();});
clearSearchBtn.onclick=()=>{searchInput.value=''; searchTerm=''; render();};
cerrarBtn.onclick=closeModal; modalPrevArrow.onclick=()=>navegarModal(-1); modalNextArrow.onclick=()=>navegarModal(1);
$('btnResetTotal').onclick=()=>{localStorage.clear(); filtrosState={morfologia:[],tipo:[],elemento:[],avistamiento:[],ubicacion:[],epoca:[],subcategorias:[]}; revFilterState=[]; onlyFavorites=false; searchTerm=''; searchInput.value=''; revisados.clear(); favoritos.clear(); currentPage=1; render(); persistState(); saveRevisados(); saveFavoritos();};
initMenus(); cargarDatos();
</script>
