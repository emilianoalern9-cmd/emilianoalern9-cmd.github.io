@media(max-width:700px){.main-header{padding:4px 8px;padding-right:45px}.header-corner{max-width:40px}h2{font-size:1.2rem!important;margin-bottom:3px}.filtro-boton,.btn-limpiar,.fav-filter-btn,.pagination-btn,.config-btn,.help-btn{padding:3px 6px!important;font-size:.7rem!important}.result-count{font-size:.65rem!important;padding:1px 6px!important}.pagination-controls input{width:30px!important;font-size:.6rem!important}.search-wrapper input{width:90px!important;font-size:.65rem!important}.filtros-panel{gap:4px}}
.container{max-width:1400px;margin:0 auto;position:relative;z-index:1}

.filtro-boton:disabled,.btn-limpiar:disabled,.fav-filter-btn:disabled,.pagination-btn:disabled,.config-btn:disabled,.limpiar-categoria:disabled{opacity:var(--disabled-opacity);cursor:not-allowed;pointer-events:none}

.filtro-menu input:disabled,.rev-filter-menu input:disabled{opacity:var(--disabled-opacity);cursor:not-allowed}

@media(hover:hover){.filtro-boton:hover:not(:disabled),.btn-limpiar:hover:not(:disabled),.export-btn:hover,.random-btn:hover,.theme-btn:hover,.view-btn:hover,.fav-filter-btn:hover:not(:disabled),.pagination-btn:hover:not(:disabled),.config-btn:hover,.help-btn:hover{background:var(--accent-hover);color:#1a1625;border-color:var(--accent)}.filtro-menu button:hover,.rev-filter-menu label:hover:has(input:not(:disabled)),.orden-menu button:hover,.items-menu button:hover,.csv-menu button:hover,.config-menu button:hover,.config-submenu button:hover{background:var(--accent-hover);color:#1a1625}}

.fav-filter-btn.active,.theme-btn.active{background:var(--accent);color:#1a1625;border-color:var(--accent-hover)}
.filtro-menu,.orden-menu,.items-menu,.csv-menu,.config-menu,.rev-filter-menu,.help-menu{position:absolute;top:110%;left:0;background:rgba(25,20,40,.9);backdrop-filter:blur(8px);border:1px solid var(--border-color);border-radius:20px;padding:8px 12px;min-width:180px;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.4);display:none;flex-direction:column;gap:4px}
.config-menu{min-width:200px}

.config-submenu.show,.filtro-menu.show,.orden-menu.show,.items-menu.show,.csv-menu.show,.config-menu.show,.rev-filter-menu.show,.help-menu.show{display:flex}
.filtro-menu label,.rev-filter-menu label,.orden-menu button,.items-menu button,.csv-menu button,.config-menu button,.config-submenu button{background:none;border:none;text-align:left;padding:4px 8px;font-family:'Cinzel',serif;font-size:.7rem;color:#fff;cursor:pointer;border-radius:30px;transition:all .2s;display:flex;align-items:center;width:100%;justify-content:space-between}

.limpiar-categoria{background:rgba(100,70,40,.7);border:1px solid var(--border-color);border-radius:30px;padding:2px 8px;font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-primary);cursor:pointer;margin-top:4px;text-align:center}
.limpiar-categoria:disabled{opacity:var(--disabled-opacity);cursor:not-allowed;pointer-events:none}
.menu-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;z-index:199}
.temp-floating-menu{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(25,20,40,.95);backdrop-filter:blur(12px);border:1px solid var(--border-color);border-radius:24px;padding:15px 18px;min-width:280px;max-width:90vw;z-index:1001;box-shadow:0 15px 35px rgba(0,0,0,.6);display:none;flex-direction:column;gap:10px}
.temp-floating-menu.show{display:flex}
.temp-floating-menu .temp-header{text-align:center;font-family:'Cinzel',serif;color:var(--accent);font-weight:600;font-size:.85rem;border-bottom:1px solid var(--border-color);padding-bottom:8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.temp-floating-menu .temp-header button{background:none;border:none;font-size:1rem;color:var(--accent);cursor:pointer;padding:0 4px;margin-left:8px}
.temp-floating-menu .slider-container{padding:0 5px}
.temp-floating-menu input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0}

.temp-floating-menu .temp-actions button:hover:not(:disabled){background:var(--accent-hover);color:#1a1625;transform:scale(.96)}
.temp-floating-menu .temp-actions button:active:not(:disabled){transform:scale(.92)}
.temp-floating-menu .temp-actions button:disabled{opacity:var(--disabled-opacity);cursor:not-allowed}
.modal-checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:50vh;overflow-y:auto;padding:4px 8px;margin-bottom:16px}

.modal-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.modal-actions button{flex:0 0 auto;min-width:44px;width:44px;height:44px;background:rgba(100,70,40,.7);text-align:center;padding:0;font-size:1.4rem;border-radius:40px;transition:all .2s;font-family:'Inter',sans-serif;font-weight:500;border:1px solid var(--border-color);color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.modal-actions button:hover:not(:disabled){background:var(--accent-hover);color:#1a1625;transform:scale(.96)}
.modal-actions button:active:not(:disabled){transform:scale(.92)}
.modal-actions button:disabled{opacity:var(--disabled-opacity);cursor:not-allowed}
#csvModal.temp-floating-menu{min-width:360px;max-height:80vh;overflow-y:auto}
#csvModal .csv-checkbox-group{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:40vh;overflow-y:auto;margin-bottom:16px;padding-right:4px}

.result-count{background:rgba(0,0,0,.4);padding:2px 8px;border-radius:40px;font-size:.7rem;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.pagination-controls{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.2);border-radius:40px;padding:2px 5px}
.pagination-controls input{width:40px;text-align:center;background:rgba(25,20,40,.7);border:1px solid var(--border-color);border-radius:30px;padding:2px 0;font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-primary);outline:none}

.grid-wrapper{padding:15px 20px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;opacity:1;transition:opacity .2s}
.card{background:var(--card-bg);border-radius:20px;cursor:pointer;border:1px solid var(--border-color);transition:transform .2s ease,border-color .2s ease,background .2s ease;display:flex;flex-direction:column;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(224,188,108,.5),rgba(180,130,200,.5),rgba(100,160,220,.5),rgba(224,188,108,.5));background-size:300% 300%;opacity:0;transition:opacity .4s ease;z-index:-1;pointer-events:none}
.card:hover::before{opacity:1;animation:gradientShift 4s ease infinite}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.card::after{content:"";position:absolute;top:0;left:0;width:200%;height:120%;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.08) 55%,transparent 65%);opacity:0;transition:opacity .3s ease;z-index:2;pointer-events:none;animation:none}
.card:hover::after{opacity:1;animation:barridoCristal 1.65s linear infinite}
@keyframes barridoCristal{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.img-container{width:100%;height:150px;position:relative;overflow:hidden;border-radius:20px 20px 0 0;background:rgba(0,0,0,.3)}
.img-container img{width:100%;height:100%;object-fit:cover}
.card-footer-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;gap:8px;margin-top:auto;position:relative;z-index:2}
.badges-wrapper{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.card-actions{display:flex;gap:6px;align-items:center}
.mini-badge{width:20px;height:20px;border-radius:30px;background:rgba(0,0,0,.7);backdrop-filter:none;display:flex;align-items:center;justify-content:center;font-size:10px;border:1px solid var(--border-color);cursor:pointer;transition:transform .1s;padding:0}
.mini-badge:active{transform:scale(.96)}
.card b{display:block;padding:12px 8px 6px;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:.9rem;background:var(--title-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .05s linear;flex:1;position:relative;z-index:2}
.card b.wrap-name{white-space:normal!important;overflow:visible;text-overflow:unset;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-height:calc(2*1.2em+12px);line-height:1.2;padding-bottom:6px}
.modal-header h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 100px);transition:font-size .05s linear;font-family:'Cinzel',serif;font-weight:800;background:var(--title-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.modal-header h3.wrap-name{white-space:normal!important}
#detalle{position:relative;overflow:hidden;border:1px solid var(--border-color)}
#detalle::before{content:'';position:absolute;bottom:0;left:0;width:100%;height:35%;background:linear-gradient(to bottom,transparent 0%,rgba(219,186,108,.15) 100%);pointer-events:none;z-index:1}
#detalle>*{position:relative;z-index:2}
.fav-star,.revisado-icon,.copy-link{cursor:pointer;font-size:1.2rem;transition:transform .1s;background:none;border:none;font-family:inherit;color:var(--accent);padding:2px;line-height:1}
.fav-star:active,.copy-link:active{transform:scale(.95)}
.fav-star.active{color:gold;text-shadow:0 0 2px orange}
.revisado-icon{color:var(--accent)}
.temp-tooltip{position:fixed;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);color:var(--accent);font-family:'Cinzel',serif;font-size:.7rem;padding:4px 8px;border-radius:20px;border:1px solid var(--border-color);white-space:nowrap;z-index:10001;pointer-events:none;transition:opacity .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.no-results{text-align:center;padding:30px 20px;font-family:'Cinzel',serif;color:var(--accent);font-size:1rem}
.no-results img{display:block;margin:20px auto 0;max-width:200px;border-radius:16px;border:1px solid var(--border-color);background:rgba(0,0,0,.3)}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(8,5,18,.94);backdrop-filter:blur(12px);display:none;justify-content:center;align-items:center;z-index:1000;opacity:0;transition:opacity .3s ease}
#overlay.show{display:flex;opacity:1}
.modal-container{position:relative;width:90%;max-width:850px;margin:auto}
.modal-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border-radius:12px;width:32px;height:110px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s;z-index:1010;border:1px solid var(--border-color);opacity:.85;font-size:24px;color:var(--accent);font-weight:300}
.modal-arrow:hover{background:rgba(0,0,0,.8);border-color:var(--accent-hover);opacity:1}

.modal-arrow.disabled{opacity:.3;pointer-events:none}
.modal-arrow.prev{left:-20px}
.modal-arrow.next{right:-20px}

#detalle{background:var(--card-bg);border-radius:30px;border:1px solid var(--border-color);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:12px 18px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{margin:0}
.modal-header-actions{display:flex;gap:10px;align-items:center}

.modal-header-actions button:active{transform:scale(.95)}
#cerrar{font-size:1.5rem;cursor:pointer;color:var(--accent)}
.modal-body{display:flex;gap:20px;padding:16px 20px;overflow-y:auto;flex:1}
.info-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-right:8px;max-height:65vh}
.image-fixed{flex:.6;min-width:120px;text-align:center}
.image-fixed img{max-width:100%;max-height:180px;object-fit:contain;border-radius:20px;border:1px solid var(--border-color);background:#000}
.info-grid{background:rgba(0,0,0,.4);border-radius:20px;padding:10px 14px;margin-bottom:12px}
.info-item{display:flex;gap:8px;font-size:.75rem;margin-bottom:4px;flex-wrap:wrap}
.info-label{font-weight:700;color:var(--accent);min-width:90px}
.modal-description{line-height:1.5;font-size:.85rem;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}
.links-list{margin-top:12px;border-top:1px dashed var(--border-color);padding-top:8px}

</head>

<div class="filtro-group"><button class="filtro-boton" id="btnEpoca" title="Época" aria-label="Filtrar por época">📅</button></div>
<div class="filtro-group"><button class="filtro-boton" id="btnSubcategorias" title="Subcategorías" aria-label="Filtrar por subcategorías">🏷️</button></div>

</div>
<script>
// ==================== CONFIGURACIÓN Y ESTADO ====================
const STORAGE_VERSION = 12;
const defaultCategorias = {
morfologia: { options: ["Humano","Humanoide","Mamífero","Híbrido","Ave","Reptil","Pez","Insecto","Amorfo","Etéreo","Artificial","Otro"], icons: {"Humano":"🧑","Humanoide":"🧝","Mamífero":"🦌","Híbrido":"🦄","Ave":"🕊️","Reptil":"🐍","Pez":"🐟","Insecto":"🐞","Amorfo":"🌀","Etéreo":"✨","Artificial":"🤖","Otro":"❓"}, buttonIcon: "🔮", buttonTitle: "Morfología" },
tipo: { options: ["Mitológico","Criptido","Difuso"], icons: {"Mitológico":"🏛️","Criptido":"🐾","Difuso":"🌫️"}, buttonIcon: "🌙", buttonTitle: "Tipo de ser" },
elemento: { options: ["Aéreo","Acuático","Terrestre","Subterráneo","Anfibio","Misceláneo"], icons: {"Aéreo":"💨","Acuático":"💧","Terrestre":"🌿","Subterráneo":"⛰️","Anfibio":"🐸","Misceláneo":"⚙️"}, buttonIcon: "💧", buttonTitle: "Elemento" },
avistamiento: { options: ["Grabado / Capturado","Documentado","Crónicas","Avistamiento","Ficción","Tradición oral","Difuso"], icons: {"Grabado / Capturado":"📹","Documentado":"📜","Crónicas":"📖","Avistamiento":"👁️","Ficción":"📚","Tradición oral":"🗣️","Difuso":"❓"}, buttonIcon: "👁️", buttonTitle: "Avistamiento" }
};

let especies = [], filtrosState = { morfologia: [], tipo: [], elemento: [], avistamiento: [], ubicacion: [], epoca: [], subcategorias: [] },
revFilterState = [], currentPage = 1, perPage = 24, dataLoaded = false, onlyFavorites = false,
currentOrderedList = [], currentModalIndex = -1, currentModalCreature = null, searchTerm = '',
navegacionBloqueada = false, revisados = new Set, modoRevision = "automatico", favoritos = new Set,
csvFields = ["id","nombre","morfologia","tipo","elemento","avistamiento","ubicacion","epoca","subcategorias","descripcion","links"],
selectedFields = csvFields.filter(f => f !== 'nombre'), csvMenu = null,
ubicacionModal = null, epocaModal = null, subcategoriasModal = null, ordenActual = "nombre_asc",
touchStartX = 0, tempPerPage = 24, tempModoRevision = "automatico", panelVisible = true, menuOverlay = null,
headerOriginalZIndex = '100';

const opcionesMorfologia = defaultCategorias.morfologia.options,
opcionesTipo = defaultCategorias.tipo.options,
opcionesElemento = defaultCategorias.elemento.options,
opcionesAvistamiento = defaultCategorias.avistamiento.options;

const iconMap = {
morfologia: defaultCategorias.morfologia.icons,
tipo: defaultCategorias.tipo.icons,
elemento: defaultCategorias.elemento.icons,
avistamiento: v => defaultCategorias.avistamiento.icons[v] || "❓"
};

// ==================== ELEMENTOS DEL DOM ====================
const $ = id => document.getElementById(id);
const btnMorfologia = $('btnMorfologia'), btnTipo = $('btnTipo'), btnElemento = $('btnElemento'),
btnAvistamiento = $('btnAvistamiento'), btnUbicacion = $('btnUbicacion'), btnEpoca = $('btnEpoca'),
btnSubcategorias = $('btnSubcategorias'), btnRevFilter = $('btnRevFilter'), btnLimpiar = $('btnLimpiar'),
btnOrden = $('btnOrden'), ordenMenu = $('ordenMenu'), favFilterBtn = $('favFilterBtn'),
configBtn = $('configBtn'), configMenu = $('configMenu'), revFilterMenu = $('menu-rev'),
overlayEl = $('overlay'), modalTitle = $('modal-title'), modalImg = $('modal-image'),
modalInfoScroll = $('modal-info-scroll'), modalRevisadoBtn = $('modalRevisado'),
modalFavBtn = $('modalFav'), cerrarBtn = $('cerrar'), filtrosPanel = $('filtrosPanel'),
mainTitle = $('mainTitle'), headerCornerImg = $('headerCornerImg'), mainHeader = $('mainHeader'),
headerContainer = $('headerContainer'), gridDiv = $('grid'), resultSpan = $('resultText'),
searchInput = $('searchInput'), clearSearchBtn = $('clearSearch'), searchDatalist = $('searchSuggestions'),
paginationControlsDiv = $('paginationControls'), modalPrevArrow = $('modalPrevArrow'),
modalNextArrow = $('modalNextArrow'), btnResetTotal = $('btnResetTotal');

// Configurar botones iniciales
[
{ btn: btnMorfologia, config: defaultCategorias.morfologia },
{ btn: btnTipo, config: defaultCategorias.tipo },
{ btn: btnElemento, config: defaultCategorias.elemento },
{ btn: btnAvistamiento, config: defaultCategorias.avistamiento }
].forEach(({ btn, config }) => {
btn.textContent = config.buttonIcon;
btn.title = config.buttonTitle;
});

// ==================== UTILITIES ====================
const getIconForMorfologia = e => iconMap.morfologia[e] || "🔮";
const getIconForTipo = e => iconMap.tipo[e] || "🌙";
const getIconForElemento = e => iconMap.elemento[e] || "💧";
const getIconForAvistamiento = v => iconMap.avistamiento(v);

const saveLocal = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const loadLocal = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null } catch(e) { return null } };
const persistState = () => { saveLocal('catalogo_filtros', filtrosState); saveLocal('catalogo_orden', ordenActual); saveLocal('catalogo_perpage', perPage); saveLocal('catalogo_onlyFav', onlyFavorites); saveRevFilterState(); };

// ==================== TOOLTIP ====================
let tooltipElement = null, tooltipTimeout = null;
const crearTooltipElement = () => { if(tooltipElement) return; tooltipElement = document.createElement("div"); tooltipElement.className = "temp-tooltip"; tooltipElement.style.opacity = "0"; document.body.appendChild(tooltipElement); };
const showTooltip = (text, x, y, duration = 1500) => {
crearTooltipElement();
if(tooltipTimeout) clearTimeout(tooltipTimeout);
tooltipElement.textContent = text;
tooltipElement.style.left = x + "px";
tooltipElement.style.top = y + "px";
tooltipElement.style.opacity = "1";
const rect = tooltipElement.getBoundingClientRect();
let finalX = x, finalY = y;
if(finalX + rect.width > window.innerWidth - 10) finalX = window.innerWidth - rect.width - 10;
if(finalY + rect.height > window.innerHeight - 10) finalY = window.innerHeight - rect.height - 10;
if(finalX < 10) finalX = 10;
if(finalY < 10) finalY = 10;
tooltipElement.style.left = finalX + "px";
tooltipElement.style.top = finalY + "px";
tooltipTimeout = setTimeout(() => hideTooltip(), duration);
};
const hideTooltip = () => { if(!tooltipElement) return; tooltipElement.style.opacity = "0"; if(tooltipTimeout) { clearTimeout(tooltipTimeout); tooltipTimeout = null; } };
document.addEventListener("click", e => { if(tooltipElement && e.target !== tooltipElement) hideTooltip(); });

// ==================== ÍNDICES Y FILTROS ====================
let idxMorfologia, idxTipo, idxElemento, idxAvistamiento, idxUbicacion, idxEpoca, idxSubcategorias;

const buildIndexes = () => {
idxMorfologia = new Map(); idxTipo = new Map(); idxElemento = new Map(); idxAvistamiento = new Map();
idxUbicacion = new Map(); idxEpoca = new Map(); idxSubcategorias = new Map();
for(let e of especies) {
const id = e.id;
[{ map: idxMorfologia, val: e.morfologia }, { map: idxTipo, val: e.tipo }, { map: idxElemento, val: e.elemento }, { map: idxAvistamiento, val: e.avistamiento }]
.forEach(({ map, val }) => { if(!map.has(val)) map.set(val, new Set); map.get(val).add(id); });
if(e.ubicacion) { if(!idxUbicacion.has(e.ubicacion)) idxUbicacion.set(e.ubicacion, new Set); idxUbicacion.get(e.ubicacion).add(id); }
if(e.epoca) { if(!idxEpoca.has(e.epoca)) idxEpoca.set(e.epoca, new Set); idxEpoca.get(e.epoca).add(id); }
if(e.subcategorias) e.subcategorias.split(',').forEach(s => { let t = s.trim(); if(t) { if(!idxSubcategorias.has(t)) idxSubcategorias.set(t, new Set); idxSubcategorias.get(t).add(id); } });
}
};

let baseFilterVersion = 0, cachedBaseIds = null, cachedBaseVersion = -1, cachedIgnoreCat = null;
const categoriasFiltro = ['morfologia','tipo','elemento','avistamiento','ubicacion','epoca','subcategorias'];
const invalidateBaseCache = () => { baseFilterVersion++; invalidateCountCaches(); };

const buildPredicate = (ignoreCat = null, extraCheck = null) => e => {
for(let cat of categoriasFiltro) {
if(ignoreCat === cat) continue;
const state = filtrosState[cat];
if(state.length) {
if(cat === 'subcategorias') {
const subcats = e.subcategorias ? e.subcategorias.split(',').map(s => s.trim()).filter(s => s) : [];
if(!state.some(sel => subcats.includes(sel))) return false;
} else if(!state.includes(e[cat])) return false;
}
}
if(onlyFavorites && !favoritos.has(e.id)) return false;
if(searchTerm.trim() && !e.nombre.toLowerCase().includes(searchTerm.toLowerCase())) return false;
if(revFilterState.length && ignoreCat !== 'revisado') {
const r = revisados.has(e.id);
if(!(revFilterState.includes("revisado") && revFilterState.includes("no_revisado")) && ((revFilterState.includes("revisado") && !r) || (revFilterState.includes("no_revisado") && r))) return false;
}
return extraCheck ? extraCheck(e) : true;
};

const getBaseFilteredIds = (ignoreCat = null) => {
if(baseFilterVersion === cachedBaseVersion && ignoreCat === cachedIgnoreCat && cachedBaseIds !== null) return cachedBaseIds;
const pred = buildPredicate(ignoreCat), ids = new Set();
for(let e of especies) if(pred(e)) ids.add(e.id);
cachedBaseIds = ids; cachedBaseVersion = baseFilterVersion; cachedIgnoreCat = ignoreCat;
return ids;
};

const aplicarFiltrosCompletos = () => especies.filter(buildPredicate());

const ordenarEspecies = lista => {
const [campo, dir] = ordenActual.split('_');
const order = dir === "asc" ? 1 : -1;
return [...lista].sort((a, b) => {
let va = a[campo] || "", vb = b[campo] || "";
return va < vb ? -order : va > vb ? order : 0;
});
};

// ==================== CACHÉ DE CONTADORES ====================
let filterCountCache = new Map, revCountCache = { revisado: -1, no_revisado: -1 };
const clearFilterCountCache = () => filterCountCache.clear();
const invalidateCountCaches = () => { clearFilterCountCache(); revCountCache = { revisado: -1, no_revisado: -1 }; };

const cachedContarConOpcion = (categoria, opcion) => {
const key = `${categoria}_${opcion}`;
if(filterCountCache.has(key)) return filterCountCache.get(key);
let count = 0;
if(categoria === 'revisado') count = contarPorEstado(opcion);
else {
const baseIds = getBaseFilteredIds(categoria);
if(baseIds.size) {
const map = { morfologia: idxMorfologia, tipo: idxTipo, elemento: idxElemento, avistamiento: idxAvistamiento, ubicacion: idxUbicacion, epoca: idxEpoca, subcategorias: idxSubcategorias }[categoria];
const opSet = map ? map.get(opcion) : null;
if(opSet && opSet.size) count = baseIds.size < opSet.size ? [...baseIds].filter(id => opSet.has(id)).length : [...opSet].filter(id => baseIds.has(id)).length;
}
}
filterCountCache.set(key, count);
return count;
};
const contarConOpcion = cachedContarConOpcion;

const cachedContarPorEstado = estado => {
if(revCountCache[estado] !== -1) return revCountCache[estado];
const baseIds = getBaseFilteredIds(null);
if(!baseIds.size) { revCountCache[estado] = 0; return 0; }
let count = 0;
for(let id of baseIds) { const r = revisados.has(id); if(estado === "revisado" ? r : !r) count++; }
revCountCache[estado] = count;
return count;
};
const contarPorEstado = cachedContarPorEstado;

// ==================== PERSISTENCIA ====================
const resetAllData = () => {
localStorage.clear();
filtrosState = { morfologia: [], tipo: [], elemento: [], avistamiento: [], ubicacion: [], epoca: [], subcategorias: [] };
revFilterState = []; revisados.clear(); favoritos.clear(); onlyFavorites = false;
ordenActual = "nombre_asc"; perPage = 24; currentPage = 1; searchTerm = '';
saveLocal('catalogo_version', STORAGE_VERSION); persistState(); saveRevisados(); saveFavoritos();
};

const checkVersion = () => { const v = loadLocal('catalogo_version'); if(v !== STORAGE_VERSION) { resetAllData(); return false; } return true; };
const loadRevisados = () => { const s = loadLocal('catalogo_revisados'); if(s) revisados = new Set(s); };
const saveRevisados = () => saveLocal('catalogo_revisados', [...revisados]);
const loadModoRevision = () => { const m = localStorage.getItem('catalogo_modo_revision'); if(m) modoRevision = m; tempModoRevision = modoRevision; };
const saveModoRevision = () => localStorage.setItem('catalogo_modo_revision', modoRevision);
const loadFavoritos = () => { const f = loadLocal('catalogo_favoritos'); if(f) favoritos = new Set(f); actualizarEstadoFavoritosYBoton(); };
const saveFavoritos = () => { saveLocal('catalogo_favoritos', [...favoritos]); actualizarEstadoFavoritosYBoton(); };
const loadRevFilterState = () => { const s = loadLocal('catalogo_rev_filter'); revFilterState = s || []; };
const saveRevFilterState = () => { saveLocal('catalogo_rev_filter', revFilterState); updateRevFilterBadge(); };

const loadPersistedState = () => {
if(!checkVersion()) return;
const f = loadLocal('catalogo_filtros'); if(f) filtrosState = f;
const o = loadLocal('catalogo_orden'); ordenActual = o || "nombre_asc";
const pp = loadLocal('catalogo_perpage'); if(pp) perPage = +pp;
const of = loadLocal('catalogo_onlyFav'); onlyFavorites = (of === true || of === 'true');
loadRevFilterState();
if(especies.length) {
for(let cat of ['morfologia','tipo','elemento','avistamiento','ubicacion','epoca']) {
const valoresExistentes = new Set(especies.map(e => e[cat]).filter(v => v));
if(filtrosState[cat] && filtrosState[cat].length) filtrosState[cat] = filtrosState[cat].filter(v => valoresExistentes.has(v));
}
const todasSubs = new Set();
especies.forEach(e => { if(e.subcategorias) e.subcategorias.split(',').forEach(s => { let t = s.trim(); if(t) todasSubs.add(t); }); });
if(filtrosState.subcategorias && filtrosState.subcategorias.length) filtrosState.subcategorias = filtrosState.subcategorias.filter(v => todasSubs.has(v));
persistState();
}
actualizarTooltipOrden(); actualizarEstadoFavoritosYBoton();
};

const actualizarTooltipOrden = () => {
const m = { "nombre_asc": "Alfabético A→Z", "nombre_desc": "Alfabético Z→A", "morfologia_asc": "Morfología A→Z", "morfologia_desc": "Morfología Z→A", "tipo_asc": "Tipo A→Z", "tipo_desc": "Tipo Z→A", "elemento_asc": "Elemento A→Z", "elemento_desc": "Elemento Z→A", "avistamiento_asc": "Avistamiento A→Z", "avistamiento_desc": "Avistamiento Z→A" };
btnOrden.title = m[ordenActual] || "Ordenar";
};

// ==================== FAVORITOS Y REVISADOS ====================
const isFavorito = id => favoritos.has(id);
const actualizarEstadoFavoritosYBoton = () => { const h = favoritos.size > 0; favFilterBtn.disabled = !h; if(!h && onlyFavorites) { onlyFavorites = false; render(); } };

const toggleFavorito = (id, uiOnly = false) => {
favoritos.has(id) ? favoritos.delete(id) : favoritos.add(id);
saveFavoritos();
if(!uiOnly) { if(onlyFavorites) render(); else { actualizarEstrellaEnTarjeta(id); if(currentModalCreature && currentModalCreature.id === id && modalFavBtn) modalFavBtn.textContent = favoritos.has(id) ? "★" : "☆"; } }
updateFilterBadges(); actualizarEstadoFavoritosYBoton(); invalidateBaseCache();
};

const actualizarEstrellaEnTarjeta = id => {
const card = document.querySelector(`.card[data-id="${id}"]`);
if(card) { const fb = card.querySelector(".fav-star"); if(fb) fb.textContent = favoritos.has(id) ? "★" : "☆"; }
};

const toggleRevisado = (id, esAuto = false) => {
const estaba = revisados.has(id);
if(modoRevision === "bloqueo") {
if(!esAuto && estaba) { if(confirm("¿Estás seguro de marcar como NO revisado?")) { revisados.delete(id); saveRevisados(); actualizarIconoRevisadoTarjeta(id); afterRevisadoToggle(); } return; }
if(!esAuto && !estaba) return;
if(!estaba) { revisados.add(id); saveRevisados(); actualizarIconoRevisadoTarjeta(id); afterRevisadoToggle(); return; }
}
estaba ? revisados.delete(id) : revisados.add(id);
saveRevisados(); actualizarIconoRevisadoTarjeta(id); afterRevisadoToggle();
};

const afterRevisadoToggle = () => {
invalidateBaseCache(); actualizarEstadoBotonRevisado();
(revFilterState.length === 0 || revFilterState.length === 2) ? (updateFilterBadges(), regenerarMenus(), updateSearchSuggestions(), actualizarContadorYPaginacion(), adjustTitleFontSize(), actualizarImagenEsquina()) : render();
};

const actualizarDisabledOtrosFiltros = () => {
[{ btn: btnMorfologia, cat: 'morfologia' }, { btn: btnTipo, cat: 'tipo' }, { btn: btnElemento, cat: 'elemento' }, { btn: btnAvistamiento, cat: 'avistamiento' }, { btn: btnUbicacion, cat: 'ubicacion' }, { btn: btnEpoca, cat: 'epoca' }, { btn: btnSubcategorias, cat: 'subcategorias' }]
.forEach(({ btn, cat }) => { if(btn) btn.disabled = (getCachedOpcionesConDatos(cat) <= 1); });
};

const actualizarEstadoBotonRevisado = () => {
invalidateBaseCache();
const opcionesData = (contarPorEstado("revisado") > 0 ? 1 : 0) + (contarPorEstado("no_revisado") > 0 ? 1 : 0);
btnRevFilter.disabled = opcionesData <= 1;
};

const marcarRevisadoPorLink = id => { if(!revisados.has(id)) toggleRevisado(id, true); };

const actualizarIconoRevisadoTarjeta = id => {
const estado = revisados.has(id), icono = estado ? "◆" : "◇";
document.querySelectorAll(`.card[data-id="${id}"] .revisado-icon`).forEach(ri => {
ri.innerHTML = icono;
ri.classList.toggle("revisado", estado);
ri.classList.toggle("no_revisado", !estado);
ri.title = estado ? "Revisado" : "No revisado";
});
if(currentModalCreature && currentModalCreature.id === id && modalRevisadoBtn) {
modalRevisadoBtn.innerHTML = icono;
modalRevisadoBtn.classList.toggle("revisado", estado);
modalRevisadoBtn.classList.toggle("no_revisado", !estado);
modalRevisadoBtn.title = estado ? "Revisado" : "No revisado";
}
};

const updateRevFilterBadge = () => {
btnRevFilter.title = revFilterState.length === 0 ? "Filtrar por revisado" : revFilterState.length === 1 ? `Filtrar: ${revFilterState[0] === "revisado" ? "Revisado" : "No revisado"}` : "Filtrar: revisado y no revisado";
actualizarFiltroActivo(btnRevFilter, revFilterState.length > 0);
};

// ==================== IMÁGENES ====================
const setImageWithFallback = (imgElement, nombre, transformStyle = "", isPrioritario = false) => {
const extensions = ['jpg','jpeg','png'];
let currentExtIndex = 0;
if(isPrioritario) { imgElement.fetchPriority = "high"; imgElement.loading = "eager"; } else imgElement.loading = "lazy";
const parent = imgElement.parentNode;
if(parent) parent.querySelectorAll('.img-placeholder').forEach(el => el.remove());
(function tryNext() {
if(currentExtIndex >= extensions.length) {
imgElement.style.display = "none";
if(!parent.querySelector(".img-placeholder")) {
const placeholder = document.createElement("div");
placeholder.className = "img-placeholder";
placeholder.style.cssText = "width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--accent);background:rgba(0,0,0,.3);border-radius:16px;";
placeholder.textContent = "🖼️";
placeholder.setAttribute("aria-label", "Imagen no disponible");
parent.appendChild(placeholder);
}
return;
}
const ext = extensions[currentExtIndex];
imgElement.src = `img/${encodeURIComponent(nombre)}.${ext}`;
imgElement.style.display = "block";
if(transformStyle) imgElement.style.transform = transformStyle;
imgElement.onerror = () => { currentExtIndex++; tryNext(); };
imgElement.onload = () => { parent.querySelectorAll('.img-placeholder').forEach(el => el.remove()); imgElement.style.display = "block"; };
})();
};

const crearImg = (e, isPrioritario = false) => {
const img = document.createElement("img");
setImageWithFallback(img, e.nombre, `translate(${e.posX || 0}px, ${e.posY || 0}px) scale(${e.zoom || 1})`, isPrioritario);
return img;
};

// ==================== MENÚS ====================
const createMenuOverlay = (zIndex, onClick) => {
removeMenuOverlay();
const overlay = document.createElement('div');
overlay.className = 'menu-overlay';
overlay.style.zIndex = zIndex;
overlay.onclick = onClick;
document.body.appendChild(overlay);
menuOverlay = overlay;
mainHeader.style.zIndex = '201';
};

const removeMenuOverlay = () => {
if(menuOverlay) { menuOverlay.remove(); menuOverlay = null; mainHeader.style.zIndex = headerOriginalZIndex; }

const levenshteinDistance = (a, b) => {
if(!a.length) return b.length;
if(!b.length) return a.length;
const m = [];
for(let i = 0; i <= b.length; i++) m[i] = [i];
for(let j = 0; j <= a.length; j++) m[0][j] = j;
for(let i = 1; i <= b.length; i++) for(let j = 1; j <= a.length; j++) m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1]+(a[j-1] === b[i-1] ? 0 : 1));
return m[b.length][a.length];
};

while(!hayError) {
try {
const respuesta = await fetch(`dtsk/Datos${indice}.json?t=${Date.now()}`, { cache: 'no-store' });
if(!respuesta.ok) { hayError = true; break; }
const datos = await respuesta.json();
Array.isArray(datos) ? todosLosDatos.push(...datos) : todosLosDatos.push(datos);
indice++;
} catch(error) { hayError = true; break; }
}
return todosLosDatos;
};

if(datosCombinados.length === 0) throw new Error('No se pudieron cargar datos desde dtsk/Datos*.json');
especies = datosCombinados.map((criatura, idx) => ({
id: criatura.id || `criatura_${idx}_${Date.now()}_${Math.random()}`,
nombre: criatura.nombre || 'Sin nombre',
morfologia: criatura.morfologia || 'Desconocido',
tipo: criatura.tipo || 'Desconocido',
elemento: criatura.elemento || 'Desconocido',
avistamiento: criatura.avistamiento || 'Desconocido',
ubicacion: criatura.ubicacion || '',
epoca: criatura.epoca || '',
subcategorias: criatura.subcategorias || '',
descripcion: criatura.descripcion || '',
links: criatura.links || [],
posX: criatura.posX !== undefined ? criatura.posX : (criatura.posx !== undefined ? criatura.posx : 0),
posY: criatura.posY !== undefined ? criatura.posY : (criatura.posy !== undefined ? criatura.posy : 0),
zoom: criatura.zoom || 1
}));
dataLoaded = true;
buildIndexes();
loadFavoritos();
loadRevisados();
loadModoRevision();
loadPersistedState();
updateSearchSuggestions();
updateClearSearchState();
regenerarMenus();
await render();
window.addEventListener('resize', () => {
if(dataLoaded) {
debouncedAdjustTitleFontSize();
if(overlayEl.classList.contains("show")) adjustModalTitleFontSize();
debouncedActualizarImagenEsquina();
}
});
actualizarImagenEsquina();
const hash = window.location.hash.substring(1);
if(hash.startsWith("id=")) {
const id = decodeURIComponent(hash.substring(3)),
cr = especies.find(e => e.id === id);
if(cr) setTimeout(() => abrirDetalle(cr), 300);
}
window.scrollTo({top: 0, behavior: 'instant'});
} catch(err) {
console.error("Error cargando datos:", err);
especies = [];
dataLoaded = true;
render();
}
};

const inicializarApp = async () => { await cargarDatos(); };
inicializarApp();
</script>
</body>
</html>
