<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Índice enciclopédico de seres míticos, criptidos y entidades de la tradición oral mundial.">
  <title>Índice de Seres Místicos</title>

  <link rel="icon" href="img2/icono4.png" type="image/png">

  <link rel="preload" as="image" href="img2/anuncio1.gif">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/menus.css">
</head>
<body>

<!-- ══ HEADER ═══════════════════════════════════════════════ -->
<div class="main-header" id="mainHeader">
  <img id="headerCornerImg" class="header-corner" alt="Contacto" aria-label="Abrir contacto" role="button">
  <div class="container" id="headerContainer">

    <h2 id="mainTitle" title="Clic para mostrar/ocultar filtros" aria-label="Índice de Seres Místicos">
      ✦ ÍNDICE DE SERES MÍSTICOS ✦
    </h2>

    <div class="filtros-panel" id="filtrosPanel">

      <!-- Morfología -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnMorfologia" aria-label="Filtrar por morfología"></button>
        <div class="filtro-menu" id="menu-morfologia"></div>
      </div>

      <!-- Tipo -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnTipo" aria-label="Filtrar por tipo"></button>
        <div class="filtro-menu" id="menu-tipo"></div>
      </div>

      <!-- Elemento -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnElemento" aria-label="Filtrar por elemento"></button>
        <div class="filtro-menu" id="menu-elemento"></div>
      </div>

      <!-- Avistamiento -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnAvistamiento" aria-label="Filtrar por avistamiento"></button>
        <div class="filtro-menu" id="menu-avistamiento"></div>
      </div>

      <!-- Ubicación (modal flotante) -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnUbicacion" title="Ubicación" aria-label="Filtrar por ubicación">📍</button>
      </div>

      <!-- Época (modal flotante) -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnEpoca" title="Época" aria-label="Filtrar por época">📅</button>
      </div>

      <!-- Subcategorías (modal flotante) -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnSubcategorias" title="Subcategorías" aria-label="Filtrar por subcategorías">🏷️</button>
      </div>

      <!-- Revisado -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnRevFilter" title="Revisado" aria-label="Filtrar por estado de revisión">◆</button>
        <div class="rev-filter-menu" id="menu-rev"></div>
      </div>

      <!-- Limpiar filtros -->
      <button id="btnLimpiar" class="btn-limpiar" title="Limpiar filtros activos" aria-label="Limpiar filtros">🧹</button>

      <!-- Orden -->
      <div class="filtro-group">
        <button class="filtro-boton" id="btnOrden" title="Ordenar" aria-label="Cambiar orden">📊</button>
        <div class="orden-menu" id="ordenMenu"></div>
      </div>

      <!-- Solo favoritos -->
      <button id="favFilterBtn" class="fav-filter-btn" title="Solo favoritos" aria-label="Mostrar solo favoritos">⭐</button>

      <!-- Reset total -->
      <button id="btnResetTotal" class="btn-limpiar" title="Resetear filtros y búsqueda" aria-label="Resetear todo">♻️</button>

      <!-- Configuración -->
      <div class="filtro-group">
        <button class="config-btn" id="configBtn" title="Configuración" aria-label="Abrir configuración">⚙️</button>
        <div id="configMenu" class="config-menu"></div>
      </div>

      <!-- Contador -->
      <div class="result-count">
        <span>🐉</span>
        <span id="resultText">0-0 / 0</span>
      </div>

      <!-- Paginación -->
      <div id="paginationControls" class="pagination-controls"></div>

      <!-- Búsqueda -->
      <div class="search-wrapper">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Buscar…"
          list="searchSuggestions"
          autocomplete="off"
          aria-label="Buscar criatura"
          spellcheck="false"
        >
        <button id="clearSearch" class="search-clear disabled" aria-label="Limpiar búsqueda" title="Limpiar">✕</button>
        <datalist id="searchSuggestions"></datalist>
      </div>

    </div><!-- /filtros-panel -->
  </div><!-- /container -->
</div><!-- /main-header -->


<!-- ══ GRID ══════════════════════════════════════════════════ -->
<div class="grid-wrapper">
  <div id="grid" class="grid" role="list" aria-label="Catálogo de seres místicos"></div>
</div>


<!-- ══ MODAL DE DETALLE ══════════════════════════════════════ -->
<div id="overlay" role="dialog" aria-modal="true" aria-label="Detalle del ser">
  <div class="modal-container">

    <button class="modal-arrow prev" id="modalPrevArrow" aria-label="Criatura anterior">‹</button>

    <div id="detalle">
      <div class="modal-header">
        <h3 id="modal-title">Nombre</h3>
        <div class="modal-header-actions">
          <button id="modalFav"      class="fav-star"               title="Marcar como favorito"  aria-label="Favorito">☆</button>
          <button id="modalRevisado" class="revisado-icon no_revisado" title="Marcar como revisado" aria-label="Revisado">◇</button>
          <button id="cerrar"        title="Cerrar"                  aria-label="Cerrar modal">✕</button>
        </div>
      </div>

      <div class="modal-body">
        <div class="info-scroll" id="modal-info-scroll"></div>
        <div class="image-fixed">
          <img id="modal-image" src="" alt="Imagen de la criatura">
        </div>
      </div>
    </div><!-- /detalle -->

    <button class="modal-arrow next" id="modalNextArrow" aria-label="Criatura siguiente">›</button>

  </div><!-- /modal-container -->
</div><!-- /overlay -->


<!-- ══ SCRIPTS (orden de dependencias) ═══════════════════════
     config → state → cache → ui → menus → creatures → app
═══════════════════════════════════════════════════════════════ -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/cache.js"></script>
<script src="js/ui.js"></script>
<script src="js/menus.js"></script>
<script src="js/creatures.js"></script>
<script src="js/app.js"></script>

</body>
</html>
